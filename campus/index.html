<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relvia Campus</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js"></script>

<style>
:root{
  --background:#0a0806; --glass:rgba(18,14,10,.6); --surface-light:#1c150d; --surface:rgba(20,16,11,.78);
  --border:#2a2018; --border-soft:#1c1610; --gold-start:#f2c766; --gold-end:#b9832f; --gold:#e0b158;
  --text:#f5f1ea; --muted:#a89e8f; --muted-soft:#6b6255; --live-red:#e0574f;
  --font-display:"Playfair Display",serif; --font-body:"Inter",sans-serif;
}
*{ margin:0; padding:0; box-sizing:border-box; font-family:var(--font-body); }
body{
  color:var(--text); min-height:100vh;
  background:
    radial-gradient(ellipse 900px 500px at 15% -5%, rgba(217,169,75,.10), transparent 60%),
    var(--background);
  background-attachment:fixed;
}
a{ text-decoration:none; color:inherit; }
button, input{ font-family:inherit; }
button{ cursor:pointer; border:none; background:none; color:inherit; font-size:inherit; }
img, video{ max-width:100%; display:block; }

.topbar{
  position:fixed; top:0; left:0; right:0; height:76px; display:flex; align-items:center; justify-content:space-between;
  padding:0 32px; background:rgba(5,5,5,.82); backdrop-filter:blur(20px); border-bottom:1px solid var(--border-soft); z-index:999;
}
.brand{ display:flex; align-items:center; gap:12px; }
.brand-badge{
  width:38px; height:38px; border-radius:50%; background:#000;
  background-image:radial-gradient(circle at 32% 22%, rgba(242,199,102,.28), transparent 65%);
  border:1.5px solid var(--gold-end); display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-style:italic; font-weight:700; font-size:19px; color:var(--gold-start);
}
.brand-name{ font-family:var(--font-display); font-weight:700; font-size:19px; }
.age-pill{
  background:linear-gradient(135deg,var(--gold-start),var(--gold-end)); color:#000;
  font-size:10px; font-weight:800; padding:3px 10px; border-radius:999px; margin-left:8px;
}
.header-right{ display:flex; align-items:center; gap:14px; }
.go-live-btn{ font-size:13px; font-weight:800; color:#000; background:linear-gradient(135deg,var(--gold-start),var(--gold-end)); padding:9px 18px; border-radius:12px; }
.go-live-btn:hover{ opacity:.88; }
.nav-icon-btn{
  width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  background:var(--surface-light); border:1px solid var(--border); color:var(--muted);
}
.nav-icon-btn:hover{ border-color:var(--gold); color:var(--gold); }
.avatar{
  width:40px; height:40px; border-radius:50%; overflow:hidden; background:linear-gradient(135deg,#2a2a2a,#171717);
  border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px;
}

.app-container{ max-width:1500px; margin:auto; padding:104px 30px 60px; }

.category-row{ display:flex; gap:10px; overflow-x:auto; padding-bottom:6px; margin-bottom:30px; }
.category-row::-webkit-scrollbar{ display:none; }
.category-pill{ white-space:nowrap; background:var(--surface-light); border:1px solid var(--border); padding:11px 22px; border-radius:999px; font-size:14px; font-weight:600; color:#ddd; transition:.2s; }
.category-pill:hover{ border-color:var(--gold); color:var(--gold); }
.category-pill.active{ background:linear-gradient(135deg,var(--gold-start),var(--gold-end)); color:#000; border-color:transparent; }

.stream-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:22px; }
.stream-card{ background:var(--glass); border:1px solid var(--border); border-radius:18px; overflow:hidden; cursor:pointer; transition:transform .2s, border-color .2s; }
.stream-card:hover{ transform:translateY(-3px); border-color:var(--gold-end); }
.stream-thumb{ aspect-ratio:16/9; background:linear-gradient(135deg,#1c1a15,#0d0d0d 55%,#1a1508); position:relative; overflow:hidden; }
.stream-thumb img{ width:100%; height:100%; object-fit:cover; }
.live-badge{ position:absolute; top:12px; left:12px; background:var(--live-red); color:white; font-size:11px; font-weight:800; letter-spacing:.5px; padding:4px 10px; border-radius:6px; display:flex; align-items:center; gap:6px; }
.live-badge .dot{ width:6px; height:6px; border-radius:50%; background:white; }
.viewer-count{ position:absolute; bottom:12px; right:12px; background:rgba(0,0,0,.6); color:white; font-size:11.5px; font-weight:600; padding:4px 10px; border-radius:6px; }
.stream-info{ padding:14px 16px; }
.stream-title{ font-size:14.5px; font-weight:700; margin-bottom:4px; line-height:1.3; }
.stream-host{ font-size:12.5px; color:var(--muted); }

.empty-state{ padding:70px 20px; text-align:center; color:var(--muted); grid-column:1/-1; }
.empty-state h4{ color:#ddd; font-size:22px; font-family:var(--font-display); margin-bottom:8px; }
.skeleton{ background:linear-gradient(90deg,#141414 25%,#1c1c1c 37%,#141414 63%); background-size:400% 100%; animation:shimmer 1.4s ease infinite; border-radius:18px; aspect-ratio:16/9; }
@keyframes shimmer{ 0%{background-position:100% 0;} 100%{background-position:0 0;} }

.player-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.9); backdrop-filter:blur(6px); display:none; align-items:center; justify-content:center; z-index:2000; padding:30px; }
.player-overlay.open{ display:flex; }
.player-box{ width:100%; max-width:1300px; }
.player-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.player-title{ font-family:var(--font-display); font-size:20px; font-weight:600; }
.send-relvbits-btn{ font-size:12.5px; font-weight:800; padding:9px 16px; border-radius:12px; background:linear-gradient(135deg,var(--gold-start),var(--gold-end)); color:#000; }
.player-close{ width:40px; height:40px; border-radius:50%; background:var(--surface-light); border:1px solid var(--border); font-size:18px; display:flex; align-items:center; justify-content:center; }
.player-close:hover{ border-color:var(--gold); color:var(--gold); }

.player-layout{ display:grid; grid-template-columns:1fr 320px; gap:16px; }
@media(max-width:900px){ .player-layout{ grid-template-columns:1fr; } }
.video-frame{ width:100%; aspect-ratio:16/9; background:#000; border-radius:18px; overflow:hidden; border:1px solid var(--border); position:relative; }
.video-frame video{ width:100%; height:100%; object-fit:contain; background:#000; }
.player-status{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:14px; text-align:center; padding:20px; }
.player-status.hidden{ display:none; }

.chat-panel{ background:var(--glass); border:1px solid var(--border); border-radius:18px; display:flex; flex-direction:column; height:100%; max-height:520px; }
.chat-messages{ flex:1; overflow-y:auto; padding:14px; }
.chat-empty{ color:var(--muted-soft); font-size:12.5px; text-align:center; padding:20px 0; }
.chat-message{ font-size:13px; margin-bottom:9px; line-height:1.4; }
.chat-message .name{ color:var(--gold); font-weight:700; margin-right:6px; }
.chat-input-row{ display:flex; gap:8px; padding:12px; border-top:1px solid var(--border-soft); }
.chat-input-row input{ flex:1; background:var(--surface-light); border:1px solid var(--border); border-radius:10px; padding:9px 12px; color:white; font-size:13px; }
.chat-input-row button{ background:var(--gold); color:#000; font-weight:700; font-size:12.5px; padding:0 16px; border-radius:10px; }

.relvbits-modal-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.75); backdrop-filter:blur(4px); display:none; align-items:center; justify-content:center; z-index:2500; padding:24px; }
.relvbits-modal-backdrop.open{ display:flex; }
.relvbits-modal{ background:var(--surface); border:1px solid var(--gold-end); border-radius:20px; padding:26px; max-width:400px; width:100%; }
.relvbits-modal h3{ font-family:var(--font-display); font-size:19px; margin-bottom:16px; }
.amount-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:14px; }
.amount-option{ background:var(--surface-light); border:1px solid var(--border); border-radius:10px; padding:10px 0; font-size:13px; font-weight:700; text-align:center; }
.amount-option.selected{ background:linear-gradient(135deg,var(--gold-start),var(--gold-end)); color:#000; border:none; }
.relvbits-field{ margin-bottom:12px; }
.relvbits-field label{ font-size:11.5px; color:var(--muted); display:block; margin-bottom:5px; font-weight:600; }
.relvbits-field input{ width:100%; background:var(--surface-light); border:1px solid var(--border); border-radius:10px; padding:9px 12px; color:white; font-size:13px; }
.anon-row{ display:flex; align-items:center; gap:8px; margin-bottom:16px; font-size:12.5px; color:var(--muted); }
.relvbits-error{ color:#f2a8a3; font-size:12px; margin-bottom:10px; display:none; }
.relvbits-error.show{ display:block; }
.relvbits-modal-actions{ display:flex; gap:10px; }
.relvbits-modal-actions button{ flex:1; padding:11px; border-radius:12px; font-weight:800; font-size:13px; }
.relvbits-cancel-btn{ background:var(--surface-light); border:1px solid var(--border); color:var(--text); }
.relvbits-confirm-btn{ background:linear-gradient(135deg,var(--gold-start),var(--gold-end)); color:#000; border:none; }
.relvbits-confirm-btn:disabled{ opacity:.5; cursor:not-allowed; }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-badge">R</div>
    <span class="brand-name">Relvia Campus</span>
    <span class="age-pill">18+</span>
  </div>
  <div class="header-right">
    <a class="go-live-btn" href="campus-go-live.html">Go Live</a>
    <a class="nav-icon-btn" href="welcome.html" title="Relvia Live">◉</a>
    <div class="avatar" id="profileAvatar"></div>
  </div>
</header>

<main class="app-container">
  <div class="category-row" id="categoryRow">
    <div class="skeleton" style="width:100px;height:40px;border-radius:999px;aspect-ratio:auto;"></div>
  </div>
  <div class="stream-grid" id="streamGrid">
    <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
  </div>
</main>

<div class="player-overlay" id="playerOverlay">
  <div class="player-box">
    <div class="player-header">
      <div class="player-title" id="playerTitle">—</div>
      <div style="display:flex;align-items:center;gap:10px;">
        <button class="send-relvbits-btn" id="sendRelvbitsBtn">✦ Send RelvBits</button>
        <button class="player-close" id="playerClose">×</button>
      </div>
    </div>
    <div class="player-layout">
      <div class="video-frame">
        <video id="playerVideo" autoplay playsinline></video>
        <div class="player-status" id="playerStatus"><span>Connecting to stream...</span></div>
      </div>
      <div class="chat-panel">
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-row">
          <input type="text" id="chatInput" placeholder="Say something..." maxlength="240">
          <button id="chatSendBtn">Send</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="relvbits-modal-backdrop" id="relvbitsModal">
  <div class="relvbits-modal">
    <h3>✦ Send RelvBits</h3>
    <div class="relvbits-error" id="relvbitsError"></div>
    <div class="relvbits-field">
      <label>Amount</label>
      <div class="amount-grid" id="amountGrid">
        <button class="amount-option" data-amount="200">$2</button>
        <button class="amount-option selected" data-amount="500">$5</button>
        <button class="amount-option" data-amount="1000">$10</button>
        <button class="amount-option" data-amount="2500">$25</button>
      </div>
      <input type="number" id="customAmount" placeholder="Custom amount ($1–$1000)" min="1" max="1000" step="1">
    </div>
    <div class="relvbits-field"><label>Message (optional)</label><input type="text" id="relvbitsMessage" maxlength="280"></div>
    <div class="anon-row"><input type="checkbox" id="relvbitsAnon"><label for="relvbitsAnon">Send anonymously</label></div>
    <div class="relvbits-modal-actions">
      <button class="relvbits-cancel-btn" id="relvbitsCancelBtn">Cancel</button>
      <button class="relvbits-confirm-btn" id="relvbitsConfirmBtn">Continue to payment</button>
    </div>
  </div>
</div>

<script>

const SUPABASE_URL = "https://nqcbhpqzzwjgkusfbexo.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5xY2JocHF6endqZ2t1c2ZiZXhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzNjY1NjEsImV4cCI6MjA5ODk0MjU2MX0.BphyIGT-X9ctYVvfYXw_ldo5XGguNv5j-zDiGBPrCVU";
const TOKEN_ENDPOINT = `${SUPABASE_URL}/functions/v1/mint-campus-token`;
const RELVBITS_CHECKOUT_ENDPOINT = `${SUPABASE_URL}/functions/v1/create-campus-relvbits-checkout`;

// Same LiveKit project as Relvia Live — replace with your real URL.
const LIVEKIT_URL = "wss://YOUR-PROJECT.livekit.cloud"; // <-- replace this

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { storageKey: "relvia-campus-auth" }
});

let currentUser = null;
let profile = null;
let categories = [];
let activeCategoryId = "all";
let currentRoom = null;
let currentPlayerStream = null;
let chatRealtimeChannel = null;

function escapeHtml(str){
  return (str || "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

async function initialize(){
  try {
    const { data: sessionData } = await supabaseClient.auth.getSession();
    if (!sessionData || !sessionData.session){ window.location.href = "campus-login.html"; return; }

    const { data: userData, error } = await supabaseClient.auth.getUser();
    if (error || !userData.user){ window.location.href = "login.html"; return; }
    currentUser = userData.user;

    await loadProfile();
    if (profile?.is_deactivated || (profile?.banned_from_watching_until && new Date(profile.banned_from_watching_until) > new Date())){
      document.body.innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:24px;">
        <h2 style="font-family:var(--font-display);font-size:24px;">You're restricted from Relvia Campus</h2>
        <p style="color:var(--muted);font-size:14px;max-width:360px;">${escapeHtml(profile.ban_reason || "Contact support if you think this is a mistake.")}</p></div>`;
      return;
    }

    try { await supabaseClient.rpc("register_page_visit", { target_page_key: "campus", target_label: "Relvia Campus (18+)" }); } catch (e){}

    await loadCategories();
    await loadStreams();

    document.getElementById("playerClose").addEventListener("click", closePlayer);
    setupRelvbitsModal();
  } catch (err){
    console.error("Relvia Campus init failed:", err);
    window.location.href = "campus-login.html";
  }
}

async function loadProfile(){
  const { data } = await supabaseClient.from("campus_profiles").select("*").eq("id", currentUser.id).maybeSingle();
  profile = data;
  const avatar = document.getElementById("profileAvatar");
  const initial = (profile?.display_name || "R").charAt(0).toUpperCase();
  avatar.innerHTML = profile?.avatar_url ? `<img src="${profile.avatar_url}" style="width:100%;height:100%;object-fit:cover;">` : initial;
}

async function loadCategories(){
  const { data } = await supabaseClient.from("campus_categories").select("*").order("sort_order", { ascending:true });
  categories = data || [];
  const row = document.getElementById("categoryRow");
  row.innerHTML = "";

  const allPill = document.createElement("div");
  allPill.className = "category-pill active";
  allPill.textContent = "All";
  allPill.addEventListener("click", () => selectCategory("all", allPill));
  row.appendChild(allPill);

  categories.forEach(cat => {
    const pill = document.createElement("div");
    pill.className = "category-pill";
    pill.textContent = cat.name;
    pill.addEventListener("click", () => selectCategory(cat.id, pill));
    row.appendChild(pill);
  });
}

async function selectCategory(categoryId, pillEl){
  activeCategoryId = categoryId;
  document.querySelectorAll(".category-pill").forEach(p => p.classList.remove("active"));
  pillEl.classList.add("active");
  await loadStreams();
}

async function loadStreams(){
  const grid = document.getElementById("streamGrid");
  grid.innerHTML = `<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>`;

  let query = supabaseClient.from("campus_streams").select("*").eq("is_live", true)
    .order("featured", { ascending:false }).order("viewer_count", { ascending:false });
  if (activeCategoryId !== "all") query = query.eq("category_id", activeCategoryId);

  const { data, error } = await query;
  if (error){ console.error(error); grid.innerHTML = ""; return; }

  if (!data || data.length === 0){
    grid.innerHTML = `<div class="empty-state"><h4>Nothing live right now</h4><p>Check back soon, or try a different category.</p></div>`;
    return;
  }

  const hostIds = [...new Set(data.map(s => s.host_id).filter(Boolean))];
  let hostsById = {};
  if (hostIds.length > 0){
    const { data: hosts } = await supabaseClient.from("campus_profiles").select("id, display_name, username").in("id", hostIds);
    (hosts || []).forEach(h => { hostsById[h.id] = h; });
  }

  grid.innerHTML = "";
  data.forEach(stream => {
    const host = hostsById[stream.host_id];
    const hostName = host?.display_name || host?.username || "Relvia Creator";
    const card = document.createElement("div");
    card.className = "stream-card";
    card.innerHTML = `
      <div class="stream-thumb">
        ${stream.thumbnail_url ? `<img src="${stream.thumbnail_url}" loading="lazy">` : ""}
        <div class="live-badge"><span class="dot"></span>LIVE</div>
        <div class="viewer-count">${stream.viewer_count || 0} watching</div>
      </div>
      <div class="stream-info">
        <div class="stream-title">${escapeHtml(stream.title)}</div>
        <div class="stream-host">${escapeHtml(hostName)}</div>
      </div>`;
    card.addEventListener("click", () => openPlayer(stream));
    grid.appendChild(card);
  });
}

async function openPlayer(stream){
  const overlay = document.getElementById("playerOverlay");
  const status = document.getElementById("playerStatus");
  const video = document.getElementById("playerVideo");

  currentPlayerStream = stream;
  document.getElementById("playerTitle").textContent = stream.title;
  status.classList.remove("hidden");
  status.innerHTML = `<span>Connecting to stream...</span>`;
  overlay.classList.add("open");
  resetChat();

  try {
    const { data: sessionData } = await supabaseClient.auth.getSession();
    const accessToken = sessionData?.session?.access_token;

    const response = await fetch(TOKEN_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json", "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${accessToken}` },
      body: JSON.stringify({ streamId: stream.id }),
    });
    const result = await response.json();

    if (!response.ok){
      status.innerHTML = `<span>${escapeHtml(result.error || "Couldn't join this stream.")}</span>`;
      return;
    }

    const room = new LivekitClient.Room();
    currentRoom = room;

    room.on(LivekitClient.RoomEvent.TrackSubscribed, (track) => {
      if (track.kind === "video" || track.kind === "audio"){
        track.attach(video);
        status.classList.add("hidden");
      }
    });
    room.on(LivekitClient.RoomEvent.Disconnected, () => {
      status.classList.remove("hidden");
      status.innerHTML = `<span>Stream ended or connection lost.</span>`;
    });

    await room.connect(LIVEKIT_URL, result.token);
    await loadChatHistory(stream.id);
    subscribeToChatRealtime(stream.id);
    setupChatSend(stream.id);
  } catch (err){
    console.error("Failed to join stream:", err);
    status.innerHTML = `<span>Couldn't connect to this stream. Try again in a moment.</span>`;
  }
}

function resetChat(){
  document.getElementById("chatMessages").innerHTML = `<div class="chat-empty">Messages appear here once you're connected.</div>`;
}

async function loadChatHistory(streamId){
  const { data: messages } = await supabaseClient
    .from("campus_chat_messages").select("*").eq("stream_id", streamId).order("created_at", { ascending:true }).limit(200);
  if (!messages || messages.length === 0) return;

  const senderIds = [...new Set(messages.map(m => m.user_id).filter(Boolean))];
  const { data: senders } = await supabaseClient.from("campus_profiles").select("id, display_name").in("id", senderIds);
  const nameById = {};
  (senders || []).forEach(s => { nameById[s.id] = s.display_name; });

  const container = document.getElementById("chatMessages");
  const empty = container.querySelector(".chat-empty");
  if (empty) empty.remove();
  messages.forEach(m => appendChatMessage(nameById[m.user_id] || "Viewer", m.message));
}

function subscribeToChatRealtime(streamId){
  chatRealtimeChannel = supabaseClient
    .channel(`relvia-campus-chat-${streamId}`)
    .on("postgres_changes", { event:"INSERT", schema:"public", table:"campus_chat_messages", filter:`stream_id=eq.${streamId}` }, async (payload) => {
      const msg = payload.new;
      if (msg.user_id === currentUser?.id) return;
      const { data: sender } = await supabaseClient.from("campus_profiles").select("display_name").eq("id", msg.user_id).maybeSingle();
      appendChatMessage(sender?.display_name || "Viewer", msg.message);
    })
    .subscribe();
}

function appendChatMessage(name, text){
  const container = document.getElementById("chatMessages");
  const empty = container.querySelector(".chat-empty");
  if (empty) empty.remove();
  const el = document.createElement("div");
  el.className = "chat-message";
  el.innerHTML = `<span class="name">${escapeHtml(name)}</span><span class="text">${escapeHtml(text)}</span>`;
  container.appendChild(el);
  container.scrollTop = container.scrollHeight;
}

function setupChatSend(streamId){
  const input = document.getElementById("chatInput");
  const sendBtn = document.getElementById("chatSendBtn");

  const send = async () => {
    const text = input.value.trim();
    if (!text || !currentUser) return;
    const name = profile?.display_name || profile?.username || "Viewer";

    const { error } = await supabaseClient.from("campus_chat_messages").insert({ stream_id: streamId, user_id: currentUser.id, message: text });
    if (error){ console.error(error); return; }
    appendChatMessage(name, text);
    input.value = "";
  };

  sendBtn.onclick = send;
  input.onkeydown = (e) => { if (e.key === "Enter") send(); };
}

function closePlayer(){
  const overlay = document.getElementById("playerOverlay");
  const video = document.getElementById("playerVideo");
  if (currentRoom){ currentRoom.disconnect(); currentRoom = null; }
  if (chatRealtimeChannel){ supabaseClient.removeChannel(chatRealtimeChannel); chatRealtimeChannel = null; }
  video.srcObject = null;
  overlay.classList.remove("open");
  resetChat();
  currentPlayerStream = null;
}

function setupRelvbitsModal(){
  const modal = document.getElementById("relvbitsModal");
  const amountGrid = document.getElementById("amountGrid");
  const customAmount = document.getElementById("customAmount");
  let selectedAmountCents = 500;

  document.getElementById("sendRelvbitsBtn").addEventListener("click", () => {
    if (!currentPlayerStream) return;
    document.getElementById("relvbitsError").classList.remove("show");
    modal.classList.add("open");
  });
  document.getElementById("relvbitsCancelBtn").addEventListener("click", () => modal.classList.remove("open"));
  modal.addEventListener("click", (e) => { if (e.target === modal) modal.classList.remove("open"); });

  amountGrid.querySelectorAll(".amount-option").forEach(btn => {
    btn.addEventListener("click", () => {
      amountGrid.querySelectorAll(".amount-option").forEach(b => b.classList.remove("selected"));
      btn.classList.add("selected");
      selectedAmountCents = parseInt(btn.dataset.amount, 10);
      customAmount.value = "";
    });
  });
  customAmount.addEventListener("input", () => {
    amountGrid.querySelectorAll(".amount-option").forEach(b => b.classList.remove("selected"));
    const dollars = parseFloat(customAmount.value);
    selectedAmountCents = isFinite(dollars) ? Math.round(dollars * 100) : 0;
  });

  document.getElementById("relvbitsConfirmBtn").addEventListener("click", async () => {
    const errorEl = document.getElementById("relvbitsError");
    errorEl.classList.remove("show");

    if (!selectedAmountCents || selectedAmountCents < 100 || selectedAmountCents > 100000){
      errorEl.textContent = "Choose an amount between $1 and $1,000.";
      errorEl.classList.add("show");
      return;
    }

    const btn = document.getElementById("relvbitsConfirmBtn");
    btn.disabled = true; btn.textContent = "Redirecting to payment...";

    const { data: sessionData } = await supabaseClient.auth.getSession();
    const accessToken = sessionData?.session?.access_token;

    try {
      const response = await fetch(RELVBITS_CHECKOUT_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json", "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${accessToken}` },
        body: JSON.stringify({
          creatorId: currentPlayerStream.host_id,
          amountCents: selectedAmountCents,
          message: document.getElementById("relvbitsMessage").value.trim(),
          isAnonymous: document.getElementById("relvbitsAnon").checked,
          campusStreamId: currentPlayerStream.id,
        }),
      });
      const result = await response.json();

      if (!response.ok || !result.checkoutUrl){
        errorEl.textContent = result.error || "Couldn't start checkout.";
        errorEl.classList.add("show");
        btn.disabled = false; btn.textContent = "Continue to payment";
        return;
      }
      window.location.href = result.checkoutUrl;
    } catch (err){
      console.error(err);
      errorEl.textContent = "Couldn't reach the server.";
      errorEl.classList.add("show");
      btn.disabled = false; btn.textContent = "Continue to payment";
    }
  });
}

initialize();
</script>
