<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owner Panel — Relvia Live</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --background:#0a0806; --glass:rgba(18,14,10,.6); --surface-light:#1c150d;
  --border:#2a2018; --gold-start:#f2c766; --gold-end:#b9832f; --gold:#e0b158;
  --text:#f5f1ea; --muted:#a89e8f;
  --font-display:"Playfair Display",serif; --font-body:"Inter",sans-serif;
}
*{ margin:0; padding:0; box-sizing:border-box; font-family:var(--font-body); }
body{
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  background:
    radial-gradient(ellipse 900px 500px at 15% -5%, rgba(217,169,75,.10), transparent 60%),
    var(--background);
  color:var(--text);
}
.card{
  background:var(--glass); border:1px solid var(--border); border-radius:24px;
  padding:50px 40px; text-align:center; max-width:440px;
}
.icon{ font-size:28px; color:var(--gold); margin-bottom:14px; }
h1{ font-family:var(--font-display); font-size:26px; font-weight:700; margin-bottom:10px; }
p{ color:var(--muted); font-size:14px; line-height:1.6; }
.back{
  display:inline-block; margin-top:24px; color:var(--gold); text-decoration:none;
  border:1px solid var(--gold-end); padding:10px 20px; border-radius:12px; font-weight:700; font-size:13.5px;
}
.back:hover{ background:var(--gold); color:#000; }
#gate{ display:none; }
</style>
</head>
<body>

<div class="card" id="deniedCard" style="display:none;">
  <div class="icon">✦</div>
  <h1>Owners only</h1>
  <p>This panel is restricted to Relvia Live owners.</p>
  <a class="back" href="live.html">Back to Relvia Live</a>
</div>

<div class="card" id="panelCard" style="display:none;">
  <div class="icon">♛</div>
  <h1>Owner Panel</h1>
  <p>Category management (add, edit, reorder, remove) is coming here next. For now, categories can be managed directly in the Supabase table editor.</p>
  <a class="back" href="live.html">Back to Relvia Live</a>
</div>

<script>
const SUPABASE_URL = "https://nqcbhpqzzwjgkusfbexo.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5xY2JocHF6endqZ2t1c2ZiZXhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzNjY1NjEsImV4cCI6MjA5ODk0MjU2MX0.BphyIGT-X9ctYVvfYXw_ldo5XGguNv5j-zDiGBPrCVU";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { storageKey: "relvia-live-auth" }
});

async function gate(){
  const { data: sessionData } = await supabaseClient.auth.getSession();
  if (!sessionData || !sessionData.session){
    window.location.href = "live-login.html";
    return;
  }

  const { data: userData } = await supabaseClient.auth.getUser();
  if (!userData.user){
    window.location.href = "live-login.html";
    return;
  }

  const { data: owner } = await supabaseClient
    .from("live_owners")
    .select("user_id")
    .eq("user_id", userData.user.id)
    .maybeSingle();

  if (!owner){
    document.getElementById("deniedCard").style.display = "block";
    return;
  }

  document.getElementById("panelCard").style.display = "block";
}

gate();
</script>
</body>
</html>
