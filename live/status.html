<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Status — Relvia Live</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --background:#0a0806; --glass:rgba(18,14,10,.6); --surface-light:#1c150d;
  --border:#2a2018; --border-soft:#1c1610; --gold-start:#f2c766; --gold-end:#b9832f; --gold:#e0b158;
  --text:#f5f1ea; --muted:#a89e8f; --live-red:#e0574f; --ok-green:#5fae7a; --maint-blue:#8a9bd9;
  --font-display:"Playfair Display",serif; --font-body:"Inter",sans-serif;
}
*{ margin:0; padding:0; box-sizing:border-box; font-family:var(--font-body); }
body{
  min-height:100vh; color:var(--text);
  background:
    radial-gradient(ellipse 900px 500px at 15% -5%, rgba(217,169,75,.10), transparent 60%),
    var(--background);
}
a{ text-decoration:none; }

.topbar{
  position:sticky; top:0; height:72px; display:flex; align-items:center; justify-content:space-between;
  padding:0 30px; background:rgba(5,5,5,.85); backdrop-filter:blur(18px); border-bottom:1px solid var(--border-soft);
}
.brand{ display:flex; align-items:center; gap:12px; color:var(--text); }
.brand-badge{
  width:34px; height:34px; border-radius:50%; background:#000;
  background-image:radial-gradient(circle at 32% 22%, rgba(242,199,102,.28), transparent 65%);
  border:1.5px solid var(--gold-end); display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-style:italic; font-weight:700; font-size:17px; color:var(--gold-start);
}
.brand-name{ font-family:var(--font-display); font-weight:700; font-size:17px; }
.back-link{ font-size:13px; font-weight:700; color:var(--muted); }
.back-link:hover{ color:var(--gold); }

.container{ max-width:680px; margin:auto; padding:50px 24px 90px; }

.status-hero{
  border-radius:22px; padding:36px 30px; text-align:center; margin-bottom:36px;
  border:1px solid var(--border);
}
.status-hero.operational{ background:rgba(95,174,122,.08); border-color:rgba(95,174,122,.4); }
.status-hero.degraded{ background:rgba(217,169,75,.08); border-color:var(--gold-end); }
.status-hero.outage{ background:rgba(224,87,79,.08); border-color:rgba(224,87,79,.4); }
.status-hero.maintenance{ background:rgba(138,155,217,.08); border-color:rgba(138,155,217,.4); }

.status-dot{ width:14px; height:14px; border-radius:50%; display:inline-block; margin-bottom:14px; }
.status-dot.operational{ background:var(--ok-green); box-shadow:0 0 16px rgba(95,174,122,.6); }
.status-dot.degraded{ background:var(--gold); box-shadow:0 0 16px rgba(224,177,88,.6); }
.status-dot.outage{ background:var(--live-red); box-shadow:0 0 16px rgba(224,87,79,.6); }
.status-dot.maintenance{ background:var(--maint-blue); box-shadow:0 0 16px rgba(138,155,217,.6); }

.status-hero h1{ font-family:var(--font-display); font-size:26px; font-weight:600; margin-bottom:8px; }
.status-hero p{ color:var(--muted); font-size:13.5px; }

.eyebrow{ font-size:11px; letter-spacing:2.5px; color:var(--gold); text-transform:uppercase; font-weight:700; margin-bottom:16px; }

.timeline{ display:flex; flex-direction:column; gap:0; }
.timeline-item{ display:flex; gap:16px; padding:18px 0; border-bottom:1px solid var(--border-soft); }
.timeline-item:last-child{ border-bottom:none; }
.timeline-marker{ width:10px; height:10px; border-radius:50%; margin-top:5px; flex-shrink:0; }
.timeline-marker.operational{ background:var(--ok-green); }
.timeline-marker.degraded{ background:var(--gold); }
.timeline-marker.outage{ background:var(--live-red); }
.timeline-marker.maintenance{ background:var(--maint-blue); }
.timeline-content .msg{ font-size:14px; font-weight:600; margin-bottom:4px; }
.timeline-content .meta{ font-size:12px; color:var(--muted); }
.auto-tag{ font-size:10px; font-weight:800; color:var(--muted); border:1px solid var(--border); padding:1px 7px; border-radius:999px; margin-left:6px; }

.empty{ text-align:center; color:var(--muted); padding:40px 0; font-size:13.5px; }

.components{ margin-bottom:36px; }
.component-row{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 18px; background:var(--glass); border:1px solid var(--border); border-radius:14px; margin-bottom:8px;
}
.component-name{ font-size:14px; font-weight:600; }
.component-pill{ font-size:11.5px; font-weight:800; padding:4px 12px; border-radius:999px; }
.component-pill.open{ background:rgba(95,174,122,.15); color:var(--ok-green); }
.component-pill.closed{ background:rgba(224,87,79,.15); color:#f2a8a3; }
</style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="live.html">
    <div class="brand-badge">R</div>
    <span class="brand-name">Relvia Live Status</span>
  </a>
  <a class="back-link" href="live.html">← Back to Relvia Live</a>
</header>

<div class="container">
  <div class="status-hero" id="statusHero">
    <div class="status-dot" id="statusDot"></div>
    <h1 id="statusHeroText">Checking status...</h1>
    <p id="statusHeroTime"></p>
  </div>

  <div class="eyebrow">Components</div>
  <div class="components" id="components">
    <div class="empty">Loading...</div>
  </div>

  <div class="eyebrow">History</div>
  <div class="timeline" id="timeline">
    <div class="empty">Loading...</div>
  </div>
</div>

<script>

const SUPABASE_URL = "https://nqcbhpqzzwjgkusfbexo.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5xY2JocHF6endqZ2t1c2ZiZXhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzNjY1NjEsImV4cCI6MjA5ODk0MjU2MX0.BphyIGT-X9ctYVvfYXw_ldo5XGguNv5j-zDiGBPrCVU";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const STATUS_LABELS = {
  operational: "All Systems Operational",
  degraded: "Degraded Performance",
  outage: "Major Outage",
  maintenance: "Under Maintenance",
};

function escapeHtml(str){
  return (str || "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

async function loadStatus(){
  const { data, error } = await supabaseClient
    .from("live_status_updates")
    .select("*")
    .order("created_at", { ascending:false })
    .limit(30);

  if (error || !data || data.length === 0){
    document.getElementById("statusHeroText").textContent = "Status unavailable";
    document.getElementById("timeline").innerHTML = `<div class="empty">Couldn't load status history.</div>`;
    return;
  }

  const current = data[0];
  const hero = document.getElementById("statusHero");
  hero.className = `status-hero ${current.status}`;
  document.getElementById("statusDot").className = `status-dot ${current.status}`;
  document.getElementById("statusHeroText").textContent = STATUS_LABELS[current.status] || current.status;
  document.getElementById("statusHeroTime").textContent = `Updated ${new Date(current.created_at).toLocaleString()}`;

  const timeline = document.getElementById("timeline");
  timeline.innerHTML = "";
  data.forEach(entry => {
    const item = document.createElement("div");
    item.className = "timeline-item";
    item.innerHTML = `
      <div class="timeline-marker ${entry.status}"></div>
      <div class="timeline-content">
        <div class="msg">${escapeHtml(entry.message)}${entry.is_automatic ? `<span class="auto-tag">AUTO</span>` : ""}</div>
        <div class="meta">${new Date(entry.created_at).toLocaleString()}</div>
      </div>`;
    timeline.appendChild(item);
  });
}

async function loadComponents(){
  const container = document.getElementById("components");

  const { data, error } = await supabaseClient.rpc("get_page_locks_public");

  if (error || !data || data.length === 0){
    container.innerHTML = `<div class="empty">No component data available.</div>`;
    return;
  }

  const sorted = [...data].sort((a, b) => a.page_key.localeCompare(b.page_key));

  container.innerHTML = "";
  sorted.forEach(page => {
    const row = document.createElement("div");
    row.className = "component-row";
    row.innerHTML = `
      <span class="component-name">${escapeHtml(page.label)}</span>
      <span class="component-pill ${page.is_closed ? "closed" : "open"}">${page.is_closed ? "Unavailable" : "Operational"}</span>`;
    container.appendChild(row);
  });
}

loadStatus();
loadComponents();
setInterval(() => { loadStatus(); loadComponents(); }, 30000);
</script>
</body>
</html>
