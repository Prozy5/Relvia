<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relvia Live</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js"></script>

<style>
:root{
  --background:#0a0806; --glass:rgba(18,14,10,.6); --surface-light:#1c150d; --surface:rgba(20,16,11,.78);
  --border:#2a2018; --border-soft:#1c1610; --gold-start:#f2c766; --gold-end:#b9832f; --gold:#e0b158;
  --text:#f5f1ea; --muted:#a89e8f; --muted-soft:#6b6255; --live-red:#e0574f;
  --radius-lg:24px; --font-display:"Playfair Display",serif; --font-body:"Inter",sans-serif;
}
*{ margin:0; padding:0; box-sizing:border-box; font-family:var(--font-body); }
html{ scroll-behavior:smooth; }
body{
  background:
    radial-gradient(ellipse 900px 500px at 15% -5%, rgba(217,169,75,.10), transparent 60%),
    radial-gradient(ellipse 700px 500px at 100% 20%, rgba(185,131,47,.06), transparent 55%),
    var(--background);
  background-attachment:fixed; color:var(--text); overflow-x:hidden;
}
button, input{ font-family:inherit; }
button{ cursor:pointer; border:none; background:none; color:inherit; font-size:inherit; }
img{ max-width:100%; display:block; }

/* HEADER — brand only, no nav links */
.topbar{
  position:fixed; top:0; left:0; right:0; height:76px;
  display:flex; align-items:center; justify-content:space-between; padding:0 32px;
  background:rgba(5,5,5,.82); backdrop-filter:blur(20px); border-bottom:1px solid var(--border-soft);
  z-index:999;
}
.brand{ display:flex; align-items:center; gap:12px; }
.brand-badge{
  width:38px; height:38px; border-radius:50%; background:#000;
  background-image:radial-gradient(circle at 32% 22%, rgba(242,199,102,.28), transparent 65%);
  border:1.5px solid var(--gold-end); display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-style:italic; font-weight:700; font-size:19px; color:var(--gold-start);
}
.brand-text{ display:flex; align-items:center; gap:8px; }
.brand-name{ font-family:var(--font-display); font-weight:700; font-size:19px; }
.live-dot{ width:8px; height:8px; border-radius:50%; background:var(--live-red); box-shadow:0 0 0 3px rgba(224,87,79,.2); }

.header-right{ display:flex; align-items:center; gap:14px; }
.owner-badge{
  background:linear-gradient(135deg,var(--gold-start),var(--gold-end));
  color:#000; font-size:11px; font-weight:800; padding:5px 12px; border-radius:999px; letter-spacing:.3px;
}
.owner-link{
  font-size:13px; font-weight:700; color:var(--gold); border:1px solid var(--gold-end);
  padding:8px 16px; border-radius:12px; transition:.2s; text-decoration:none;
}
.owner-link:hover{ background:var(--gold); color:#000; }
.go-live-btn{
  font-size:13px; font-weight:800; color:#000; text-decoration:none;
  background:linear-gradient(135deg,var(--gold-start),var(--gold-end));
  padding:9px 18px; border-radius:12px; transition:.2s;
}
.go-live-btn:hover{ opacity:.88; }
.settings-link{
  width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  background:var(--surface-light); border:1px solid var(--border); color:var(--muted); text-decoration:none; font-size:15px;
}
.settings-link:hover{ border-color:var(--gold); color:var(--gold); }

.avatar{
  width:40px; height:40px; border-radius:50%; overflow:hidden;
  background:linear-gradient(135deg,#2a2a2a,#171717); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; cursor:pointer;
  text-decoration:none; color:var(--text);
}

/* ANNOUNCEMENT BANNER + POPUP */
.announcement-banner{
  position:fixed; top:76px; left:0; right:0; z-index:900;
  background:linear-gradient(135deg,var(--gold-start),var(--gold-end)); color:#000;
  padding:11px 32px; font-size:13.5px; font-weight:700;
  display:flex; align-items:center; justify-content:center; gap:16px; text-align:center;
}
.announcement-banner button{ font-size:18px; font-weight:800; line-height:1; color:#000; opacity:.6; }
.announcement-banner button:hover{ opacity:1; }

.announcement-popup-backdrop{
  position:fixed; inset:0; background:rgba(0,0,0,.7); backdrop-filter:blur(4px);
  z-index:2500; align-items:center; justify-content:center; padding:24px;
}
.announcement-popup{
  background:var(--surface); border:1px solid var(--gold-end); border-radius:22px;
  padding:36px 30px; text-align:center; max-width:420px;
}
.announcement-popup .icon{ font-size:24px; color:var(--gold); margin-bottom:12px; }
.announcement-popup p{ font-size:15px; line-height:1.6; margin-bottom:22px; }
.announcement-popup button{
  background:linear-gradient(135deg,var(--gold-start),var(--gold-end)); color:#000;
  padding:11px 26px; border-radius:14px; font-weight:800; font-size:13.5px;
}

/* LAYOUT */
.app-container{ max-width:1500px; margin:auto; padding:104px 30px 60px; transition:padding-top .2s; }

.category-row{ display:flex; gap:10px; overflow-x:auto; padding-bottom:6px; margin-bottom:30px; }
.category-row::-webkit-scrollbar{ display:none; }

.live-search-row{ margin-bottom:20px; }
.live-search-input{
  width:100%; max-width:420px; height:46px; background:var(--surface-light); border:1px solid var(--border);
  border-radius:999px; padding:0 20px; color:white; font-size:14px;
}
.live-search-input:focus{ outline:none; border-color:var(--gold); }
.live-search-input::placeholder{ color:var(--muted-soft); }

/* FEATURED SECTION */
.featured-section{ margin-bottom:36px; display:none; }
.featured-eyebrow{
  font-size:11px; letter-spacing:2.5px; color:var(--gold); text-transform:uppercase;
  font-weight:700; margin-bottom:14px; display:flex; align-items:center; gap:8px;
}
.featured-eyebrow::before{ content:""; width:16px; height:1px; background:var(--gold); }

.featured-hero{
  position:relative; border-radius:24px; overflow:hidden; cursor:pointer;
  aspect-ratio:21/9; min-height:280px; border:1px solid var(--gold-end);
  background:linear-gradient(135deg,#1c1a15,#0d0d0d 55%,#1a1508);
}
.featured-hero img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:.85; }
.featured-hero::after{
  content:""; position:absolute; inset:0;
  background:linear-gradient(0deg, rgba(5,4,3,.95) 5%, rgba(5,4,3,.35) 55%, transparent 90%);
}
.featured-hero-content{ position:absolute; left:0; right:0; bottom:0; padding:32px; z-index:2; }
.featured-hero-badge{
  display:inline-flex; align-items:center; gap:7px; background:var(--live-red); color:white;
  font-size:11.5px; font-weight:800; letter-spacing:.5px; padding:6px 13px; border-radius:8px; margin-bottom:14px;
}
.featured-hero-badge .dot{ width:6px; height:6px; border-radius:50%; background:white; animation:pulse 1.4s infinite; }
@keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
.featured-hero-title{ font-family:var(--font-display); font-size:32px; font-weight:600; color:white; margin-bottom:10px; max-width:70%; line-height:1.15; }
.featured-hero-meta{ display:flex; align-items:center; gap:14px; color:#e6ddd0; font-size:14px; }
.featured-hero-host{ display:flex; align-items:center; gap:8px; font-weight:600; }
.featured-hero-cta{
  position:absolute; top:28px; right:28px; z-index:2;
  background:linear-gradient(135deg,var(--gold-start),var(--gold-end)); color:#000;
  font-weight:800; font-size:13.5px; padding:11px 22px; border-radius:14px;
}

.featured-strip{ display:flex; gap:14px; overflow-x:auto; margin-top:16px; padding-bottom:6px; }
.featured-strip::-webkit-scrollbar{ display:none; }
.featured-card{
  min-width:260px; max-width:260px; border-radius:16px; overflow:hidden; cursor:pointer;
  border:1px solid var(--border); background:var(--glass); transition:transform .2s, border-color .2s;
}
.featured-card:hover{ transform:translateY(-3px); border-color:var(--gold-end); }
.featured-card .thumb{
  aspect-ratio:16/9; background:linear-gradient(135deg,#1c1a15,#0d0d0d 55%,#1a1508); position:relative; overflow:hidden;
}
.featured-card .thumb img{ width:100%; height:100%; object-fit:cover; }
.featured-card .info{ padding:12px 14px; }
.featured-card .info .title{ font-size:14px; font-weight:700; margin-bottom:3px; }
.featured-card .info .host{ font-size:12px; color:var(--muted); display:flex; align-items:center; gap:5px; }

/* VERIFIED BADGE */
.verified-badge{
  display:inline-flex; align-items:center; justify-content:center;
  width:15px; height:15px; border-radius:50%;
  background:linear-gradient(135deg,var(--gold-start),var(--gold-end));
  color:#000; font-size:10px; font-weight:900; flex-shrink:0;
}
.owner-tag{
  display:inline-flex; align-items:center; gap:4px;
  font-size:10px; font-weight:800; padding:2px 8px; border-radius:999px;
  background:rgba(217,169,75,.12); color:var(--gold); border:1px solid var(--gold-end);
  letter-spacing:.2px;
}
.owner-tag.founder{ background:linear-gradient(135deg,var(--gold-start),var(--gold-end)); color:#000; border:none; }
.category-pill{
  white-space:nowrap; background:var(--surface-light); border:1px solid var(--border);
  padding:11px 22px; border-radius:999px; font-size:14px; font-weight:600; color:#ddd; transition:.2s;
}
.category-pill:hover{ border-color:var(--gold); color:var(--gold); }
.category-pill.active{
  background:linear-gradient(135deg,var(--gold-start),var(--gold-end)); color:#000; border-color:transparent;
}

.stream-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:22px; }

.stream-card{
  background:var(--glass); border:1px solid var(--border); border-radius:18px; overflow:hidden;
  cursor:pointer; transition:transform .2s, border-color .2s;
}
.stream-card:hover{ transform:translateY(-3px); border-color:var(--gold-end); }
.stream-thumb{
  aspect-ratio:16/9; background:linear-gradient(135deg,#1c1a15,#0d0d0d 55%,#1a1508);
  position:relative; overflow:hidden;
}
.stream-thumb img{ width:100%; height:100%; object-fit:cover; }
.live-badge{
  position:absolute; top:12px; left:12px; background:var(--live-red); color:white;
  font-size:11px; font-weight:800; letter-spacing:.5px; padding:4px 10px; border-radius:6px;
  display:flex; align-items:center; gap:6px;
}
.live-badge .dot{ width:6px; height:6px; border-radius:50%; background:white; }
.viewer-count{
  position:absolute; bottom:12px; right:12px; background:rgba(0,0,0,.6); color:white;
  font-size:11.5px; font-weight:600; padding:4px 10px; border-radius:6px; backdrop-filter:blur(4px);
}
.featured-badge{
  position:absolute; top:12px; right:12px;
  background:linear-gradient(135deg,var(--gold-start),var(--gold-end)); color:#000;
  font-size:11px; font-weight:800; padding:4px 10px; border-radius:6px;
}
.stream-info{ padding:14px 16px; }
.stream-title{ font-size:14.5px; font-weight:700; margin-bottom:4px; line-height:1.3; }
.stream-host{ font-size:12.5px; color:var(--muted); }

.empty-state{ padding:70px 20px; text-align:center; color:var(--muted); }
.empty-state h4{ color:#ddd; font-size:17px; margin-bottom:8px; font-family:var(--font-display); font-size:22px; }
.empty-state p{ font-size:13.5px; }

.skeleton{ background:linear-gradient(90deg,#141414 25%,#1c1c1c 37%,#141414 63%); background-size:400% 100%; animation:shimmer 1.4s ease infinite; border-radius:18px; aspect-ratio:16/9; }
@keyframes shimmer{ 0%{background-position:100% 0;} 100%{background-position:0 0;} }

/* PLAYER OVERLAY */
.player-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.9); backdrop-filter:blur(6px);
  display:none; align-items:center; justify-content:center; z-index:2000; padding:30px;
}
.player-overlay.open{ display:flex; }
.player-box{ width:100%; max-width:1300px; }
.player-layout{ display:grid; grid-template-columns:1fr 320px; gap:16px; }
@media(max-width:900px){ .player-layout{ grid-template-columns:1fr; } }

.chat-panel{
  background:var(--surface); border:1px solid var(--border); border-radius:18px;
  display:flex; flex-direction:column; height:min(600px, 70vh);
}
.chat-messages{ flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px; }
.chat-message{ font-size:13px; line-height:1.5; }
.chat-message .name{ font-weight:700; color:var(--gold); margin-right:6px; }
.chat-message .text{ color:#e6e6e6; word-break:break-word; }
.chat-empty{ color:var(--muted); font-size:12.5px; text-align:center; margin-top:20px; }
.chat-input-row{ display:flex; gap:8px; padding:12px; border-top:1px solid var(--border-soft); }
.chat-input-row input{
  flex:1; background:var(--surface-light); border:1px solid var(--border); border-radius:10px;
  padding:9px 12px; color:white; font-size:13px;
}
.chat-input-row input:focus{ outline:none; border-color:var(--gold); }
.chat-input-row button{
  background:linear-gradient(135deg,var(--gold-start),var(--gold-end)); color:#000;
  padding:9px 16px; border-radius:10px; font-weight:700; font-size:12.5px;
}
.player-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.player-title{ font-family:var(--font-display); font-size:20px; font-weight:600; }
.player-close{
  width:40px; height:40px; border-radius:50%; background:var(--surface-light); border:1px solid var(--border);
  font-size:18px; display:flex; align-items:center; justify-content:center;
}
.player-close:hover{ border-color:var(--gold); color:var(--gold); }
.send-relvbits-btn{
  font-size:12.5px; font-weight:800; padding:9px 16px; border-radius:12px;
  background:linear-gradient(135deg,var(--gold-start),var(--gold-end)); color:#000;
}
.send-relvbits-btn:hover{ opacity:.88; }

.relvbits-modal-backdrop{
  position:fixed; inset:0; background:rgba(0,0,0,.75); backdrop-filter:blur(4px);
  display:none; align-items:center; justify-content:center; z-index:2500; padding:24px;
}
.relvbits-modal-backdrop.open{ display:flex; }
.relvbits-modal{ background:var(--surface); border:1px solid var(--gold-end); border-radius:20px; padding:26px; max-width:400px; width:100%; }
.relvbits-modal h3{ font-family:var(--font-display); font-size:19px; margin-bottom:16px; display:flex; align-items:center; gap:8px; }
.amount-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:14px; }
.amount-option{
  background:var(--surface-light); border:1px solid var(--border); border-radius:10px;
  padding:10px 0; font-size:13px; font-weight:700; text-align:center;
}
.amount-option.selected{ background:linear-gradient(135deg,var(--gold-start),var(--gold-end)); color:#000; border:none; }
.relvbits-field{ margin-bottom:12px; }
.relvbits-field label{ font-size:11.5px; color:var(--muted); display:block; margin-bottom:5px; font-weight:600; }
.relvbits-field input, .relvbits-field textarea{
  width:100%; background:var(--surface-light); border:1px solid var(--border); border-radius:10px;
  padding:9px 12px; color:white; font-size:13px;
}
.relvbits-field textarea{ resize:none; min-height:50px; }
.anon-row{ display:flex; align-items:center; gap:8px; margin-bottom:16px; font-size:12.5px; color:var(--muted); }
.relvbits-error{ color:#f2a8a3; font-size:12px; margin-bottom:10px; display:none; }
.relvbits-error.show{ display:block; }
.relvbits-modal-actions{ display:flex; gap:10px; }
.relvbits-modal-actions button{ flex:1; padding:11px; border-radius:12px; font-weight:800; font-size:13px; }
.relvbits-cancel-btn{ background:var(--surface-light); border:1px solid var(--border); color:var(--text); }
.relvbits-confirm-btn{ background:linear-gradient(135deg,var(--gold-start),var(--gold-end)); color:#000; border:none; }
.relvbits-confirm-btn:disabled{ opacity:.5; cursor:not-allowed; }
.video-frame{
  width:100%; aspect-ratio:16/9; background:#000; border-radius:18px; overflow:hidden;
  border:1px solid var(--border); position:relative;
}
.video-frame video{ width:100%; height:100%; object-fit:contain; background:#000; }
.player-status{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  color:var(--muted); font-size:14px; flex-direction:column; gap:10px; text-align:center; padding:20px;
}
.player-status.hidden{ display:none; }

.toast{
  position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--surface); border:1px solid var(--gold); color:white;
  padding:13px 22px; border-radius:14px; font-size:13.5px; font-weight:600;
  opacity:0; pointer-events:none; transition:.25s; z-index:3000;
}
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

@media(max-width:700px){
  .topbar{ padding:0 18px; }
  .app-container{ padding:92px 16px 40px; }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-badge">R</div>
    <div class="brand-text">
      <span class="brand-name">Relvia</span>
      <span class="live-dot"></span>
      <span class="brand-name">Live</span>
    </div>
  </div>
  <div class="header-right">
    <span class="owner-badge" id="ownerBadge" style="display:none;"></span>
    <a class="owner-link" id="ownerLink" href="/owner/index.html" style="display:none;">Owner</a>
    <a class="go-live-btn" href="go-live.html">Go Live</a>
    <a class="settings-link" href="relviacreators.html" title="RelviaCreators">❖</a>
    <a class="settings-link" href="status.html" title="System status">◈</a>
    <a class="settings-link" href="about.html" title="About Relvia Live">ⓘ</a>
    <a class="settings-link" href="account-settings.html" title="Account settings">⚙</a>
    <a class="avatar" id="profileAvatar" href="profile.html" title="Your profile"></a>
    <a class="go-live-btn" id="signInPill" href="welcome.html" style="display:none;">Sign In</a>
  </div>
</header>

<div class="announcement-banner" id="announcementBanner" style="display:none;">
  <span id="announcementBannerText"></span>
  <button id="announcementBannerClose">×</button>
</div>

<div class="announcement-popup-backdrop" id="announcementPopup" style="display:none;">
  <div class="announcement-popup">
    <div class="icon">✦</div>
    <p id="announcementPopupText"></p>
    <button id="announcementPopupClose">Got it</button>
  </div>
</div>

<main class="app-container">
  <div class="live-search-row">
    <input type="text" id="liveSearch" placeholder="Search live streams..." class="live-search-input">
  </div>

  <div class="featured-section" id="featuredSection">
    <div class="featured-eyebrow">Featured on Relvia Live</div>
    <div id="featuredHeroContainer"></div>
    <div class="featured-strip" id="featuredStrip"></div>
  </div>

  <div class="category-row" id="categoryRow">
    <div class="skeleton" style="width:100px;height:40px;border-radius:999px;aspect-ratio:auto;"></div>
    <div class="skeleton" style="width:100px;height:40px;border-radius:999px;aspect-ratio:auto;"></div>
    <div class="skeleton" style="width:100px;height:40px;border-radius:999px;aspect-ratio:auto;"></div>
  </div>

  <div class="stream-grid" id="streamGrid">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </div>
</main>

<!-- PLAYER OVERLAY -->
<div class="player-overlay" id="playerOverlay">
  <div class="player-box">
    <div class="player-header">
      <div class="player-title" id="playerTitle">—</div>
      <div style="display:flex;align-items:center;gap:10px;">
        <button class="send-relvbits-btn" id="sendRelvbitsBtn">✦ Send RelvBits</button>
        <button class="player-close" id="playerClose">×</button>
      </div>
    </div>
    <div class="player-layout">
      <div class="video-frame">
        <video id="playerVideo" autoplay playsinline></video>
        <div class="player-status" id="playerStatus">
          <span>Connecting to stream...</span>
        </div>
      </div>
      <div class="chat-panel">
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-row">
          <input type="text" id="chatInput" placeholder="Say something..." maxlength="240">
          <button id="chatSendBtn">Send</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="relvbits-modal-backdrop" id="relvbitsModal">
  <div class="relvbits-modal">
    <h3>✦ Send RelvBits</h3>
    <div class="relvbits-error" id="relvbitsError"></div>
    <div class="relvbits-field">
      <label>Amount</label>
      <div class="amount-grid" id="amountGrid">
        <button class="amount-option" data-amount="200">$2</button>
        <button class="amount-option selected" data-amount="500">$5</button>
        <button class="amount-option" data-amount="1000">$10</button>
        <button class="amount-option" data-amount="2500">$25</button>
      </div>
      <input type="number" id="customAmount" placeholder="Custom amount ($1–$1000)" min="1" max="1000" step="1">
    </div>
    <div class="relvbits-field">
      <label>Message (optional)</label>
      <textarea id="relvbitsMessage" maxlength="280" placeholder="Say something..."></textarea>
    </div>
    <div class="anon-row">

async function loadStreams(){
  const grid = document.getElementById("streamGrid");
  grid.innerHTML = `<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>`;

  let query = supabaseClient
    .from("live_streams")
    .select("*")
    .eq("is_live", true)
    .eq("is_test", false)
    .order("featured", { ascending:false })
    .order("viewer_count", { ascending:false });

  if (activeCategoryId !== "all"){
    query = query.eq("category_id", activeCategoryId);
  }

  const { data, error } = await query;

  if (error){
    console.error(error);
    grid.innerHTML = "";
    return;
  }

  streamsCache = data || [];
  hostsCache = {};

  const hostIds = [...new Set(streamsCache.map(s => s.host_id).filter(Boolean))];
  if (hostIds.length > 0){
    const { data: hosts } = await supabaseClient
      .from("live_profiles")
      .select("id, display_name, username, creator_plus")
      .in("id", hostIds);
    (hosts || []).forEach(h => { hostsCache[h.id] = h; });

    const { data: badges } = await supabaseClient.rpc("get_owner_badges", { target_ids: hostIds });
    ownerBadgesCache = {};
    (badges || []).forEach(b => { ownerBadgesCache[b.user_id] = b; });
  }

  renderFeaturedCarousel();
  renderStreamGrid(document.getElementById("liveSearch").value.trim());
}

function renderStreamGrid(searchTerm){
  const grid = document.getElementById("streamGrid");
  const term = (searchTerm || "").toLowerCase().trim();

  const filtered = streamsCache.filter(stream => {
    if (!term) return true;

    return stream.title.toLowerCase().includes(term) || hostName.includes(term);
  });

  if (filtered.length === 0){
    grid.innerHTML = `
      <div class="empty-state" style="grid-column:1/-1;">
        <h4>${term ? "No matching streams" : "Nothing live right now"}</h4>

    return;
  }

  grid.innerHTML = "";
  filtered.forEach(stream => {
    const host = hostsCache[stream.host_id];
    const hostName = host?.display_name || host?.username || "Relvia Creator";

    const card = document.createElement("div");

// ==========================================================
// PLAYER — join LiveKit room as a subscribe-only viewer
// ==========================================================
async function openPlayer(stream){
  const overlay = document.getElementById("playerOverlay");
  const status = document.getElementById("playerStatus");
  const video = document.getElementById("playerVideo");

  currentPlayerStream = stream;
  document.getElementById("playerTitle").textContent = stream.title;
  status.classList.remove("hidden");
  status.innerHTML = `<span>Connecting to stream...</span>`;
  overlay.classList.add("open");
  resetChat();

  const chatInputRow = document.querySelector(".chat-input-row");
  if (chatInputRow){
    chatInputRow.innerHTML = `<input type="text" id="chatInput" placeholder="Say something..." maxlength="240"><button id="chatSendBtn">Send</button>`;
  }

  try {
    const { data: sessionData } = await supabaseClient.auth.getSession();
    const accessToken = sessionData?.session?.access_token;

    const headers = {
      "Content-Type": "application/json",
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": `Bearer ${accessToken || SUPABASE_ANON_KEY}`,
    };

    const response = await fetch(TOKEN_ENDPOINT, {
      method: "POST",
      headers,
      body: JSON.stringify({ streamId: stream.id }),
    });

    const result = await response.json();

    if (!response.ok){
      status.innerHTML = `<span>${escapeHtml(result.error || "Couldn't join this stream.")}</span>`;
      return;
    }

    const room = new LivekitClient.Room();
    currentRoom = room;

    room.on(LivekitClient.RoomEvent.TrackSubscribed, (track) => {
      if (track.kind === "video" || track.kind === "audio"){
        track.attach(video);
        status.classList.add("hidden");
      }
    });

    room.on(LivekitClient.RoomEvent.Disconnected, () => {
      status.classList.remove("hidden");
      status.innerHTML = `<span>Stream ended or connection lost.</span>`;
    });

    await room.connect(LIVEKIT_URL, result.token);
    await loadChatHistory(stream.id);
    subscribeToChatRealtime(stream.id);

    if (currentUser){
      setupChatSend(stream.id);
    } else {
      showSignInToChatPrompt();
    }
  } catch (err){
    console.error("Failed to join stream:", err);
    status.innerHTML = `<span>Couldn't connect to this stream. Try again in a moment.</span>`;
  }
}

function resetChat(){
  document.getElementById("chatMessages").innerHTML = `<div class="chat-empty">Messages appear here once you're connected.</div>`;
}

async function loadChatHistory(streamId){
  const { data: messages, error } = await supabaseClient
    .from("live_chat_messages")
    .select("*")
    .eq("stream_id", streamId)
    .order("created_at", { ascending:true })
    .limit(200);

  if (error || !messages || messages.length === 0) return;

  const senderIds = [...new Set(messages.map(m => m.user_id).filter(Boolean))];
  const { data: senders } = await supabaseClient.from("live_profiles").select("id, display_name").in("id", senderIds);
  const nameById = {};
  (senders || []).forEach(s => { nameById[s.id] = s.display_name; });

  const container = document.getElementById("chatMessages");
  const empty = container.querySelector(".chat-empty");
  if (empty) empty.remove();

  messages.forEach(m => appendChatMessage(nameById[m.user_id] || "Viewer", m.message));
}

let chatRealtimeChannel = null;

function subscribeToChatRealtime(streamId){
  chatRealtimeChannel = supabaseClient
    .channel(`relvia-live-chat-${streamId}`)
    .on("postgres_changes", { event:"INSERT", schema:"public", table:"live_chat_messages", filter:`stream_id=eq.${streamId}` }, async (payload) => {
      const msg = payload.new;
      // Skip our own message — already rendered optimistically on send.
      if (msg.user_id === currentUser?.id) return;
      const { data: sender } = await supabaseClient.from("live_profiles").select("display_name").eq("id", msg.user_id).maybeSingle();
      appendChatMessage(sender?.display_name || "Viewer", msg.message);
    })
    .subscribe();
}

function appendChatMessage(name, text){
  const container = document.getElementById("chatMessages");
  const empty = container.querySelector(".chat-empty");
  if (empty) empty.remove();

  const el = document.createElement("div");
  el.className = "chat-message";
  el.innerHTML = `<span class="name">${escapeHtml(name)}</span><span class="text">${escapeHtml(text)}</span>`;
  container.appendChild(el);
  container.scrollTop = container.scrollHeight;
}

function setupRelvbitsModal(){
  const modal = document.getElementById("relvbitsModal");
  const amountGrid = document.getElementById("amountGrid");
  const customAmount = document.getElementById("customAmount");
  let selectedAmountCents = 500;

  document.getElementById("sendRelvbitsBtn").addEventListener("click", () => {
    if (!currentPlayerStream){ return; }
    if (!currentUser){
      window.location.href = "welcome.html";
      return;
    }
    document.getElementById("relvbitsError").classList.remove("show");
    modal.classList.add("open");
  });

  document.getElementById("relvbitsCancelBtn").addEventListener("click", () => modal.classList.remove("open"));
  modal.addEventListener("click", (e) => { if (e.target === modal) modal.classList.remove("open"); });

  amountGrid.querySelectorAll(".amount-option").forEach(btn => {
    btn.addEventListener("click", () => {
      amountGrid.querySelectorAll(".amount-option").forEach(b => b.classList.remove("selected"));
      btn.classList.add("selected");
      selectedAmountCents = parseInt(btn.dataset.amount, 10);
      customAmount.value = "";
    });
  });

  customAmount.addEventListener("input", () => {
    amountGrid.querySelectorAll(".amount-option").forEach(b => b.classList.remove("selected"));
    const dollars = parseFloat(customAmount.value);
    selectedAmountCents = isFinite(dollars) ? Math.round(dollars * 100) : 0;
  });

  document.getElementById("relvbitsConfirmBtn").addEventListener("click", async () => {
    const errorEl = document.getElementById("relvbitsError");
    errorEl.classList.remove("show");

    if (!selectedAmountCents || selectedAmountCents < 100 || selectedAmountCents > 100000){
      errorEl.textContent = "Choose an amount between $1 and $1,000.";
      errorEl.classList.add("show");
      return;
    }

    const btn = document.getElementById("relvbitsConfirmBtn");
    btn.disabled = true; btn.textContent = "Redirecting to payment...";

    const { data: sessionData } = await supabaseClient.auth.getSession();
    const accessToken = sessionData?.session?.access_token;

    try {
      const response = await fetch(RELVBITS_CHECKOUT_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json", "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${accessToken}` },
        body: JSON.stringify({
          creatorId: currentPlayerStream.host_id,
          amountCents: selectedAmountCents,
          message: document.getElementById("relvbitsMessage").value.trim(),
          isAnonymous: document.getElementById("relvbitsAnon").checked,
          streamId: currentPlayerStream.id,
        }),
      });
      const result = await response.json();

      if (!response.ok || !result.checkoutUrl){
        errorEl.textContent = result.error || "Couldn't start checkout.";
        errorEl.classList.add("show");
        btn.disabled = false; btn.textContent = "Continue to payment";
        return;
      }

      window.location.href = result.checkoutUrl;
    } catch (err){
      console.error(err);
      errorEl.textContent = "Couldn't reach the server.";
      errorEl.classList.add("show");
      btn.disabled = false; btn.textContent = "Continue to payment";
    }
  });
}

function showSignInToChatPrompt(){
  const row = document.querySelector(".chat-input-row");
  if (row) row.innerHTML = `<a href="welcome.html" style="flex:1;text-align:center;padding:9px;color:var(--gold);font-weight:700;font-size:13px;border:1px solid var(--gold-end);border-radius:10px;">Sign in to chat</a>`;
}

function setupChatSend(streamId){
  const input = document.getElementById("chatInput");
  const sendBtn = document.getElementById("chatSendBtn");

  const send = async () => {
    const text = input.value.trim();
    if (!text || !currentUser) return;

    const name = liveProfile?.display_name || liveProfile?.username || "Viewer";

    const { error } = await supabaseClient
      .from("live_chat_messages")
      .insert({ stream_id: streamId, user_id: currentUser.id, message: text });

    if (error){
      console.error("Failed to send chat message:", error);
      return;
    }

    appendChatMessage(name, text); // show our own message immediately
    input.value = "";
  };

  sendBtn.onclick = send;
  input.onkeydown = (e) => { if (e.key === "Enter") send(); };
}

function closePlayer(){
  const overlay = document.getElementById("playerOverlay");
  const video = document.getElementById("playerVideo");

  if (currentRoom){
    currentRoom.disconnect();
    currentRoom = null;
  }
  if (chatRealtimeChannel){
    supabaseClient.removeChannel(chatRealtimeChannel);
    chatRealtimeChannel = null;
  }
  video.srcObject = null;
  overlay.classList.remove("open");
  resetChat();
  currentPlayerStream = null;
}

initialize();

</script>
