<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relvia Live</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js"></script>

<style>
:root{
  --background:#0a0806; --glass:rgba(18,14,10,.6); --surface-light:#1c150d; --surface:rgba(20,16,11,.78);
  --border:#2a2018; --border-soft:#1c1610; --gold-start:#f2c766; --gold-end:#b9832f; --gold:#e0b158;
  --text:#f5f1ea; --muted:#a89e8f; --muted-soft:#6b6255; --live-red:#e0574f;
  --radius-lg:24px; --font-display:"Playfair Display",serif; --font-body:"Inter",sans-serif;
}
*{ margin:0; padding:0; box-sizing:border-box; font-family:var(--font-body); }
html{ scroll-behavior:smooth; }
body{
  background:
    radial-gradient(ellipse 900px 500px at 15% -5%, rgba(217,169,75,.10), transparent 60%),
    radial-gradient(ellipse 700px 500px at 100% 20%, rgba(185,131,47,.06), transparent 55%),
    var(--background);
  background-attachment:fixed; color:var(--text); overflow-x:hidden;
}
button, input{ font-family:inherit; }
button{ cursor:pointer; border:none; background:none; color:inherit; font-size:inherit; }
img{ max-width:100%; display:block; }

/* HEADER — brand only, no nav links */
.topbar{
  position:fixed; top:0; left:0; right:0; height:76px;
  display:flex; align-items:center; justify-content:space-between; padding:0 32px;
  background:rgba(5,5,5,.82); backdrop-filter:blur(20px); border-bottom:1px solid var(--border-soft);
  z-index:999;
}
.brand{ display:flex; align-items:center; gap:12px; }
.brand-badge{
  width:38px; height:38px; border-radius:50%; background:#000;
  background-image:radial-gradient(circle at 32% 22%, rgba(242,199,102,.28), transparent 65%);
  border:1.5px solid var(--gold-end); display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-style:italic; font-weight:700; font-size:19px; color:var(--gold-start);
}
.brand-text{ display:flex; align-items:center; gap:8px; }
.brand-name{ font-family:var(--font-display); font-weight:700; font-size:19px; }
.live-dot{ width:8px; height:8px; border-radius:50%; background:var(--live-red); box-shadow:0 0 0 3px rgba(224,87,79,.2); }

.header-right{ display:flex; align-items:center; gap:14px; }
.owner-badge{
  background:linear-gradient(135deg,var(--gold-start),var(--gold-end));
  color:#000; font-size:11px; font-weight:800; padding:5px 12px; border-radius:999px; letter-spacing:.3px;
}
.owner-link{
  font-size:13px; font-weight:700; color:var(--gold); border:1px solid var(--gold-end);
  padding:8px 16px; border-radius:12px; transition:.2s; text-decoration:none;
}
.owner-link:hover{ background:var(--gold); color:#000; }

.avatar{
  width:40px; height:40px; border-radius:50%; overflow:hidden;
  background:linear-gradient(135deg,#2a2a2a,#171717); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; cursor:pointer;
}

/* LAYOUT */
.app-container{ max-width:1500px; margin:auto; padding:104px 30px 60px; }

.category-row{ display:flex; gap:10px; overflow-x:auto; padding-bottom:6px; margin-bottom:30px; }
.category-row::-webkit-scrollbar{ display:none; }
.category-pill{
  white-space:nowrap; background:var(--surface-light); border:1px solid var(--border);
  padding:11px 22px; border-radius:999px; font-size:14px; font-weight:600; color:#ddd; transition:.2s;
}
.category-pill:hover{ border-color:var(--gold); color:var(--gold); }
.category-pill.active{
  background:linear-gradient(135deg,var(--gold-start),var(--gold-end)); color:#000; border-color:transparent;
}

.stream-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:22px; }

.stream-card{
  background:var(--glass); border:1px solid var(--border); border-radius:18px; overflow:hidden;
  cursor:pointer; transition:transform .2s, border-color .2s;
}
.stream-card:hover{ transform:translateY(-3px); border-color:var(--gold-end); }
.stream-thumb{
  aspect-ratio:16/9; background:linear-gradient(135deg,#1c1a15,#0d0d0d 55%,#1a1508);
  position:relative; overflow:hidden;
}
.stream-thumb img{ width:100%; height:100%; object-fit:cover; }
.live-badge{
  position:absolute; top:12px; left:12px; background:var(--live-red); color:white;
  font-size:11px; font-weight:800; letter-spacing:.5px; padding:4px 10px; border-radius:6px;
  display:flex; align-items:center; gap:6px;
}
.live-badge .dot{ width:6px; height:6px; border-radius:50%; background:white; }
.viewer-count{
  position:absolute; bottom:12px; right:12px; background:rgba(0,0,0,.6); color:white;
  font-size:11.5px; font-weight:600; padding:4px 10px; border-radius:6px; backdrop-filter:blur(4px);
}
.featured-badge{
  position:absolute; top:12px; right:12px;
  background:linear-gradient(135deg,var(--gold-start),var(--gold-end)); color:#000;
  font-size:11px; font-weight:800; padding:4px 10px; border-radius:6px;
}
.stream-info{ padding:14px 16px; }
.stream-title{ font-size:14.5px; font-weight:700; margin-bottom:4px; line-height:1.3; }
.stream-host{ font-size:12.5px; color:var(--muted); }

.empty-state{ padding:70px 20px; text-align:center; color:var(--muted); }
.empty-state h4{ color:#ddd; font-size:17px; margin-bottom:8px; font-family:var(--font-display); font-size:22px; }
.empty-state p{ font-size:13.5px; }

.skeleton{ background:linear-gradient(90deg,#141414 25%,#1c1c1c 37%,#141414 63%); background-size:400% 100%; animation:shimmer 1.4s ease infinite; border-radius:18px; aspect-ratio:16/9; }
@keyframes shimmer{ 0%{background-position:100% 0;} 100%{background-position:0 0;} }

/* PLAYER OVERLAY */
.player-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.9); backdrop-filter:blur(6px);
  display:none; align-items:center; justify-content:center; z-index:2000; padding:30px;
}
.player-overlay.open{ display:flex; }
.player-box{ width:100%; max-width:1100px; }
.player-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.player-title{ font-family:var(--font-display); font-size:20px; font-weight:600; }
.player-close{
  width:40px; height:40px; border-radius:50%; background:var(--surface-light); border:1px solid var(--border);
  font-size:18px; display:flex; align-items:center; justify-content:center;
}
.player-close:hover{ border-color:var(--gold); color:var(--gold); }
.video-frame{
  width:100%; aspect-ratio:16/9; background:#000; border-radius:18px; overflow:hidden;
  border:1px solid var(--border); position:relative;
}
.video-frame video{ width:100%; height:100%; object-fit:contain; background:#000; }
.player-status{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  color:var(--muted); font-size:14px; flex-direction:column; gap:10px; text-align:center; padding:20px;
}
.player-status.hidden{ display:none; }

.toast{
  position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--surface); border:1px solid var(--gold); color:white;
  padding:13px 22px; border-radius:14px; font-size:13.5px; font-weight:600;
  opacity:0; pointer-events:none; transition:.25s; z-index:3000;
}
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

@media(max-width:700px){
  .topbar{ padding:0 18px; }
  .app-container{ padding:92px 16px 40px; }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-badge">R</div>
    <div class="brand-text">
      <span class="brand-name">Relvia</span>
      <span class="live-dot"></span>
      <span class="brand-name">Live</span>
    </div>
  </div>
  <div class="header-right">
    <span class="owner-badge" id="ownerBadge" style="display:none;"></span>
    <a class="owner-link" id="ownerLink" href="owner-panel.html" style="display:none;">Owner</a>
    <div class="avatar" id="profileAvatar" title="Your Live account"></div>
  </div>
</header>

<main class="app-container">
  <div class="category-row" id="categoryRow">
    <div class="skeleton" style="width:100px;height:40px;border-radius:999px;aspect-ratio:auto;"></div>
    <div class="skeleton" style="width:100px;height:40px;border-radius:999px;aspect-ratio:auto;"></div>
    <div class="skeleton" style="width:100px;height:40px;border-radius:999px;aspect-ratio:auto;"></div>
  </div>

  <div class="stream-grid" id="streamGrid">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </div>
</main>

<!-- PLAYER OVERLAY -->
<div class="player-overlay" id="playerOverlay">
  <div class="player-box">
    <div class="player-header">
      <div class="player-title" id="playerTitle">—</div>
      <button class="player-close" id="playerClose">×</button>
    </div>
    <div class="video-frame">
      <video id="playerVideo" autoplay playsinline></video>
      <div class="player-status" id="playerStatus">
        <span>Connecting to stream...</span>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>

// ==========================================================
// CONFIG — fill in your LiveKit Cloud WebSocket URL below.
// This URL is safe to expose client-side (it's just an
// endpoint, not a credential). Find it in your LiveKit Cloud
// project settings, format: wss://your-project.livekit.cloud
// ==========================================================
const LIVEKIT_URL = "wss://YOUR-PROJECT.livekit.cloud"; // <-- replace this

const SUPABASE_URL = "https://nqcbhpqzzwjgkusfbexo.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5xY2JocHF6endqZ2t1c2ZiZXhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzNjY1NjEsImV4cCI6MjA5ODk0MjU2MX0.BphyIGT-X9ctYVvfYXw_ldo5XGguNv5j-zDiGBPrCVU";
const TOKEN_ENDPOINT = `${SUPABASE_URL}/functions/v1/mint-livekit-token`;

// Same isolated storage key as live-login.html, so this session
// never overlaps with the Social app's session.
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { storageKey: "relvia-live-auth" }
});

let currentUser = null;
let liveProfile = null;
let categories = [];
let activeCategoryId = "all";
let currentRoom = null; // active LiveKit Room instance, if connected

function showToast(message){
  const toast = document.getElementById("toast");
  toast.textContent = message;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 2400);
}

function escapeHtml(str){
  return (str || "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

// ==========================================================
// INIT
// ==========================================================
async function initialize(){
  try {
    const { data: sessionData } = await supabaseClient.auth.getSession();
    if (!sessionData || !sessionData.session){
      window.location.href = "live-login.html";
      return;
    }

    const { data: userData, error } = await supabaseClient.auth.getUser();
    if (error || !userData.user){
      window.location.href = "live-login.html";
      return;
    }

    currentUser = userData.user;

    const banned = await loadLiveProfile();
    if (banned) return;

    await checkOwnerStatus();
    await loadCategories();
    await loadStreams();

    document.getElementById("playerClose").addEventListener("click", closePlayer);
  } catch (err){
    console.error("Relvia Live init failed:", err);
    window.location.href = "live-login.html";
  }
}

async function loadLiveProfile(){
  const { data } = await supabaseClient
    .from("live_profiles")
    .select("*")
    .eq("id", currentUser.id)
    .maybeSingle();

  liveProfile = data;

  if (liveProfile?.banned_from_watching){
    document.body.innerHTML = `
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;text-align:center;padding:24px;">
        <h2 style="font-family:var(--font-display);font-size:24px;">You're restricted from Relvia Live</h2>
        <p style="color:var(--muted);font-size:14px;max-width:360px;">${liveProfile.ban_reason ? escapeHtml(liveProfile.ban_reason) : "Contact support if you think this is a mistake."}</p>
      </div>`;
    return true; // signal caller to stop further init
  }

  const avatar = document.getElementById("profileAvatar");
  const initial = (liveProfile?.display_name || "R").charAt(0).toUpperCase();
  avatar.innerHTML = liveProfile?.avatar_url
    ? `<img src="${liveProfile.avatar_url}" style="width:100%;height:100%;object-fit:cover;">`
    : initial;
}

// ==========================================================
// OWNER STATUS
// ==========================================================
async function checkOwnerStatus(){
  const { data, error } = await supabaseClient
    .from("live_owners")
    .select("badge_label")
    .eq("user_id", currentUser.id)
    .maybeSingle();

  if (error){ console.error(error); return; }
  if (!data) return;

  document.getElementById("ownerBadge").textContent = data.badge_label || "Owner";
  document.getElementById("ownerBadge").style.display = "inline-block";
  document.getElementById("ownerLink").style.display = "inline-block";
}

// ==========================================================
// CATEGORIES
// ==========================================================
async function loadCategories(){
  const { data, error } = await supabaseClient
    .from("live_categories")
    .select("*")
    .order("sort_order", { ascending:true });

  const row = document.getElementById("categoryRow");

  if (error){
    console.error(error);
    row.innerHTML = "";
    return;
  }

  categories = data || [];
  row.innerHTML = "";

  const allPill = document.createElement("div");
  allPill.className = "category-pill active";
  allPill.textContent = "All";
  allPill.dataset.categoryId = "all";
  allPill.addEventListener("click", () => selectCategory("all", allPill));
  row.appendChild(allPill);

  categories.forEach(cat => {
    const pill = document.createElement("div");
    pill.className = "category-pill";
    pill.textContent = cat.name;
    pill.dataset.categoryId = cat.id;
    pill.addEventListener("click", () => selectCategory(cat.id, pill));
    row.appendChild(pill);
  });
}

async function selectCategory(categoryId, pillEl){
  activeCategoryId = categoryId;
  document.querySelectorAll(".category-pill").forEach(p => p.classList.remove("active"));
  pillEl.classList.add("active");
  await loadStreams();
}

// ==========================================================
// STREAMS
// ==========================================================
async function loadStreams(){
  const grid = document.getElementById("streamGrid");
  grid.innerHTML = `<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>`;

  let query = supabaseClient
    .from("live_streams")
    .select("*")
    .eq("is_live", true)
    .order("featured", { ascending:false })
    .order("viewer_count", { ascending:false });

  if (activeCategoryId !== "all"){
    query = query.eq("category_id", activeCategoryId);
  }

  const { data, error } = await query;

  if (error){
    console.error(error);
    grid.innerHTML = "";
    return;
  }

  if (!data || data.length === 0){
    grid.innerHTML = `
      <div class="empty-state" style="grid-column:1/-1;">
        <h4>Nothing live right now</h4>
        <p>Check back soon, or try a different category.</p>
      </div>`;
    return;
  }

  // Fetch host display names for the visible streams (best-effort).
  const hostIds = [...new Set(data.map(s => s.host_id).filter(Boolean))];
  let hostsById = {};
  if (hostIds.length > 0){
    const { data: hosts } = await supabaseClient
      .from("live_profiles")
      .select("id, display_name, username")
      .in("id", hostIds);
    (hosts || []).forEach(h => { hostsById[h.id] = h; });
  }

  grid.innerHTML = "";
  data.forEach(stream => {
    const host = hostsById[stream.host_id];
    const hostName = host?.display_name || host?.username || "Relvia Creator";

    const card = document.createElement("div");
    card.className = "stream-card";
    card.innerHTML = `
      <div class="stream-thumb">
        ${stream.thumbnail_url ? `<img src="${stream.thumbnail_url}" loading="lazy">` : ""}
        <div class="live-badge"><span class="dot"></span>LIVE</div>
        ${stream.featured ? `<div class="featured-badge">Featured</div>` : ""}
        <div class="viewer-count">${stream.viewer_count || 0} watching</div>
      </div>
      <div class="stream-info">
        <div class="stream-title">${escapeHtml(stream.title)}</div>
        <div class="stream-host">${escapeHtml(hostName)}</div>
      </div>`;
    card.addEventListener("click", () => openPlayer(stream));
    grid.appendChild(card);
  });
}

// ==========================================================
// PLAYER — join LiveKit room as a subscribe-only viewer
// ==========================================================
async function openPlayer(stream){
  const overlay = document.getElementById("playerOverlay");
  const status = document.getElementById("playerStatus");
  const video = document.getElementById("playerVideo");

  document.getElementById("playerTitle").textContent = stream.title;
  status.classList.remove("hidden");
  status.innerHTML = `<span>Connecting to stream...</span>`;
  overlay.classList.add("open");

  try {
    const { data: sessionData } = await supabaseClient.auth.getSession();
    const accessToken = sessionData?.session?.access_token;

    const response = await fetch(TOKEN_ENDPOINT, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${accessToken}`,
      },
      body: JSON.stringify({ streamId: stream.id }),
    });

    const result = await response.json();

    if (!response.ok){
      status.innerHTML = `<span>${escapeHtml(result.error || "Couldn't join this stream.")}</span>`;
      return;
    }

    const room = new LivekitClient.Room();
    currentRoom = room;

    room.on(LivekitClient.RoomEvent.TrackSubscribed, (track) => {
      if (track.kind === "video" || track.kind === "audio"){
        track.attach(video);
        status.classList.add("hidden");
      }
    });

    room.on(LivekitClient.RoomEvent.Disconnected, () => {
      status.classList.remove("hidden");
      status.innerHTML = `<span>Stream ended or connection lost.</span>`;
    });

    await room.connect(LIVEKIT_URL, result.token);
  } catch (err){
    console.error("Failed to join stream:", err);
    status.innerHTML = `<span>Couldn't connect to this stream. Try again in a moment.</span>`;
  }
}

function closePlayer(){
  const overlay = document.getElementById("playerOverlay");
  const video = document.getElementById("playerVideo");

  if (currentRoom){
    currentRoom.disconnect();
    currentRoom = null;
  }
  video.srcObject = null;
  overlay.classList.remove("open");
}

initialize();

</script>
</body>
</html>
