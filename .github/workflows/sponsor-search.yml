name: Sponsor search (weekly)

on:
  schedule:
    - cron: "0 14 * * 1"   # every Monday, 9 a.m. Eastern
  workflow_dispatch:        # run it by hand from the Actions tab

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: Run the sponsor bot
        env:
          CRON_SECRET: ${{ secrets.SPONSOR_CRON_SECRET }}
        run: |
          curl -fsS -X POST "https://nqcbhpqzzwjgkusfbexo.supabase.co/functions/v1/sponsor-search" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{}'
