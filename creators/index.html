<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RelviaCreators</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --background:#0a0806; --glass:#120e09; --surface-light:#161008; --surface:#1c150d;
  --border:#2a2018; --border-soft:#1c1610; --gold-start:#f2c766; --gold-end:#b9832f; --gold:#e0b158;
  --text:#f5f1ea; --muted:#a89e8f; --muted-soft:#6b6255; --danger:#e0574f;
  --font-display:"Playfair Display",serif; --font-body:"Inter",sans-serif;
}
*{ margin:0; padding:0; box-sizing:border-box; font-family:var(--font-body); }
body{ color:var(--text); min-height:100vh; background:var(--background); }
a{ text-decoration:none; color:inherit; }
button, input, textarea{ font-family:inherit; }
button{ cursor:pointer; border:none; background:none; color:inherit; font-size:inherit; }
img, video{ max-width:100%; display:block; }

.topbar{
  position:sticky; top:0; height:68px; display:flex; align-items:center; justify-content:space-between;
  padding:0 26px; background:rgba(5,5,5,.9); backdrop-filter:blur(18px); border-bottom:1px solid var(--border-soft); z-index:50;
}
.brand{ display:flex; align-items:center; gap:12px; }
.brand-badge{ width:32px; height:32px; border-radius:50%; background:#000; border:1.5px solid var(--gold-end); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-style:italic; font-weight:700; font-size:16px; color:var(--gold-start); }
.brand-name{ font-family:var(--font-display); font-weight:700; font-size:16px; }
.top-actions{ display:flex; align-items:center; gap:14px; }
.icon-btn{ position:relative; font-size:19px; color:var(--muted); }
.icon-btn:hover{ color:var(--gold); }
.unread-badge{ position:absolute; top:-4px; right:-6px; background:var(--danger); color:white; font-size:9.5px; font-weight:800; min-width:15px; height:15px; border-radius:999px; display:flex; align-items:center; justify-content:center; padding:0 3px; }
.avatar-sm{ width:32px; height:32px; border-radius:50%; overflow:hidden; background:#1a1a1a; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; }

.layout{ max-width:640px; margin:auto; padding:22px 16px 80px; }

.stories-row{ display:flex; gap:14px; overflow-x:auto; padding-bottom:14px; margin-bottom:18px; border-bottom:1px solid var(--border-soft); }
.stories-row::-webkit-scrollbar{ display:none; }
.story-item{ display:flex; flex-direction:column; align-items:center; gap:6px; flex-shrink:0; cursor:pointer; width:64px; }
.story-ring{ width:58px; height:58px; border-radius:50%; padding:2.5px; background:var(--border); }
.story-ring.unseen{ background:linear-gradient(135deg,var(--gold-start),var(--gold-end)); }
.story-ring-inner{ width:100%; height:100%; border-radius:50%; background:var(--background); padding:2px; }
.story-avatar{ width:100%; height:100%; border-radius:50%; overflow:hidden; background:#1a1a1a; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700; }
.story-name{ font-size:10.5px; color:var(--muted); text-align:center; max-width:64px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.story-item.add-story .story-ring-inner{ display:flex; align-items:center; justify-content:center; }
.add-story-plus{ font-size:20px; color:var(--gold); }

.composer{ background:var(--glass); border:1px solid var(--border); border-radius:16px; padding:16px; margin-bottom:22px; }
.composer-row{ display:flex; gap:12px; }
.composer textarea{ flex:1; background:transparent; border:none; color:white; font-size:14px; resize:none; min-height:44px; }
.composer textarea:focus{ outline:none; }
.composer-actions{ display:flex; justify-content:space-between; align-items:center; margin-top:10px; padding-top:10px; border-top:1px solid var(--border-soft); }
.composer-attach-btn{ font-size:12px; color:var(--muted); font-weight:700; }
.composer-attach-btn:hover{ color:var(--gold); }
.composer-post-btn{ background:linear-gradient(135deg,var(--gold-start),var(--gold-end)); color:#000; font-weight:800; font-size:12.5px; padding:9px 20px; border-radius:10px; }
.composer-post-btn:disabled{ opacity:.4; cursor:not-allowed; }
.composer-preview{ margin-top:10px; position:relative; display:none; }
.composer-preview.show{ display:block; }
.composer-preview img{ max-height:200px; border-radius:10px; }
.composer-preview-remove{ position:absolute; top:6px; right:6px; background:rgba(0,0,0,.7); color:white; width:22px; height:22px; border-radius:50%; font-size:12px; }

.post-card{ background:var(--glass); border:1px solid var(--border); border-radius:16px; padding:16px; margin-bottom:16px; }
.post-card.sponsored{ border-color:rgba(217,169,75,.35); }
.sponsored-tag{
  display:inline-flex; align-items:center; gap:5px; font-size:10px; font-weight:800; letter-spacing:.5px;
  color:var(--gold); text-transform:uppercase; margin-bottom:10px;
}
.sponsored-cta{
  display:inline-block; margin-top:10px; font-size:12px; font-weight:800; color:var(--gold);
  border:1px solid var(--gold-end); padding:6px 14px; border-radius:999px;
}
.sponsored-cta:hover{ background:var(--gold); color:#000; }
.post-header{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
.post-header-info{ flex:1; }
.post-author-row{ display:flex; align-items:center; gap:6px; }
.post-author{ font-size:13.5px; font-weight:700; }
.verified-badge{ display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px; border-radius:50%; background:linear-gradient(135deg,var(--gold-start),var(--gold-end)); color:#000; font-size:10px; font-weight:900; }
.role-badge{ font-size:10px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:#000; background:linear-gradient(135deg,var(--gold-start),var(--gold-end)); padding:3px 9px; border-radius:999px; }
.post-time{ font-size:11px; color:var(--muted-soft); }
.follow-btn{ font-size:11.5px; font-weight:700; color:var(--gold); border:1px solid var(--gold-end); padding:5px 12px; border-radius:999px; }
.follow-btn.following{ color:var(--muted); border-color:var(--border); }
.post-caption{ font-size:14px; line-height:1.6; margin-bottom:10px; white-space:pre-wrap; }
.post-media img, .post-media video{ width:100%; border-radius:12px; margin-bottom:10px; max-height:480px; object-fit:cover; }
.post-actions{ display:flex; gap:20px; padding-top:10px; border-top:1px solid var(--border-soft); }
.post-action-btn{ display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted); }
.post-action-btn:hover{ color:var(--gold); }
.post-action-btn.liked{ color:var(--gold); font-weight:700; }

.comments-block{ margin-top:12px; padding-top:12px; border-top:1px solid var(--border-soft); display:none; }
.comments-block.show{ display:block; }
.comment-item{ display:flex; gap:8px; margin-bottom:10px; font-size:12.5px; }
.comment-author{ font-weight:700; color:var(--gold); margin-right:5px; }
.comment-input-row{ display:flex; gap:8px; margin-top:8px; }
.comment-input-row input{ flex:1; background:var(--surface-light); border:1px solid var(--border); border-radius:10px; padding:8px 12px; color:white; font-size:12.5px; }
.comment-input-row button{ font-size:11.5px; font-weight:700; color:var(--gold); padding:0 10px; }

.empty-state{ text-align:center; color:var(--muted); padding:60px 20px; }
.empty-state h4{ color:#ddd; font-size:18px; margin-bottom:8px; font-family:var(--font-display); }
.loading-state{ text-align:center; color:var(--muted); padding:60px 0; }

.story-viewer-backdrop{ position:fixed; inset:0; background:#000; display:none; align-items:center; justify-content:center; z-index:3000; }
.story-viewer-backdrop.open{ display:flex; }
.story-viewer{ width:100%; max-width:420px; height:100%; max-height:760px; position:relative; background:#111; border-radius:12px; overflow:hidden; }
.story-viewer img{ width:100%; height:100%; object-fit:contain; background:#000; }
.story-progress-track{ position:absolute; top:10px; left:10px; right:10px; height:3px; background:rgba(255,255,255,.25); border-radius:999px; z-index:2; }
.story-progress-fill{ height:100%; background:white; border-radius:999px; width:0%; }
.story-viewer-header{ position:absolute; top:20px; left:14px; right:14px; display:flex; align-items:center; gap:10px; z-index:2; }
.story-viewer-close{ position:absolute; top:20px; right:14px; color:white; font-size:22px; z-index:3; }
.story-viewer-caption{ position:absolute; bottom:20px; left:14px; right:14px; color:white; font-size:13px; text-shadow:0 2px 6px rgba(0,0,0,.7); z-index:2; }
.story-nav-zone{ position:absolute; top:0; bottom:0; width:35%; z-index:1; }
.story-nav-zone.left{ left:0; } .story-nav-zone.right{ right:0; }

.modal-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.75); backdrop-filter:blur(4px); display:none; align-items:center; justify-content:center; z-index:2500; padding:24px; }
.modal-backdrop.open{ display:flex; }
.modal{ background:var(--surface); border:1px solid var(--gold-end); border-radius:20px; padding:24px; max-width:400px; width:100%; }
.modal h3{ font-family:var(--font-display); font-size:18px; margin-bottom:16px; }
.modal-field{ margin-bottom:12px; }
.modal-field label{ font-size:11.5px; color:var(--muted); display:block; margin-bottom:5px; font-weight:600; }
.modal-field input{ width:100%; background:var(--surface-light); border:1px solid var(--border); border-radius:10px; padding:9px 12px; color:white; font-size:13px; }
.modal-actions{ display:flex; gap:10px; margin-top:16px; }
.modal-actions button{ flex:1; padding:11px; border-radius:12px; font-weight:800; font-size:13px; }
.modal-cancel{ background:var(--surface-light); border:1px solid var(--border); color:var(--text); }
.modal-confirm{ background:linear-gradient(135deg,var(--gold-start),var(--gold-end)); color:#000; border:none; }

.toast{ position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--surface); border:1px solid var(--gold); color:white; padding:12px 20px; border-radius:14px; font-size:13px; font-weight:600; opacity:0; pointer-events:none; transition:.25s; z-index:4000; }
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
.feed-tabs{ display:flex; gap:8px; margin:16px 0 4px; }
.feed-tab{ font-size:13px; font-weight:700; color:var(--muted); padding:9px 18px; border-radius:10px; background:var(--surface-light); border:1px solid var(--border); cursor:pointer; }
.feed-tab.active{ background:linear-gradient(135deg,var(--gold-start),var(--gold-end)); color:#000; border:none; }

.trending-tags-row{ display:flex; gap:8px; flex-wrap:wrap; margin:14px 0; }
.trending-tag-chip{ font-size:12px; font-weight:700; color:var(--gold); border:1px solid var(--gold-end); padding:6px 14px; border-radius:999px; cursor:pointer; }
.trending-tag-chip:hover{ background:rgba(217,169,75,.1); }
.trending-tag-chip.active{ background:linear-gradient(135deg,var(--gold-start),var(--gold-end)); color:#000; border:none; }

.hashtag-link{ color:var(--gold); font-weight:600; }

.composer-poll-block{ margin-top:10px; padding:12px; background:var(--surface-light); border:1px solid var(--border); border-radius:12px; }
.composer-poll-block input[type="text"]{ background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:8px 10px; color:white; font-size:13px; }
.poll-option-row{ display:flex; gap:6px; margin-bottom:6px; align-items:center; }
.poll-option-row input{ flex:1; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:7px 10px; color:white; font-size:13px; }
.poll-option-row button{ font-size:11px; color:var(--danger); }

.poll-display{ margin:10px 0; }
.poll-question{ font-weight:700; font-size:14px; margin-bottom:10px; }
.poll-option-bar{ position:relative; background:var(--surface-light); border:1px solid var(--border); border-radius:10px; padding:9px 12px; margin-bottom:8px; cursor:pointer; overflow:hidden; }
.poll-option-fill{ position:absolute; inset:0; background:rgba(217,169,75,.18); z-index:0; transition:width .3s; }
.poll-option-content{ position:relative; z-index:1; display:flex; justify-content:space-between; font-size:13px; }
.poll-total-votes{ font-size:11.5px; color:var(--muted); margin-top:4px; }

.reaction-btn-wrap{ position:relative; display:inline-block; }
.reaction-picker{
  position:absolute; bottom:100%; left:0; margin-bottom:8px; background:var(--surface); border:1px solid var(--gold-end);
  border-radius:999px; padding:6px 8px; display:none; gap:6px; box-shadow:0 10px 30px -8px rgba(0,0,0,.6); z-index:10;
}
.reaction-btn-wrap:hover .reaction-picker{ display:flex; }
.reaction-option{ font-size:17px; padding:4px; border-radius:50%; cursor:pointer; transition:.15s; }
.reaction-option:hover{ transform:scale(1.3); }

/* ===== RelviaCreators refresh ===== */
body{
  background:
    radial-gradient(ellipse 900px 500px at 12% -8%, rgba(224,177,88,.10), transparent 60%),
    radial-gradient(ellipse 700px 460px at 100% 20%, rgba(185,131,47,.06), transparent 60%),
    #070504;
  background-attachment:fixed;
}
.topbar{ height:72px; padding:0 clamp(16px,3vw,36px); background:rgba(7,5,4,.88); border-bottom:1px solid rgba(224,177,88,.28); box-shadow:0 12px 40px -24px rgba(224,177,88,.35); gap:20px; }
.brand{ gap:12px; }
.crest{ width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-style:italic; font-weight:800; font-size:21px; color:var(--gold-start); border:1.5px solid var(--gold-end); background:radial-gradient(circle at 32% 24%,rgba(246,210,122,.28),transparent 68%),#000; box-shadow:0 0 20px -4px rgba(224,177,88,.45); }
.brand-text{ display:flex; flex-direction:column; line-height:1; }
.brand-text .brand-name{ font-family:var(--font-display); font-weight:800; font-size:24px; letter-spacing:-.02em; background:linear-gradient(100deg,var(--gold-start),var(--gold-end) 55%,var(--gold-start)); -webkit-background-clip:text; background-clip:text; color:transparent; }
.brand-sub{ margin-top:5px; font-size:9.5px; font-weight:700; letter-spacing:.4em; color:var(--gold-end); }
.top-nav{ display:flex; gap:clamp(14px,2.2vw,28px); margin-left:auto; }
.top-nav a{ font-size:13px; font-weight:600; color:#cfc2a3; transition:color .2s; }
.top-nav a:hover{ color:var(--gold-start); }
.top-actions{ gap:16px; }
.msg-link{ position:relative; font-size:13px; font-weight:700; color:var(--gold); border:1px solid rgba(224,177,88,.35); padding:8px 16px; border-radius:999px; transition:background .2s, color .2s; }
.msg-link:hover{ background:var(--gold); color:#000; }
.msg-link .unread-badge{ top:-6px; right:-6px; }
.avatar-sm{ border:1px solid rgba(224,177,88,.3); }

.layout{ max-width:1120px; display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:36px; padding:30px clamp(16px,3vw,32px) 90px; align-items:start; }
.feed-col{ min-width:0; max-width:680px; width:100%; margin:0 auto; }

.stories-row{ gap:16px; padding-bottom:18px; margin-bottom:22px; }
.story-ring{ width:64px; height:64px; }
.story-item{ width:70px; }

.composer{ border-radius:18px; padding:18px; background:linear-gradient(180deg,#130e09,#0f0b08); transition:border-color .25s, box-shadow .25s; }
.composer:focus-within{ border-color:rgba(224,177,88,.55); box-shadow:0 0 0 4px rgba(224,177,88,.07); }
.composer textarea{ font-size:15.5px; min-height:52px; }
.composer-poll-block{ margin-top:12px; padding:14px; border:1px solid var(--border); border-radius:12px; background:var(--surface-light); }

.feed-tabs{ gap:26px; margin:22px 0 14px; border-bottom:1px solid var(--border-soft); }
.feed-tab{ background:none; border:none; border-radius:0; padding:12px 2px; font-size:14px; color:var(--muted); position:relative; }
.feed-tab.active{ background:none; color:var(--gold-start); }
.feed-tab.active::after{ content:""; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:linear-gradient(90deg,var(--gold-start),var(--gold-end)); }

.post-card{ border-radius:18px; padding:20px; margin-bottom:18px; background:linear-gradient(180deg,#130e09,#0f0b08); transition:border-color .25s; }
.post-card:hover{ border-color:#3a2d1f; }
.post-header .avatar-sm{ width:42px; height:42px; font-size:15px; }
.post-author{ font-size:14.5px; }
.post-caption{ font-size:15px; line-height:1.65; }
.post-media img, .post-media video{ border-radius:14px; }
.post-actions{ gap:24px; padding-top:12px; }
.post-action-btn{ font-size:13px; }

.side-col{ position:sticky; top:96px; display:flex; flex-direction:column; gap:18px; }
.side-box{ border:1px solid var(--border); border-radius:18px; padding:20px; background:linear-gradient(180deg,#130e09,#0f0b08); }
.side-box[hidden]{ display:none; }
.side-box h3{ font-family:var(--font-display); font-weight:700; font-size:18px; margin-bottom:14px; }
.side-box .trending-tags-row{ margin:0; }
.side-link{ display:flex; flex-direction:column; gap:2px; padding:11px 0; border-top:1px solid var(--border-soft); transition:padding .25s; }
.side-link:first-of-type{ border-top:none; padding-top:0; }
.side-link span:first-child{ font-weight:700; font-size:14.5px; }
.side-link span:last-child{ font-size:12.5px; color:var(--muted); }
.side-link:hover{ padding-left:8px; }
.side-link:hover span:first-child{ color:var(--gold); }
.suggest-row{ display:flex; align-items:center; gap:12px; padding:10px 0; border-top:1px solid var(--border-soft); }
.suggest-row:first-child{ border-top:none; padding-top:0; }
.suggest-row .avatar-sm{ width:38px; height:38px; flex-shrink:0; }
.suggest-info{ flex:1; min-width:0; display:flex; flex-direction:column; }
.suggest-name{ font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.suggest-user{ font-size:12px; color:var(--muted); }

@media (max-width:980px){
  .layout{ grid-template-columns:minmax(0,1fr); }
  .side-col{ display:none; }
  .top-nav{ display:none; }
}

/* badges in every place a name shows */
.verified-badge{ display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px; border-radius:50%; background:linear-gradient(135deg,#f6d27a,#b9832f); color:#000; font-size:10px; font-weight:900; flex-shrink:0; }
.role-badge{ font-size:10px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:#000; background:linear-gradient(135deg,#f6d27a,#b9832f); padding:3px 9px; border-radius:999px; white-space:nowrap; }
.comment-item .verified-badge{ margin-left:4px; vertical-align:middle; width:14px; height:14px; font-size:9px; }
.comment-item .role-badge{ margin:0 6px 0 5px; font-size:9px; padding:2px 7px; vertical-align:middle; }
.story-name .verified-badge{ width:11px; height:11px; font-size:7px; margin-left:3px; vertical-align:middle; }
.suggest-name-row{ display:flex; align-items:center; gap:6px; min-width:0; }
.conv-name-wrap{ display:flex; align-items:center; gap:6px; min-width:0; }
#storyViewerName{ display:inline-flex; align-items:center; gap:6px; }
</style>
</head>

  <a class="brand" href="index.html" aria-label="RelviaCreators home">

function escapeHtml(str){
  return (str || "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

// ---------- photo upload (shrinks the photo, then stores it) ----------
const MEDIA_BUCKET = "creators-media";
function resizeImage(file, maxEdge, quality, square){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      let sx = 0, sy = 0, sw = img.width, sh = img.height, w, h;
      if (square){
        const side = Math.min(img.width, img.height);
        sx = (img.width - side) / 2; sy = (img.height - side) / 2; sw = side; sh = side;
        w = h = Math.min(maxEdge, side);
      } else {
        const scale = Math.min(1, maxEdge / Math.max(img.width, img.height));
        w = Math.round(img.width * scale); h = Math.round(img.height * scale);
      }
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#0f0b08"; ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
      URL.revokeObjectURL(url);
      canvas.toBlob(b => b ? resolve(b) : reject(new Error("Couldn't process that photo.")), "image/jpeg", quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("That file isn't a photo we can read. Try a JPG or PNG.")); };
    img.src = url;
  });
}
async function uploadImage(file, opts){
  opts = opts || {};
  if (!file || !file.type.startsWith("image/")) throw new Error("Choose a photo.");
  if (file.size > 15 * 1024 * 1024) throw new Error("That photo is over 15 MB. Try a smaller one.");
  const blob = await resizeImage(file, opts.maxEdge || 1600, 0.86, !!opts.square);
  const { data: auth } = await supabaseClient.auth.getUser();
  if (!auth || !auth.user) throw new Error("Sign in to upload.");
  const path = `${auth.user.id}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
  const { error } = await supabaseClient.storage.from(MEDIA_BUCKET).upload(path, blob, { contentType: "image/jpeg", cacheControl: "31536000" });
  if (error) throw new Error(error.message || "Upload failed.");
  return supabaseClient.storage.from(MEDIA_BUCKET).getPublicUrl(path).data.publicUrl;
}

}

function timeAgo(dateStr){
  const seconds = Math.floor((Date.now() - new Date(dateStr).getTime()) / 1000);
  if (seconds < 60) return "just now";
  if (seconds < 3600) return `${Math.floor(seconds/60)}m`;
  if (seconds < 86400) return `${Math.floor(seconds/3600)}h`;
  return `${Math.floor(seconds/86400)}d`;
}

async function publishPost(){
  const input = document.getElementById("composerInput");
  const caption = input.value.trim();
  const pollQuestion = document.getElementById("pollQuestion").value.trim();
  const pollOptionInputs = [...document.querySelectorAll("#pollOptionsList input")].map(i => i.value.trim()).filter(Boolean);
  const hasPoll = document.getElementById("composerPollBlock").style.display !== "none" && pollQuestion && pollOptionInputs.length >= 2;

  if (!caption && !composerImageUrl && !hasPoll) return;

  const { data: newPost, error } = await supabaseClient
    .from("social_posts").insert({ user_id: currentUser.id, caption }).select().single();

  if (error){ console.error(error); showToast("Couldn't publish: " + (error.message || "unknown error")); return; }

  if (composerImageUrl && newPost){
    await supabaseClient.from("social_post_media").insert({ post_id: newPost.id, media_type: "image", storage_path: composerImageUrl, position: 0 });
  }

  if (hasPoll && newPost){
    const { data: newPoll } = await supabaseClient.from("social_polls").insert({ post_id: newPost.id, question: pollQuestion }).select().single();
    if (newPoll){
      const optionRows = pollOptionInputs.map((text, i) => ({ poll_id: newPoll.id, option_text: text, position: i }));
      await supabaseClient.from("social_poll_options").insert(optionRows);
    }
  }

  input.value = "";
  composerImageUrl = null;
  document.getElementById("composerPreview").classList.remove("show");
  document.getElementById("composerPollBlock").style.display = "none";
  document.getElementById("pollOptionsList").innerHTML = "";
  document.getElementById("pollQuestion").value = "";
  document.getElementById("composerPostBtn").disabled = true;
  showToast("Posted to RelviaCreators");
  await loadFeed();
}

async function loadFeed(){
  const container = document.getElementById("feedContainer");

  let posts, error;

  if (activeFeedMode === "discover"){
    const { data: trending } = await supabaseClient.rpc("get_trending_creator_posts", { days_back: 7, post_limit: 20 });
    const trendingIds = (trending || []).map(t => t.post_id);
    if (trendingIds.length === 0){
      container.innerHTML = `<div class="empty-state"><h4>Nothing trending yet</h4><p>Check back once there's more activity.</p></div>`;
      return;
    }
    const result = await supabaseClient.from("social_posts").select("*").in("id", trendingIds);
    // Preserve the trending order, since .in() doesn't guarantee it.
    posts = trendingIds.map(id => result.data?.find(p => p.id === id)).filter(Boolean);
    error = result.error;
  } else {
    let query = supabaseClient.from("social_posts").select("*").order("created_at", { ascending:false }).limit(40);
    if (activeHashtagFilter) query = query.ilike("caption", `%#${activeHashtagFilter}%`);
    const result = await query;
    posts = result.data;
    error = result.error;
  }

  if (error){ console.error(error); container.innerHTML = `<div class="empty-state"><h4>Couldn't load the feed</h4><p>${escapeHtml(error.message || "")}</p></div>`; return; }
  if (!posts || posts.length === 0){
    container.innerHTML = `<div class="empty-state"><h4>No posts yet</h4><p>${activeHashtagFilter ? `Nothing tagged #${activeHashtagFilter}.` : "Be the first to share something across the ecosystem."}</p></div>`;
    return;
  }

  const authorIds = [...new Set(posts.map(p => p.user_id))];
  const { data: authors } = await supabaseClient.from("profiles").select("id, display_name, username, avatar_url, creator_plus").in("id", authorIds);
  const authorById = {};
  (authors || []).forEach(a => { authorById[a.id] = a; });

  // Founder and staff badges.
  const badgeByUser = {};
  try {
    const { data: badgeRows } = await supabaseClient.rpc("get_user_badges", { p_ids: authorIds });
    (badgeRows || []).forEach(b => { badgeByUser[b.user_id] = b.label; });
  } catch (e) {}

  const postIds = posts.map(p => p.id);
  const { data: reactions } = await supabaseClient.from("post_likes").select("post_id, user_id, reaction_type").in("post_id", postIds);
  const reactionsByPost = {};
  const myReactionByPost = {};
  (reactions || []).forEach(r => {
    if (!reactionsByPost[r.post_id]) reactionsByPost[r.post_id] = {};
    reactionsByPost[r.post_id][r.reaction_type] = (reactionsByPost[r.post_id][r.reaction_type] || 0) + 1;
    if (r.user_id === currentUser.id) myReactionByPost[r.post_id] = r.reaction_type;
  });

  const { data: allComments } = await supabaseClient.from("social_comments").select("post_id").in("post_id", postIds);
  const commentCountByPost = {};
  (allComments || []).forEach(c => { commentCountByPost[c.post_id] = (commentCountByPost[c.post_id] || 0) + 1; });

  const { data: polls } = await supabaseClient.from("social_polls").select("*, social_poll_options(*)").in("post_id", postIds);
  const pollByPost = {};
  (polls || []).forEach(p => { pollByPost[p.post_id] = p; });
  const { data: myVotes } = await supabaseClient.from("social_poll_votes").select("poll_id, option_id").eq("user_id", currentUser.id);
  const myVoteByPoll = {};
  (myVotes || []).forEach(v => { myVoteByPoll[v.poll_id] = v.option_id; });
  const { data: allVotes } = await supabaseClient
    .from("social_poll_votes").select("poll_id, option_id")
    .in("poll_id", (polls || []).map(p => p.id));
  pollVoteCounts = {};
  pollVoteTotals = {};
  (allVotes || []).forEach(v => {
    pollVoteCounts[v.option_id] = (pollVoteCounts[v.option_id] || 0) + 1;
    pollVoteTotals[v.poll_id] = (pollVoteTotals[v.poll_id] || 0) + 1;
  });

  container.innerHTML = "";
  for (const post of posts){
    const author = authorById[post.user_id];
    const isMe = post.user_id === currentUser.id;
    const isFollowing = followingIds.has(post.user_id);
    const totalReactions = Object.values(reactionsByPost[post.id] || {}).reduce((sum, n) => sum + n, 0);
    const myReaction = myReactionByPost[post.id];

    const card = document.createElement("div");
    card.className = "post-card";
    card.innerHTML = `
      <div class="post-header">
        <a class="avatar-sm" href="profile.html?user=${post.user_id}">${avatarInnerHTML(author?.avatar_url, author?.display_name)}</a>
        <div class="post-header-info">
          <div class="post-author-row">
            <a class="post-author" href="profile.html?user=${post.user_id}">${escapeHtml(author?.display_name || "Unknown")}</a>
            ${(author?.creator_plus || badgeByUser[post.user_id]) ? `<span class="verified-badge" title="Verified">✓</span>` : ""}${badgeByUser[post.user_id] ? `<span class="role-badge">${escapeHtml(badgeByUser[post.user_id])}</span>` : ""}
            ${post.is_sponsored ? `<span style="font-size:9.5px;font-weight:800;letter-spacing:.5px;color:var(--gold);border:1px solid var(--gold-end);padding:2px 8px;border-radius:999px;">SPONSORED</span>` : ""}
          </div>
          <div class="post-time">${timeAgo(post.created_at)}</div>
        </div>
        ${!isMe && !post.is_sponsored ? `<button class="follow-btn ${isFollowing ? "following" : ""}" data-follow-user="${post.user_id}">${isFollowing ? "Following" : "Follow"}</button>` : ""}
      </div>
      ${post.caption ? `<div class="post-caption">${linkifyHashtags(post.caption)}</div>` : ""}
      ${post.is_sponsored && post.sponsor_click_url ? `<a href="${post.sponsor_click_url}" target="_blank" style="display:inline-block;font-size:12px;font-weight:700;color:var(--gold);margin-bottom:10px;">Learn more →</a>` : ""}
      <div class="post-media" id="media-${post.id}"></div>
      ${pollByPost[post.id] ? renderPollHtml(pollByPost[post.id], myVoteByPoll[pollByPost[post.id].id]) : ""}
      <div class="post-actions">
        <div class="reaction-btn-wrap">
          <button class="post-action-btn ${myReaction ? "liked" : ""}" data-action="react-default" data-post-id="${post.id}">
            ${REACTION_ICONS[myReaction || "like"]} <span data-like-count>${totalReactions}</span>
          </button>
          <div class="reaction-picker">
            ${Object.entries(REACTION_ICONS).map(([type, icon]) => `<span class="reaction-option" data-action="react" data-reaction="${type}" data-post-id="${post.id}" title="${type}">${icon}</span>`).join("")}
          </div>
        </div>
        <button class="post-action-btn" data-action="toggle-comments" data-post-id="${post.id}">
          ✎ ${commentCountByPost[post.id] || 0}
        </button>
      </div>
      <div class="comments-block" id="comments-${post.id}">
        <div id="comments-list-${post.id}"></div>
        <div class="comment-input-row">
          <input type="text" placeholder="Add a comment..." id="comment-input-${post.id}" maxlength="280">
          <button data-action="send-comment" data-post-id="${post.id}">Post</button>
        </div>
      </div>`;
    container.appendChild(card);
    loadPostMedia(post.id);
  }

  container.querySelectorAll('[data-action="react-default"]').forEach(btn => {
    btn.addEventListener("click", () => setReaction(btn.dataset.postId, "like"));
  });
  container.querySelectorAll('[data-action="react"]').forEach(el => {
    el.addEventListener("click", () => setReaction(el.dataset.postId, el.dataset.reaction));
  });
  container.querySelectorAll('.hashtag-link').forEach(el => {
    el.addEventListener("click", () => setHashtagFilter(el.dataset.hashtag));
  });
  container.querySelectorAll('[data-action="toggle-comments"]').forEach(btn => {
    btn.addEventListener("click", () => toggleComments(btn.dataset.postId));
  });
  container.querySelectorAll('[data-action="send-comment"]').forEach(btn => {
    btn.addEventListener("click", () => sendComment(btn.dataset.postId));
  });
  container.querySelectorAll('[data-follow-user]').forEach(btn => {
    btn.addEventListener("click", () => toggleFollow(btn.dataset.followUser, btn));
  });
  container.querySelectorAll('[data-poll-option]').forEach(el => {
    el.addEventListener("click", () => votePoll(el.dataset.pollId, el.dataset.pollOption));
  });
}

function renderPollHtml(poll, myVoteOptionId){
  const options = (poll.social_poll_options || []).sort((a, b) => a.position - b.position);
  return `
    <div class="poll-display">
      <div class="poll-question">${escapeHtml(poll.question)}</div>
      <div id="poll-${poll.id}">${renderPollOptionsHtml(poll, options, myVoteOptionId)}</div>
    </div>`;
}

function renderPollOptionsHtml(poll, options, myVoteOptionId){
  const total = pollVoteTotals[poll.id] || 0;
  const rows = options.map(opt => {
    const count = pollVoteCounts[opt.id] || 0;
    const pct = total ? Math.round((count / total) * 100) : 0;
    return `
    <div class="poll-option-bar" data-poll-option="${opt.id}" data-poll-id="${poll.id}">
      <div class="poll-option-fill" style="width:${pct}%;"></div>
      <div class="poll-option-content">
        <span>${escapeHtml(opt.option_text)}${myVoteOptionId === opt.id ? ' <span style="color:var(--gold);">✓</span>' : ""}</span>
        <span style="color:var(--muted);font-size:12px;">${pct}%</span>
      </div>
    </div>`;
  }).join("");
  return rows + `<div class="poll-total-votes">${total} vote${total === 1 ? "" : "s"}</div>`;
}

async function votePoll(pollId, optionId){
  const { error } = await supabaseClient.from("social_poll_votes").upsert(
    { poll_id: pollId, option_id: optionId, user_id: currentUser.id },
    { onConflict: "poll_id,user_id" }
  );
  if (error){ showToast("Couldn't vote"); return; }
  await loadFeed();
}

function setHashtagFilter(tag){
  activeHashtagFilter = tag;
  activeFeedMode = "following";
  document.querySelectorAll(".feed-tab").forEach(t => t.classList.toggle("active", t.dataset.feed === "following"));
  document.querySelectorAll(".trending-tag-chip").forEach(c => c.classList.toggle("active", c.dataset.tag === tag));
  loadFeed();
}

async function setReaction(postId, reactionType){
  const { data: existing } = await supabaseClient.from("post_likes").select("*").eq("post_id", postId).eq("user_id", currentUser.id).maybeSingle();

  if (existing && existing.reaction_type === reactionType){
    await supabaseClient.from("post_likes").delete().eq("post_id", postId).eq("user_id", currentUser.id);
  } else if (existing){
    await supabaseClient.from("post_likes").update({ reaction_type: reactionType }).eq("post_id", postId).eq("user_id", currentUser.id);
  } else {
    await supabaseClient.from("post_likes").insert({ post_id: postId, user_id: currentUser.id, reaction_type: reactionType });
  }
  await loadFeed();
}

async function loadPostMedia(postId){
  const { data: media } = await supabaseClient.from("social_post_media").select("*").eq("post_id", postId).order("position");
  const container = document.getElementById(`media-${postId}`);
  if (!container || !media || media.length === 0) return;

  media.forEach(m => {
    let url = m.storage_path;
    if (url && !url.startsWith("http")){
      const { data: urlData } = supabaseClient.storage.from("post-media").getPublicUrl(url);
      url = urlData.publicUrl;
    }
    if (m.media_type === "video"){
      container.innerHTML += `<video controls playsinline preload="metadata"><source src="${url}"></video>`;
    } else {
      container.innerHTML += `<img src="${url}" loading="lazy">`;
    }
  });
}

async function toggleFollow(userId, btn){
  if (followingIds.has(userId)){
    await supabaseClient.from("social_follows").delete().eq("follower_id", currentUser.id).eq("followed_id", userId);
    followingIds.delete(userId);
    btn.classList.remove("following");
    btn.textContent = "Follow";
  } else {
    await supabaseClient.from("social_follows").insert({ follower_id: currentUser.id, followed_id: userId });
    followingIds.add(userId);
    btn.classList.add("following");
    btn.textContent = "Following";
  }
}

async function toggleComments(postId){
  const block = document.getElementById(`comments-${postId}`);
  block.classList.toggle("show");
  if (block.classList.contains("show")) await loadComments(postId);
}

async function loadComments(postId){
  const { data: comments, error } = await supabaseClient
    .from("social_comments").select("*").eq("post_id", postId).order("created_at", { ascending:true });

  const list = document.getElementById(`comments-list-${postId}`);
  if (error || !comments || comments.length === 0){
    list.innerHTML = `<div style="color:var(--muted-soft);font-size:12px;">No comments yet.</div>`;
    return;
  }

  const userIds = [...new Set(comments.map(c => c.user_id))];
  const { data: profiles } = await supabaseClient.from("profiles").select("id, display_name").in("id", userIds);
  const nameById = {};
  (profiles || []).forEach(p => { nameById[p.id] = p.display_name; });
  await loadBadges(userIds);

  list.innerHTML = "";
  comments.forEach(c => {
    const el = document.createElement("div");
    el.className = "comment-item";
    el.innerHTML = `<span><span class="comment-author">${escapeHtml(nameById[c.user_id] || "Unknown")}</span>${badgesHtml(c.user_id)}${escapeHtml(c.content)}</span>`;
    list.appendChild(el);
  });
}

async function sendComment(postId){
  const input = document.getElementById(`comment-input-${postId}`);
  const content = input.value.trim();
  if (!content) return;

  const { error } = await supabaseClient.from("social_comments").insert({ post_id: postId, user_id: currentUser.id, content });
  if (error){ console.error(error); showToast("Couldn't post comment"); return; }

  input.value = "";
  await loadComments(postId);

  const countBtn = document.querySelector(`[data-action="toggle-comments"][data-post-id="${postId}"]`);
  if (countBtn){
    const currentCount = parseInt(countBtn.textContent.trim().split(" ").pop(), 10) || 0;
    countBtn.innerHTML = `✎ ${currentCount + 1}`;
  }
}

async function loadUnreadCount(){
  const { data: conversations } = await supabaseClient.rpc("get_conversations", { for_user_id: currentUser.id });
  const totalUnread = (conversations || []).reduce((sum, c) => sum + Number(c.unread_count || 0), 0);

  const badge = document.getElementById("unreadBadge");
  if (totalUnread > 0){
    badge.textContent = totalUnread > 9 ? "9+" : totalUnread;
    badge.style.display = "flex";
  }
}

initialize();
</script>
<script src="../beta-toolkit.js"></script>
</body>
</html>
