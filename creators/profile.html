<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — RelviaCreators</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#070504; --glass:#120e09; --surface-light:#161008; --surface:#1c150d;
  --border:#2a2018; --border-soft:#1c1610; --gold-start:#f6d27a; --gold-end:#b9832f; --gold:#e0b158;
  --text:#f5f1ea; --soft:#cdc5b5; --muted:#a89e8f; --muted-soft:#6b6255; --danger:#e0574f;
  --font-display:"Playfair Display",serif; --font-body:"Inter",sans-serif;
}
*{ margin:0; padding:0; box-sizing:border-box; font-family:var(--font-body); }
body{
  color:var(--text); min-height:100vh;
  background:
    radial-gradient(ellipse 900px 500px at 12% -8%, rgba(224,177,88,.10), transparent 60%),
    radial-gradient(ellipse 700px 460px at 100% 20%, rgba(185,131,47,.06), transparent 60%),
    var(--bg);
  background-attachment:fixed;
}
a{ text-decoration:none; color:inherit; }
button, input, textarea{ font-family:inherit; }
button{ cursor:pointer; border:none; background:none; color:inherit; font-size:inherit; }
img{ max-width:100%; display:block; }
:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; border-radius:6px; }

/* header, same as the feed */
.topbar{ position:sticky; top:0; height:72px; display:flex; align-items:center; justify-content:space-between; gap:20px; padding:0 clamp(16px,3vw,36px); background:rgba(7,5,4,.88); backdrop-filter:blur(18px); border-bottom:1px solid rgba(224,177,88,.28); box-shadow:0 12px 40px -24px rgba(224,177,88,.35); z-index:50; }
.brand{ display:flex; align-items:center; gap:12px; }
.crest{ width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-style:italic; font-weight:800; font-size:21px; color:var(--gold-start); border:1.5px solid var(--gold-end); background:radial-gradient(circle at 32% 24%,rgba(246,210,122,.28),transparent 68%),#000; box-shadow:0 0 20px -4px rgba(224,177,88,.45); }
.brand-text{ display:flex; flex-direction:column; line-height:1; }
.brand-name{ font-family:var(--font-display); font-weight:800; font-size:24px; letter-spacing:-.02em; background:linear-gradient(100deg,var(--gold-start),var(--gold-end) 55%,var(--gold-start)); -webkit-background-clip:text; background-clip:text; color:transparent; }
.brand-sub{ margin-top:5px; font-size:9.5px; font-weight:700; letter-spacing:.4em; color:var(--gold-end); }
.top-nav{ display:flex; gap:clamp(14px,2.2vw,28px); margin-left:auto; }
.top-nav a{ font-size:13px; font-weight:600; color:#cfc2a3; transition:color .2s; }
.top-nav a:hover{ color:var(--gold-start); }
.feed-link{ font-size:13px; font-weight:700; color:var(--gold); border:1px solid rgba(224,177,88,.35); padding:8px 16px; border-radius:999px; transition:background .2s, color .2s; }
.feed-link:hover{ background:var(--gold); color:#000; }
@media(max-width:820px){ .top-nav{ display:none; } .feed-link{ margin-left:auto; } }

.page{ max-width:760px; margin:0 auto; padding:0 clamp(14px,3vw,24px) 90px; }

/* cover + identity */
.cover{ position:relative; height:190px; margin:0 calc(-1 * clamp(14px,3vw,24px)); border-radius:0 0 22px 22px; overflow:hidden; background:radial-gradient(circle at 18% 30%,rgba(246,210,122,.4),transparent 55%),radial-gradient(circle at 82% 70%,rgba(185,131,47,.38),transparent 55%),linear-gradient(135deg,#241a0f,#0a0705); border:1px solid var(--border); border-top:none; }
.cover::after{ content:""; position:absolute; inset:0; background:linear-gradient(0deg,rgba(7,5,4,.7),transparent 60%); }
.identity{ display:flex; align-items:flex-end; gap:20px; margin-top:-56px; position:relative; z-index:2; flex-wrap:wrap; }
.avatar{ width:116px; height:116px; border-radius:50%; flex-shrink:0; overflow:hidden; border:3px solid var(--bg); outline:2px solid var(--gold-end); background:var(--surface); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:44px; color:var(--gold); box-shadow:0 14px 40px -12px rgba(0,0,0,.8); }
.avatar img{ width:100%; height:100%; object-fit:cover; }
.actions{ margin-left:auto; display:flex; gap:10px; padding-bottom:6px; flex-wrap:wrap; }
.btn{ font-size:13.5px; font-weight:700; padding:11px 22px; border-radius:999px; border:1px solid transparent; transition:transform .2s, background .2s, border-color .2s, color .2s; }
.btn:hover{ transform:translateY(-1px); }
.btn-gold{ background:linear-gradient(135deg,var(--gold-start),var(--gold-end)); color:#000; }
.btn-line{ border-color:rgba(224,177,88,.4); color:var(--text); }
.btn-line:hover{ border-color:var(--gold); color:var(--gold); }
.btn-line.on{ color:var(--muted); border-color:var(--border); }

.name-row{ margin-top:18px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.name{ font-family:var(--font-display); font-weight:800; font-size:clamp(30px,5vw,40px); letter-spacing:-.02em; line-height:1.05; }
.verified-badge{ display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:50%; background:linear-gradient(135deg,var(--gold-start),var(--gold-end)); color:#000; font-size:13px; font-weight:900; }
.role-badge{ font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:#000; background:linear-gradient(135deg,var(--gold-start),var(--gold-end)); padding:4px 12px; border-radius:999px; }
.handle{ margin-top:4px; color:var(--muted); font-size:14.5px; }
.bio{ margin-top:16px; font-size:15.5px; line-height:1.65; color:var(--soft); max-width:36em; white-space:pre-wrap; }
.joined{ margin-top:12px; font-size:13px; color:var(--muted-soft); }

.stats{ margin-top:22px; display:flex; gap:34px; padding:18px 0; border-top:1px solid var(--border-soft); border-bottom:1px solid var(--border-soft); }
.stat-num{ font-family:var(--font-display); font-weight:700; font-size:24px; color:var(--text); line-height:1; }
.stat-label{ margin-top:6px; font-size:12.5px; color:var(--muted); }

/* tabs */
.tabs{ display:flex; gap:28px; margin:26px 0 20px; border-bottom:1px solid var(--border-soft); }
.tab{ position:relative; padding:12px 2px; font-size:14px; font-weight:700; color:var(--muted); }
.tab.active{ color:var(--gold-start); }
.tab.active::after{ content:""; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:linear-gradient(90deg,var(--gold-start),var(--gold-end)); }

/* posts */
.post{ background:linear-gradient(180deg,#130e09,#0f0b08); border:1px solid var(--border); border-radius:18px; padding:20px; margin-bottom:16px; transition:border-color .25s; }
.post:hover{ border-color:#3a2d1f; }
.post-time{ font-size:12.5px; color:var(--muted-soft); margin-bottom:10px; }
.post-text{ font-size:15.5px; line-height:1.65; white-space:pre-wrap; }
.post-img{ margin-top:12px; border-radius:14px; width:100%; max-height:460px; object-fit:cover; }
.post-foot{ margin-top:14px; padding-top:12px; border-top:1px solid var(--border-soft); display:flex; gap:22px; font-size:13px; color:var(--muted); }

.media-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
.media-item{ aspect-ratio:1; border-radius:10px; overflow:hidden; background:var(--surface-light); border:1px solid var(--border-soft); }
.media-item img{ width:100%; height:100%; object-fit:cover; transition:transform .5s; }
.media-item:hover img{ transform:scale(1.06); }

.empty{ text-align:center; color:var(--muted); padding:56px 20px; font-size:14.5px; }
.empty h4{ font-family:var(--font-display); font-size:20px; color:var(--text); margin-bottom:8px; }
.loading{ text-align:center; color:var(--muted); padding:90px 0; }

/* edit modal */
.backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.78); backdrop-filter:blur(4px); display:none; align-items:center; justify-content:center; z-index:200; padding:20px; }
.backdrop.open{ display:flex; }
.modal{ width:100%; max-width:460px; background:var(--surface); border:1px solid var(--gold-end); border-radius:22px; padding:26px; max-height:92vh; overflow-y:auto; }
.modal h3{ font-family:var(--font-display); font-size:24px; margin-bottom:18px; }
.field{ margin-bottom:14px; }
.field label{ display:block; font-size:12.5px; font-weight:600; color:var(--muted); margin-bottom:6px; }
.field input, .field textarea{ width:100%; background:var(--surface-light); border:1px solid var(--border); border-radius:12px; padding:11px 14px; color:white; font-size:14.5px; }
.field textarea{ min-height:90px; resize:vertical; }
.field input:focus, .field textarea:focus{ outline:none; border-color:var(--gold); }
.field .hint{ font-size:12px; color:var(--muted-soft); margin-top:5px; }
.modal-error{ color:#f2a8a3; font-size:13px; min-height:18px; margin-bottom:6px; }
.modal-actions{ display:flex; gap:10px; margin-top:8px; }
.modal-actions button{ flex:1; padding:13px; border-radius:12px; font-weight:800; font-size:14px; }
.modal-cancel{ background:var(--surface-light); border:1px solid var(--border); }
.modal-save{ background:linear-gradient(135deg,var(--gold-start),var(--gold-end)); color:#000; }
.modal-save:disabled{ opacity:.5; cursor:default; }

.toast{ position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--surface); border:1px solid var(--gold); color:white; padding:12px 20px; border-radius:14px; font-size:13.5px; font-weight:600; opacity:0; pointer-events:none; transition:.25s; z-index:300; }
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

@media(max-width:560px){ .identity{ margin-top:-48px; } .avatar{ width:96px; height:96px; font-size:36px; } .actions{ margin-left:0; width:100%; } .stats{ gap:24px; } }
@media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>

<header class="topbar">
  <a class="brand" href="index.html" aria-label="RelviaCreators feed">
    <span class="crest" aria-hidden="true">R</span>
    <span class="brand-text"><span class="brand-name">Relvia</span><span class="brand-sub">CREATORS</span></span>

  <nav class="top-nav" aria-label="Relvia divisions">

<main class="page" id="page">
  <div class="loading">Loading profile...</div>

<div class="backdrop" id="editBackdrop">
  <div class="modal" role="dialog" aria-labelledby="editTitle">
    <h3 id="editTitle">Edit profile</h3>
    <div class="field"><label for="fName">Display name</label><input id="fName" maxlength="40"></div>

    <div class="field"><label for="fBio">Bio</label><textarea id="fBio" maxlength="200"></textarea></div>
    <div class="field"><label for="fAvatar">Profile picture link</label><input id="fAvatar" placeholder="https://..."><div class="hint">Paste a link to an image. Leave blank for your initial.</div></div>

    <div class="modal-actions">

      <button class="modal-save" id="editSave" type="button">Save</button>
    </div>

<script>
const SUPABASE_URL = "https://nqcbhpqzzwjgkusfbexo.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5xY2JocHF6endqZ2t1c2ZiZXhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzNjY1NjEsImV4cCI6MjA5ODk0MjU2MX0.BphyIGT-X9ctYVvfYXw_ldo5XGguNv5j-zDiGBPrCVU";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const params = new URLSearchParams(window.location.search);
let targetUserId = params.get("user");
let currentUser = null;
let profile = null;
let isFollowing = false;
let followerCount = 0;
let posts = [];
let mediaItems = [];
let activeTab = "posts";

const escapeHtml = s => (s || "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const initial = n => escapeHtml((n || "?").trim().charAt(0).toUpperCase());
function showToast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2600); }
function timeAgo(d){
  const s = Math.floor((Date.now() - new Date(d).getTime()) / 1000);
  if (s < 60) return "just now";
  if (s < 3600) return `${Math.floor(s / 60)}m ago`;
  if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
  if (s < 2592000) return `${Math.floor(s / 86400)}d ago`;
  return new Date(d).toLocaleDateString(undefined, { month:"short", day:"numeric", year:"numeric" });
}
function mediaUrl(path){
  if (!path) return "";
  if (path.startsWith("http")) return path;
  return supabaseClient.storage.from("post-media").getPublicUrl(path).data.publicUrl;
}

async function initialize(){
  const { data: sessionData } = await supabaseClient.auth.getSession();
  if (sessionData?.session){
    const { data: userData } = await supabaseClient.auth.getUser();
    currentUser = userData?.user || null;
  }
  // No ?user= means "my own profile".
  if (!targetUserId && currentUser) targetUserId = currentUser.id;
  if (!targetUserId){ window.location.href = "/login.html"; return; }

  const { data: row } = await supabaseClient.from("profiles").select("*").eq("id", targetUserId).maybeSingle();
  profile = row;
  if (!profile){
    document.getElementById("page").innerHTML = `<div class="empty"><h4>This profile doesn't exist</h4><p>The account may have been removed, or the link is wrong.</p><p style="margin-top:18px;"><a class="btn btn-gold" href="index.html" style="display:inline-block;">Back to the feed</a></p></div>`;
    return;
  }
  document.title = `${profile.display_name || "Profile"} — RelviaCreators`;

  let roleLabel = null;
  try {
    const { data: badges } = await supabaseClient.rpc("get_user_badges", { p_ids: [targetUserId] });
    roleLabel = badges && badges[0] ? badges[0].label : null;
  } catch (e) {}

  const [followers, following, postCount] = await Promise.all([
    supabaseClient.from("social_follows").select("*", { count:"exact", head:true }).eq("followed_id", targetUserId),
    supabaseClient.from("social_follows").select("*", { count:"exact", head:true }).eq("follower_id", targetUserId),
    supabaseClient.from("social_posts").select("*", { count:"exact", head:true }).eq("user_id", targetUserId),
  ]);
  followerCount = followers.count || 0;

  const isOwn = !!currentUser && currentUser.id === targetUserId;
  if (currentUser && !isOwn){
    const { data: f } = await supabaseClient.from("social_follows").select("*").eq("follower_id", currentUser.id).eq("followed_id", targetUserId).maybeSingle();
    isFollowing = !!f;
  }

  const joined = profile.created_at ? new Date(profile.created_at).toLocaleDateString(undefined, { month:"long", year:"numeric" }) : "";
  const verified = profile.creator_plus || roleLabel;

  document.getElementById("page").innerHTML = `
    <div class="cover" aria-hidden="true"></div>
    <div class="identity">
      <div class="avatar">${profile.avatar_url ? `<img src="${escapeHtml(profile.avatar_url)}" alt="">` : initial(profile.display_name)}</div>
      <div class="actions" id="actions">${actionsHtml(isOwn)}</div>
    </div>

    <div class="name-row">
      <h1 class="name">${escapeHtml(profile.display_name || "Unnamed")}</h1>
      ${verified ? `<span class="verified-badge" title="Verified">✓</span>` : ""}
      ${roleLabel ? `<span class="role-badge">${escapeHtml(roleLabel)}</span>` : ""}
    </div>
    ${profile.username ? `<div class="handle">@${escapeHtml(profile.username)}</div>` : ""}
    ${profile.bio ? `<p class="bio">${escapeHtml(profile.bio)}</p>` : (isOwn ? `<p class="bio" style="color:var(--muted-soft);">Add a bio so people know what you make.</p>` : "")}
    ${joined ? `<div class="joined">Joined ${joined}</div>` : ""}

    <div class="stats">
      <div><div class="stat-num">${postCount.count || 0}</div><div class="stat-label">Posts</div></div>
      <div><div class="stat-num" id="followerNum">${followerCount}</div><div class="stat-label">Followers</div></div>
      <div><div class="stat-num">${following.count || 0}</div><div class="stat-label">Following</div></div>
    </div>

    <div class="tabs" role="tablist">
      <button class="tab active" role="tab" data-tab="posts">Posts</button>
      <button class="tab" role="tab" data-tab="media">Media</button>
    </div>
    <div id="tabBody"><div class="loading" style="padding:40px 0;">Loading posts...</div></div>
  `;

  wireActions(isOwn);
  document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
    activeTab = t.dataset.tab;
    document.querySelectorAll(".tab").forEach(x => x.classList.toggle("active", x === t));
    renderTab(isOwn);
  }));

  await loadPosts();
  renderTab(isOwn);
}

function actionsHtml(isOwn){
  if (isOwn) return `<button class="btn btn-gold" id="editBtn" type="button">Edit profile</button>`;
  if (!currentUser) return `<a class="btn btn-gold" href="/login.html">Sign in to follow</a>`;
  return `<button class="btn btn-line ${isFollowing ? "on" : ""}" id="followBtn" type="button">${isFollowing ? "Following" : "Follow"}</button>
          <a class="btn btn-gold" href="messages.html?user=${targetUserId}">Message</a>`;
}

function wireActions(isOwn){
  const edit = document.getElementById("editBtn");
  if (edit) edit.addEventListener("click", openEditor);
  const follow = document.getElementById("followBtn");
  if (follow) follow.addEventListener("click", async () => {
    follow.disabled = true;
    if (isFollowing){
      await supabaseClient.from("social_follows").delete().eq("follower_id", currentUser.id).eq("followed_id", targetUserId);
      isFollowing = false; followerCount = Math.max(0, followerCount - 1);
    } else {
      const { error } = await supabaseClient.from("social_follows").insert({ follower_id: currentUser.id, followed_id: targetUserId });
      if (error){ showToast("Couldn't follow right now"); follow.disabled = false; return; }
      isFollowing = true; followerCount += 1;
    }
    follow.textContent = isFollowing ? "Following" : "Follow";
    follow.classList.toggle("on", isFollowing);
    document.getElementById("followerNum").textContent = followerCount;
    follow.disabled = false;
  });
}

async function loadPosts(){
  const { data, error } = await supabaseClient.from("social_posts").select("*")
    .eq("user_id", targetUserId).order("created_at", { ascending:false }).limit(40);
  posts = error ? [] : (data || []);

  const ids = posts.map(p => p.id);
  mediaItems = []; 
  if (ids.length){
    const [{ data: media }, { data: likes }, { data: comments }] = await Promise.all([
      supabaseClient.from("social_post_media").select("*").in("post_id", ids),
      supabaseClient.from("post_likes").select("post_id").in("post_id", ids),
      supabaseClient.from("social_comments").select("post_id").in("post_id", ids),
    ]);
    const mediaByPost = {}, likeCount = {}, commentCount = {};
    (media || []).forEach(m => { (mediaByPost[m.post_id] = mediaByPost[m.post_id] || []).push(m); });
    (likes || []).forEach(l => { likeCount[l.post_id] = (likeCount[l.post_id] || 0) + 1; });
    (comments || []).forEach(c => { commentCount[c.post_id] = (commentCount[c.post_id] || 0) + 1; });
    posts.forEach(p => {
      p._media = (mediaByPost[p.id] || []).map(m => mediaUrl(m.storage_path)).filter(Boolean);
      p._likes = likeCount[p.id] || 0;
      p._comments = commentCount[p.id] || 0;
      p._media.forEach(u => mediaItems.push(u));
    });
  }
}

function renderTab(isOwn){
  const body = document.getElementById("tabBody");
  if (activeTab === "media"){
    if (!mediaItems.length){
      body.innerHTML = `<div class="empty"><h4>No media yet</h4><p>${isOwn ? "Photos you post will show up here." : "They haven't posted any photos."}</p></div>`;
      return;
    }
    body.innerHTML = `<div class="media-grid">${mediaItems.map(u => `<a class="media-item" href="index.html"><img src="${escapeHtml(u)}" alt="" loading="lazy"></a>`).join("")}</div>`;
    return;
  }
  if (!posts.length){
    body.innerHTML = `<div class="empty"><h4>${isOwn ? "You haven't posted yet" : "No posts yet"}</h4><p>${isOwn ? "Share what you're working on from the feed." : "Check back later."}</p>${isOwn ? `<p style="margin-top:16px;"><a class="btn btn-gold" href="index.html" style="display:inline-block;">Go to the feed</a></p>` : ""}</div>`;
    return;
  }
  body.innerHTML = posts.map(p => `
    <article class="post">
      <div class="post-time">${timeAgo(p.created_at)}</div>
      ${p.caption ? `<div class="post-text">${escapeHtml(p.caption)}</div>` : ""}
      ${p._media.map(u => `<img class="post-img" src="${escapeHtml(u)}" alt="" loading="lazy">`).join("")}
      <div class="post-foot"><span>♥ ${p._likes}</span><span>Comments ${p._comments}</span></div>
    </article>`).join("");
}

/* ---------- edit profile ---------- */
function openEditor(){
  document.getElementById("fName").value = profile.display_name || "";
  document.getElementById("fUser").value = profile.username || "";
  document.getElementById("fBio").value = profile.bio || "";
  document.getElementById("fAvatar").value = profile.avatar_url || "";
  document.getElementById("editError").textContent = "";
  document.getElementById("editBackdrop").classList.add("open");
  document.getElementById("fName").focus();
}
function closeEditor(){ document.getElementById("editBackdrop").classList.remove("open"); }
document.getElementById("editCancel").addEventListener("click", closeEditor);
document.getElementById("editBackdrop").addEventListener("click", e => { if (e.target.id === "editBackdrop") closeEditor(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeEditor(); });

document.getElementById("editSave").addEventListener("click", async () => {
  const err = document.getElementById("editError");
  const btn = document.getElementById("editSave");
  const display_name = document.getElementById("fName").value.trim();
  const username = document.getElementById("fUser").value.trim().toLowerCase();
  const bio = document.getElementById("fBio").value.trim();
  const avatar = document.getElementById("fAvatar").value.trim();

  if (!display_name){ err.textContent = "Add a display name."; return; }
  if (username && !/^[a-z0-9_]{3,24}$/.test(username)){ err.textContent = "Usernames are 3 to 24 letters, numbers, or underscores."; return; }
  if (avatar && !/^https:\/\//i.test(avatar)){ err.textContent = "The picture link has to start with https://"; return; }

  btn.disabled = true;
  const { error } = await supabaseClient.from("profiles")
    .update({ display_name, username: username || null, bio: bio || null, avatar_url: avatar || null })
    .eq("id", currentUser.id);
  btn.disabled = false;

  if (error){
    err.textContent = error.code === "23505" ? "That username is taken. Try another." : "Couldn't save: " + (error.message || "unknown error");
    return;
  }
  closeEditor();
  showToast("Profile saved");
  setTimeout(() => window.location.reload(), 500);
});

initialize();
</script>
<script src="../beta-toolkit.js"></script>
