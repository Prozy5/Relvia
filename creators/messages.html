<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages — RelviaCreators</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --background:#0a0806; --glass:#120e09; --surface-light:#161008; --surface:#1c150d;
  --border:#2a2018; --border-soft:#1c1610; --gold-start:#f2c766; --gold-end:#b9832f; --gold:#e0b158;
  --text:#f5f1ea; --muted:#a89e8f; --muted-soft:#6b6255;
  --font-display:"Playfair Display",serif; --font-body:"Inter",sans-serif;
}
*{ margin:0; padding:0; box-sizing:border-box; font-family:var(--font-body); }
body{ color:var(--text); min-height:100vh; background:var(--background); }
a{ text-decoration:none; color:inherit; }
button, input{ font-family:inherit; }
button{ cursor:pointer; border:none; background:none; color:inherit; font-size:inherit; }
img{ max-width:100%; display:block; }

.topbar{
  position:sticky; top:0; height:68px; display:flex; align-items:center; justify-content:space-between;
  padding:0 26px; background:rgba(5,5,5,.9); backdrop-filter:blur(18px); border-bottom:1px solid var(--border-soft); z-index:50;
}
.brand{ display:flex; align-items:center; gap:12px; }
.brand-badge{ width:32px; height:32px; border-radius:50%; background:#000; border:1.5px solid var(--gold-end); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-style:italic; font-weight:700; font-size:16px; color:var(--gold-start); }
.brand-name{ font-family:var(--font-display); font-weight:700; font-size:16px; }
.back-link{ font-size:13px; font-weight:700; color:var(--muted); }
.back-link:hover{ color:var(--gold); }

.layout{ max-width:900px; margin:auto; height:calc(100vh - 68px); display:grid; grid-template-columns:300px 1fr; }
@media(max-width:760px){ .layout{ grid-template-columns:1fr; } .inbox-panel.hide-mobile{ display:none; } .thread-panel.hide-mobile{ display:none; } }

.inbox-panel{ border-right:1px solid var(--border-soft); overflow-y:auto; }
.inbox-header{ padding:18px 20px; font-family:var(--font-display); font-size:17px; font-weight:600; border-bottom:1px solid var(--border-soft); }
.conversation-item{ display:flex; align-items:center; gap:12px; padding:14px 18px; cursor:pointer; border-bottom:1px solid var(--border-soft); }
.conversation-item:hover{ background:var(--surface-light); }
.conversation-item.active{ background:var(--surface-light); border-left:2px solid var(--gold); }
.avatar-md{ width:42px; height:42px; border-radius:50%; overflow:hidden; background:#1a1a1a; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700; flex-shrink:0; }
.conv-info{ flex:1; min-width:0; }
.conv-name-row{ display:flex; justify-content:space-between; align-items:center; }
.conv-name{ font-size:13.5px; font-weight:700; }
.conv-time{ font-size:10.5px; color:var(--muted-soft); }
.conv-preview{ font-size:12px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:2px; }
.conv-unread-dot{ width:8px; height:8px; border-radius:50%; background:var(--gold); flex-shrink:0; }

.thread-panel{ display:flex; flex-direction:column; }
.thread-header{ padding:16px 20px; border-bottom:1px solid var(--border-soft); display:flex; align-items:center; gap:12px; }
.thread-back-mobile{ display:none; font-size:20px; color:var(--muted); }
@media(max-width:760px){ .thread-back-mobile{ display:block; } }
.thread-messages{ flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:10px; }
.message-bubble{ max-width:70%; padding:10px 14px; border-radius:16px; font-size:13.5px; line-height:1.5; }
.message-bubble.mine{ align-self:flex-end; background:linear-gradient(135deg,var(--gold-start),var(--gold-end)); color:#000; border-bottom-right-radius:4px; }
.message-bubble.theirs{ align-self:flex-start; background:var(--surface-light); border:1px solid var(--border); border-bottom-left-radius:4px; }
.message-time{ font-size:9.5px; color:var(--muted-soft); margin-top:4px; }
.message-bubble.mine .message-time{ color:rgba(0,0,0,.5); }

.thread-input-row{ display:flex; gap:10px; padding:16px 20px; border-top:1px solid var(--border-soft); }
.thread-input-row input{ flex:1; background:var(--surface-light); border:1px solid var(--border); border-radius:12px; padding:11px 16px; color:white; font-size:13.5px; }
.thread-input-row button{ background:linear-gradient(135deg,var(--gold-start),var(--gold-end)); color:#000; font-weight:800; font-size:12.5px; padding:0 20px; border-radius:12px; }

.empty-state{ text-align:center; color:var(--muted); padding:60px 20px; }
.empty-state h4{ color:#ddd; font-size:16px; margin-bottom:6px; font-family:var(--font-display); }
.loading-state{ text-align:center; color:var(--muted); padding:40px 0; font-size:13px; }
</style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="index.html">
    <div class="brand-badge">R</div>
    <span class="brand-name">RelviaCreators</span>
  </a>
  <a class="back-link" href="index.html">← Back to feed</a>
</header>

<div class="layout">
  <div class="inbox-panel" id="inboxPanel">
    <div class="inbox-header">Messages</div>
    <div id="conversationList"><div class="loading-state">Loading...</div></div>
  </div>

  <div class="thread-panel" id="threadPanel">
    <div class="empty-state" id="noThreadSelected">
      <h4>Select a conversation</h4>
      <p>Pick someone from the list to see your messages.</p>
    </div>
  </div>
</div>

<script>

const SUPABASE_URL = "https://nqcbhpqzzwjgkusfbexo.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5xY2JocHF6endqZ2t1c2ZiZXhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzNjY1NjEsImV4cCI6MjA5ODk0MjU2MX0.BphyIGT-X9ctYVvfYXw_ldo5XGguNv5j-zDiGBPrCVU";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let activeOtherUserId = null;
const params = new URLSearchParams(window.location.search);

function escapeHtml(str){
  return (str || "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function avatarInnerHTML(url, name){
  return url ? `<img src="${url}" style="width:100%;height:100%;object-fit:cover;">` : escapeHtml((name || "R").charAt(0).toUpperCase());
}
function timeAgo(dateStr){
  const seconds = Math.floor((Date.now() - new Date(dateStr).getTime()) / 1000);
  if (seconds < 60) return "now";
  if (seconds < 3600) return `${Math.floor(seconds/60)}m`;
  if (seconds < 86400) return `${Math.floor(seconds/3600)}h`;
  return `${Math.floor(seconds/86400)}d`;
}

async function initialize(){
  const { data: sessionData } = await supabaseClient.auth.getSession();
  if (!sessionData?.session){ window.location.href = "/login.html"; return; }
  const { data: userData } = await supabaseClient.auth.getUser();
  if (!userData.user){ window.location.href = "/login.html"; return; }
  currentUser = userData.user;

  await loadConversations();

  const startUserId = params.get("user");
  if (startUserId) await openThread(startUserId);

  subscribeToIncomingMessages();
}

async function loadConversations(){
  const { data: conversations, error } = await supabaseClient.rpc("get_conversations", { for_user_id: currentUser.id });
  const list = document.getElementById("conversationList");

  if (error || !conversations || conversations.length === 0){
    list.innerHTML = `<div class="empty-state"><h4>No messages yet</h4><p>Message someone from their profile to start a conversation.</p></div>`;
    return;
  }

  list.innerHTML = "";
  conversations.forEach(c => {
    const item = document.createElement("div");
    item.className = "conversation-item";
    item.dataset.userId = c.other_user_id;
    item.innerHTML = `
      <div class="avatar-md">${avatarInnerHTML(c.other_avatar_url, c.other_display_name)}</div>
      <div class="conv-info">
        <div class="conv-name-row">
          <span class="conv-name">${escapeHtml(c.other_display_name || c.other_username || "Unknown")}</span>
          <span class="conv-time">${timeAgo(c.last_message_at)}</span>
        </div>
        <div class="conv-preview">${escapeHtml(c.last_message || "")}</div>
      </div>
      ${Number(c.unread_count) > 0 ? `<div class="conv-unread-dot"></div>` : ""}`;
    item.addEventListener("click", () => openThread(c.other_user_id));
    list.appendChild(item);
  });
}

async function openThread(otherUserId){
  activeOtherUserId = otherUserId;

  document.querySelectorAll(".conversation-item").forEach(item => {
    item.classList.toggle("active", item.dataset.userId === otherUserId);
  });

  const { data: otherProfile } = await supabaseClient.from("profiles").select("*").eq("id", otherUserId).maybeSingle();

  const panel = document.getElementById("threadPanel");
  panel.innerHTML = `
    <div class="thread-header">
      <button class="thread-back-mobile" id="threadBackBtn">←</button>
      <div class="avatar-md">${avatarInnerHTML(otherProfile?.avatar_url, otherProfile?.display_name)}</div>
      <span style="font-size:14px;font-weight:700;">${escapeHtml(otherProfile?.display_name || "Unknown")}</span>
    </div>
    <div class="thread-messages" id="threadMessages"><div class="loading-state">Loading...</div></div>
    <div class="thread-input-row">
      <input type="text" id="messageInput" placeholder="Type a message..." maxlength="1000">
      <button id="sendMessageBtn">Send</button>
    </div>`;

  document.getElementById("threadBackBtn").addEventListener("click", () => {
    document.getElementById("inboxPanel").classList.remove("hide-mobile");
    document.getElementById("threadPanel").classList.add("hide-mobile");
  });
  document.getElementById("inboxPanel").classList.add("hide-mobile");
  document.getElementById("threadPanel").classList.remove("hide-mobile");

  document.getElementById("sendMessageBtn").addEventListener("click", sendMessage);
  document.getElementById("messageInput").addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });

  await loadMessages();
  await markThreadRead();
}

async function loadMessages(){
  const container = document.getElementById("threadMessages");

  const { data: messages, error } = await supabaseClient
    .from("direct_messages")
    .select("*")
    .or(`and(sender_id.eq.${currentUser.id},recipient_id.eq.${activeOtherUserId}),and(sender_id.eq.${activeOtherUserId},recipient_id.eq.${currentUser.id})`)
    .order("created_at", { ascending:true });

  if (error || !messages || messages.length === 0){
    container.innerHTML = `<div class="empty-state"><h4>Say hello</h4><p>No messages yet in this conversation.</p></div>`;
    return;
  }

  container.innerHTML = "";
  messages.forEach(m => appendMessageBubble(m));
  container.scrollTop = container.scrollHeight;
}

function appendMessageBubble(m){
  const container = document.getElementById("threadMessages");
  if (!container) return;
  const empty = container.querySelector(".empty-state");
  if (empty) empty.remove();

  const isMine = m.sender_id === currentUser.id;
  const bubble = document.createElement("div");
  bubble.className = `message-bubble ${isMine ? "mine" : "theirs"}`;
  bubble.innerHTML = `${escapeHtml(m.content)}<div class="message-time">${timeAgo(m.created_at)}</div>`;
  container.appendChild(bubble);
  container.scrollTop = container.scrollHeight;
}

async function sendMessage(){
  const input = document.getElementById("messageInput");
  const content = input.value.trim();
  if (!content || !activeOtherUserId) return;

  const { data: newMessage, error } = await supabaseClient
    .from("direct_messages")
    .insert({ sender_id: currentUser.id, recipient_id: activeOtherUserId, content })
    .select().single();

  if (error){ console.error(error); return; }

  input.value = "";
  appendMessageBubble(newMessage);
  await loadConversations();
}

async function markThreadRead(){
  await supabaseClient
    .from("direct_messages")
    .update({ read_at: new Date().toISOString() })
    .eq("recipient_id", currentUser.id)
    .eq("sender_id", activeOtherUserId)
    .is("read_at", null);
  await loadConversations();
}

function subscribeToIncomingMessages(){
  supabaseClient
    .channel("relvia-creators-dms")
    .on("postgres_changes", { event:"INSERT", schema:"public", table:"direct_messages" }, async (payload) => {
      const m = payload.new;
      if (m.recipient_id !== currentUser.id) return;

      if (m.sender_id === activeOtherUserId){
        appendMessageBubble(m);
        await markThreadRead();
      } else {
        await loadConversations();
      }
    })
    .subscribe();
}

initialize();
</script>
</body>
</html>
