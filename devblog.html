<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="The Relvia dev blog: announcements, central talks, updates, bug reports, news and finances.">
<title>Dev Blog — Relvia Entertainment</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#070504; --panel:#110d08; --panel-2:#17110b; --border:#2a2018; --border-soft:#1d1610;
  --line:rgba(224,177,88,.26); --gold:#e0b158; --gold-hi:#f6d487; --gold-lo:#b9832f;
  --text:#f5f1ea; --muted:#a89e8f; --soft:#7d7568; --danger:#e0574f; --ok:#8fbf7a;
  --display:"Playfair Display",Georgia,serif; --body:"Inter",system-ui,sans-serif;
}
*{ margin:0; padding:0; box-sizing:border-box; }
body{
  background:radial-gradient(ellipse 900px 520px at 10% -10%, rgba(224,177,88,.10), transparent 60%), var(--bg);
  background-attachment:fixed; color:var(--text); font-family:var(--body); line-height:1.55; min-height:100vh; -webkit-font-smoothing:antialiased;
}
a{ color:inherit; text-decoration:none; }
button, input, select, textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; }
button:disabled{ opacity:.5; cursor:not-allowed; }
:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; border-radius:6px; }

.bar{ position:sticky; top:0; z-index:30; display:flex; align-items:center; justify-content:space-between; gap:18px;
  padding:14px clamp(16px,3vw,36px); background:rgba(7,5,4,.85); backdrop-filter:blur(14px); border-bottom:1px solid var(--border-soft); }
.brand{ display:flex; align-items:center; gap:10px; font-family:var(--display); font-weight:700; font-size:18px; }
.crest{ width:34px; height:34px; border-radius:50%; border:1.5px solid var(--gold-lo); display:flex; align-items:center; justify-content:center;
  font-style:italic; color:var(--gold-hi); background:radial-gradient(circle at 32% 22%, rgba(246,210,122,.28), transparent 65%), #000; }
.bar nav{ display:flex; gap:20px; flex-wrap:wrap; font-size:11.5px; font-weight:800; letter-spacing:1.2px; }
.bar nav a{ color:var(--muted); }
.bar nav a:hover{ color:var(--gold); }

.layout{ max-width:1180px; margin:0 auto; padding:36px clamp(16px,3vw,36px) 90px; display:grid; grid-template-columns:240px minmax(0,1fr); gap:28px; align-items:start; }
aside.side{ position:sticky; top:96px; border:1px solid var(--border); border-radius:20px; padding:16px; background:linear-gradient(180deg,var(--panel-2),#0d0905); }
.side h3{ font-size:10.5px; font-weight:800; letter-spacing:1.6px; text-transform:uppercase; color:var(--soft); padding:6px 10px 10px; }
.side a{ display:flex; justify-content:space-between; align-items:center; gap:8px; padding:10px 12px; border-radius:12px; font-size:14px; color:var(--muted); transition:background .2s,color .2s; }
.side a:hover{ background:rgba(224,177,88,.06); color:var(--text); }
.side a.on{ background:linear-gradient(135deg,rgba(246,212,135,.16),rgba(185,131,47,.16)); color:var(--gold-hi); }
.side .lock{ font-size:10px; font-weight:800; color:var(--soft); letter-spacing:.6px; text-transform:uppercase; }

.eyebrow{ font-size:11px; font-weight:800; letter-spacing:2.2px; color:var(--gold); text-transform:uppercase; margin-bottom:10px; }
h1{ font-family:var(--display); font-weight:700; font-size:clamp(34px,4.6vw,52px); line-height:1.08; letter-spacing:-1px; margin-bottom:8px; }
h1 em{ font-style:italic; font-weight:600; color:var(--gold); }
.lede{ color:var(--muted); font-size:15px; margin-bottom:26px; }

.toolbar{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
.btn{ background:linear-gradient(135deg,var(--gold-hi),var(--gold-lo)); color:#000; font-weight:800; font-size:13px; border:none; padding:10px 18px; border-radius:12px; box-shadow:0 10px 24px rgba(185,131,47,.18); }
.btn.ghost{ background:none; color:var(--muted); border:1px solid var(--border); box-shadow:none; font-weight:700; padding:8px 14px; font-size:12.5px; }
.btn.ghost:hover{ color:var(--gold); border-color:var(--line); }
.btn.danger{ background:none; color:var(--danger); border:1px solid rgba(224,87,79,.4); box-shadow:none; font-weight:700; padding:8px 14px; font-size:12.5px; }
.btn.danger:hover{ background:rgba(224,87,79,.08); }
.btn.sm{ padding:7px 12px; font-size:12px; }

.field{ width:100%; background:#0a0705; border:1px solid var(--border); border-radius:12px; padding:11px 14px; font-size:14px; }
.field:focus{ outline:none; border-color:var(--gold); }
textarea.field{ resize:vertical; min-height:110px; }

.card{ border:1px solid var(--border); border-radius:20px; padding:22px 24px; margin-bottom:16px; background:linear-gradient(180deg,var(--panel-2),#0d0905); }
.card.pinned{ border-color:var(--line); }
.card.hidden{ opacity:.6; border-style:dashed; }
a.thread{ display:block; transition:border-color .2s, transform .2s; }
a.thread:hover{ border-color:var(--line); transform:translateY(-2px); }
.row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:12px; color:var(--soft); margin-bottom:8px; }
.row b{ color:var(--gold); font-weight:700; }
.title{ font-family:var(--display); font-size:22px; font-weight:600; line-height:1.25; margin-bottom:6px; overflow-wrap:anywhere; }
.excerpt{ font-size:14px; color:#cfc6b7; overflow-wrap:anywhere; }
.body{ font-size:15px; color:#e4dccd; white-space:pre-wrap; overflow-wrap:anywhere; }
.count{ font-size:12px; color:var(--muted); }

.tag{ font-size:9.5px; font-weight:800; letter-spacing:1px; text-transform:uppercase; padding:3px 9px; border-radius:999px; border:1px solid var(--border); color:var(--muted); }
.tag.pin{ color:#000; background:linear-gradient(135deg,var(--gold-hi),var(--gold-lo)); border-color:transparent; }
.tag.lock{ color:var(--danger); border-color:rgba(224,87,79,.4); }
.tag.hide{ color:var(--soft); border-style:dashed; }

.mod{ border:1px solid var(--line); border-radius:18px; padding:16px; margin:18px 0; background:rgba(224,177,88,.04); }
.mod h4{ font-size:10.5px; font-weight:800; letter-spacing:1.4px; text-transform:uppercase; color:var(--gold); margin-bottom:10px; }
.mod .acts{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.mod select.field{ width:auto; padding:7px 10px; font-size:12.5px; }

.reply{ padding:16px 0; border-top:1px solid var(--border-soft); }
.reply:first-child{ border-top:none; }
.reply .foot{ display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-top:10px; }
.reply .foot button{ background:none; border:none; font-size:12px; color:var(--soft); font-weight:700; padding:4px 0; }
.reply .foot button:hover{ color:var(--gold); }

.form{ display:grid; gap:10px; margin:16px 0; }
.note{ font-size:12.5px; color:var(--soft); }
.note.err{ color:var(--danger); }
.note.ok{ color:var(--ok); }

.state{ text-align:center; color:var(--soft); padding:50px 20px; border:1px dashed var(--border); border-radius:20px; }
.state h3{ font-family:var(--display); font-size:22px; color:var(--text); font-weight:600; margin-bottom:6px; }
.back{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:800; letter-spacing:.6px; color:var(--gold); margin-bottom:18px; }
.logline{ font-size:12.5px; color:var(--soft); padding:7px 0; border-top:1px solid var(--border-soft); }
.logline:first-child{ border-top:none; }

.toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--panel-2); border:1px solid var(--gold); padding:11px 18px; border-radius:14px; font-size:13px; font-weight:600; opacity:0; pointer-events:none; transition:.25s; z-index:50; }
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

footer{ text-align:center; font-size:12px; color:var(--soft); padding:30px; border-top:1px solid var(--border-soft); }
footer a{ color:var(--gold); }

@media (max-width:860px){
  .layout{ grid-template-columns:1fr; }
  aside.side{ position:static; }
  .side nav{ display:flex; flex-wrap:wrap; gap:6px; }
  .side a{ padding:8px 12px; }
  .bar nav{ display:none; }
}
@media (prefers-reduced-motion:reduce){ *{ transition:none !important; } }
</style>
</head>
<body>

<header class="bar">
  <a class="brand" href="index.html"><span class="crest" aria-hidden="true">R</span>Relvia</a>
  <nav>
    <a href="hub.html">HUB</a>
    <a href="creators/index.html">CREATORS</a>
    <a href="studios/index.html">STUDIOS</a>
    <a href="live.html">LIVE</a>
    <a href="contact.html">CONTACT</a>
  </nav>
</header>

<div class="layout">
  <aside class="side">
    <h3>Dev blog</h3>
    <nav id="catNav"></nav>
  </aside>
  <main id="view"><div class="state"><p>Loading…</p></div></main>
</div>

<footer>&copy; <span id="year"></span> Relvia Entertainment &middot; <a href="contact.html">Contact</a></footer>
<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = "https://nqcbhpqzzwjgkusfbexo.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5xY2JocHF6endqZ2t1c2ZiZXhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzNjY1NjEsImV4cCI6MjA5ODk0MjU2MX0.BphyIGT-X9ctYVvfYXw_ldo5XGguNv5j-zDiGBPrCVU";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let me = null, role = null, staff = false, owner = false, cats = [];
const view = document.getElementById("view");

const esc = s => String(s ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const when = iso => new Date(iso).toLocaleString("en-US", { month:"short", day:"numeric", hour:"numeric", minute:"2-digit" });
const excerpt = (s, n = 180) => (s || "").length > n ? s.slice(0, n) + "…" : (s || "");
const catById = id => cats.find(c => c.id === id);
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2400);
}
function canPost(cat){
  if (!me || !cat) return false;
  if (cat.post_policy === "anyone") return true;
  if (cat.post_policy === "staff") return staff;
  if (cat.post_policy === "owner") return owner;
  return false;
}
async function names(ids){
  const u = [...new Set(ids.filter(Boolean))];
  const map = {};
  if (!u.length) return map;
  const { data } = await sb.from("profiles").select("id, display_name, username").in("id", u);
  (data || []).forEach(p => { map[p.id] = p.display_name || p.username || "Relvia member"; });
  return map;
}
async function log(action, type, id, note = ""){
  await sb.from("hub_mod_log").insert({ actor_id: me.id, action, target_type: type, target_id: String(id), note });
}

/* ---------- sidebar ---------- */
function renderNav(active){
  document.getElementById("catNav").innerHTML = cats.map(c => `
    <a href="#c/${esc(c.id)}" class="${active === c.id ? "on" : ""}">${esc(c.name)}
      ${c.visibility === "owner" ? '<span class="lock">Owner</span>' : ""}</a>`).join("");
}

/* ---------- home ---------- */
function renderHome(){
  renderNav(null);
  view.innerHTML = `
    <div class="eyebrow">Dev blog</div>
    <h1>Everything <em>Relvia.</em></h1>
    <p class="lede">Pick a category. Announcements and updates come from the team. Talk, report bugs, and follow the news here.</p>
    <div class="toolbar"><span></span>${me ? "" : '<a class="btn sm" href="login.html">Sign in to post</a>'}</div>
    ${cats.map(c => `
      <a class="card thread" href="#c/${esc(c.id)}">
        <div class="title">${esc(c.name)}</div>
        <div class="excerpt">${esc(c.description)}</div>
      </a>`).join("")}
    <div id="modPanel"></div>`;
  if (staff) loadModPanel();
}

/* ---------- category ---------- */
async function renderCategory(id){
  const cat = catById(id);
  if (!cat) return notFound();
  renderNav(id);
  view.innerHTML = `
    <a class="back" href="#">← All categories</a>
    <div class="eyebrow">${esc(cat.visibility === "owner" ? "Owner only" : "Category")}</div>
    <h1>${esc(cat.name)}</h1>
    <p class="lede">${esc(cat.description)}</p>
    <div class="toolbar">
      <span class="count" id="countLine"></span>
      ${canPost(cat) ? '<button class="btn sm" id="newBtn">New thread</button>' : ""}
    </div>
    <div id="newForm" hidden></div>
    <div id="threads"><div class="state"><p>Loading…</p></div></div>`;

  const { data: threads, error } = await sb.from("hub_threads")
    .select("id, title, body, author_id, pinned, locked, hidden, reply_count, last_activity, created_at")
    .eq("category_id", id).order("pinned", { ascending: false }).order("last_activity", { ascending: false }).limit(60);

  const box = document.getElementById("threads");
  if (error){ box.innerHTML = `<div class="state"><h3>Couldn't load threads</h3><p>${esc(error.message)}</p></div>`; return; }
  const who = await names((threads || []).map(t => t.author_id));
  document.getElementById("countLine").textContent = `${(threads || []).length} thread${(threads || []).length === 1 ? "" : "s"}`;
  if (!threads || !threads.length){
    box.innerHTML = `<div class="state"><h3>No threads yet</h3><p>Be the first to start one.</p></div>`;
  } else {
    box.innerHTML = threads.map(t => `
      <a class="card thread ${t.pinned ? "pinned" : ""} ${t.hidden ? "hidden" : ""}" href="#t/${t.id}">
        <div class="row">
          <b>${esc(who[t.author_id] || "Relvia member")}</b> · <span>${when(t.created_at)}</span>
          ${t.pinned ? '<span class="tag pin">Pinned</span>' : ""}
          ${t.locked ? '<span class="tag lock">Locked</span>' : ""}
          ${t.hidden ? '<span class="tag hide">Hidden</span>' : ""}
        </div>
        <div class="title">${esc(t.title)}</div>
        <div class="excerpt">${esc(excerpt(t.body))}</div>
        <div class="row" style="margin:12px 0 0;"><span class="count">${t.reply_count} repl${t.reply_count === 1 ? "y" : "ies"}</span></div>
      </a>`).join("");
  }

  const btn = document.getElementById("newBtn");
  if (btn){
    btn.addEventListener("click", () => {
      const f = document.getElementById("newForm");
      f.hidden = !f.hidden;
      f.innerHTML = f.hidden ? "" : `
        <form class="card form" id="threadForm">
          <input class="field" id="tTitle" placeholder="Thread title" maxlength="160" required>
          <textarea class="field" id="tBody" placeholder="What's on your mind?" maxlength="8000"></textarea>
          <div class="toolbar" style="margin:0;"><button class="btn sm" type="submit">Post thread</button><span class="note" id="tMsg"></span></div>
        </form>`;
    });
  }
}

/* ---------- thread ---------- */
async function renderThread(id){
  const { data: t } = await sb.from("hub_threads").select("*").eq("id", id).maybeSingle();
  if (!t) return notFound();
  const cat = catById(t.category_id);
  renderNav(t.category_id);
  const { data: replies } = await sb.from("hub_replies").select("*").eq("thread_id", id).order("created_at", { ascending: true });
  const who = await names([t.author_id, ...(replies || []).map(r => r.author_id)]);
  const canReply = me && (staff || !t.locked);

  view.innerHTML = `
    <a class="back" href="#c/${esc(t.category_id)}">← ${esc(cat ? cat.name : "Back")}</a>
    <div class="card ${t.hidden ? "hidden" : ""}">
      <div class="row">
        <b>${esc(who[t.author_id] || "Relvia member")}</b> · <span>${when(t.created_at)}</span>
        ${t.pinned ? '<span class="tag pin">Pinned</span>' : ""}
        ${t.locked ? '<span class="tag lock">Locked</span>' : ""}
        ${t.hidden ? '<span class="tag hide">Hidden</span>' : ""}
      </div>
      <h1 style="font-size:clamp(28px,3.6vw,40px);">${esc(t.title)}</h1>
      ${t.body ? `<div class="body" style="margin-top:14px;">${esc(t.body)}</div>` : ""}
      <div class="foot" style="margin-top:14px;">
        ${me ? `<button data-act="report" data-type="thread" data-id="${t.id}">Report</button>` : ""}
      </div>
    </div>

    ${staff ? `
    <div class="mod">
      <h4>Moderation</h4>
      <div class="acts">
        <button class="btn ghost sm" data-act="${t.locked ? "unlock" : "lock"}" data-id="${t.id}">${t.locked ? "Unlock" : "Lock"} thread</button>
        <button class="btn ghost sm" data-act="${t.pinned ? "unpin" : "pin"}" data-id="${t.id}">${t.pinned ? "Unpin" : "Pin"}</button>
        <button class="btn ghost sm" data-act="${t.hidden ? "unhide" : "hide"}" data-type="thread" data-id="${t.id}">${t.hidden ? "Unhide" : "Hide"}</button>
        <select class="field" data-act="move" data-id="${t.id}">
          ${cats.map(c => `<option value="${esc(c.id)}" ${c.id === t.category_id ? "selected" : ""}>Move to ${esc(c.name)}</option>`).join("")}
        </select>
        ${t.author_id ? `<button class="btn danger sm" data-act="ban" data-user="${t.author_id}">Ban author</button>` : ""}
        ${owner ? `<button class="btn danger sm" data-act="delete" data-type="thread" data-id="${t.id}">Delete</button>` : ""}
      </div>
    </div>` : ""}

    <h3 style="font-family:var(--display);font-size:22px;font-weight:600;margin:28px 0 6px;">${(replies || []).length} repl${(replies || []).length === 1 ? "y" : "ies"}</h3>
    <div id="replies">
      ${(replies || []).map(r => `
        <div class="reply ${r.hidden ? "hidden" : ""}" style="${r.hidden ? "opacity:.6;" : ""}">
          <div class="row"><b>${esc(who[r.author_id] || "Relvia member")}</b> · <span>${when(r.created_at)}</span>
            ${r.hidden ? '<span class="tag hide">Hidden</span>' : ""}</div>
          <div class="body">${esc(r.body)}</div>
          <div class="foot">
            ${me ? `<button data-act="report" data-type="reply" data-id="${r.id}">Report</button>` : ""}
            ${staff ? `<button data-act="${r.hidden ? "unhide" : "hide"}" data-type="reply" data-id="${r.id}">${r.hidden ? "Unhide" : "Hide"}</button>` : ""}
            ${staff && r.author_id ? `<button data-act="ban" data-user="${r.author_id}">Ban author</button>` : ""}
            ${owner ? `<button data-act="delete" data-type="reply" data-id="${r.id}">Delete</button>` : ""}
          </div>
        </div>`).join("")}
    </div>

    <div class="card" style="margin-top:20px;">
      ${!me ? '<p class="note">Sign in to reply.</p>'
        : t.locked && !staff ? '<p class="note">This thread is locked. Replies are closed.</p>'
        : `<form class="form" id="replyForm">
             <textarea class="field" id="replyBody" placeholder="Write a reply…" maxlength="4000" required></textarea>
             <div class="toolbar" style="margin:0;"><button class="btn sm" type="submit">Reply</button><span class="note" id="rMsg"></span></div>
           </form>`}
    </div>`;

  view.dataset.thread = t.id;
  view.dataset.cat = t.category_id;
}

/* ---------- moderation queue (staff) ---------- */
async function loadModPanel(){
  const panel = document.getElementById("modPanel");
  if (!panel) return;
  const { data: reports } = await sb.from("hub_reports").select("*").eq("status", "open").order("created_at", { ascending: false }).limit(25);
  const { data: logs } = await sb.from("hub_mod_log").select("action, target_type, target_id, note, created_at").order("created_at", { ascending: false }).limit(25);

  const threadIds = (reports || []).filter(r => r.target_type === "thread").map(r => r.target_id);
  const replyIds = (reports || []).filter(r => r.target_type === "reply").map(r => r.target_id);
  const [tRes, rRes] = await Promise.all([
    threadIds.length ? sb.from("hub_threads").select("id, title, body").in("id", threadIds) : { data: [] },
    replyIds.length ? sb.from("hub_replies").select("id, body, thread_id").in("id", replyIds) : { data: [] },
  ]);
  const tMap = Object.fromEntries((tRes.data || []).map(t => [t.id, t]));
  const rMap = Object.fromEntries((rRes.data || []).map(r => [r.id, r]));

  panel.innerHTML = `
    <div class="eyebrow" style="margin-top:44px;">Moderation</div>
    <h2 style="font-family:var(--display);font-size:26px;font-weight:600;margin-bottom:14px;">Report queue</h2>
    ${(reports || []).length ? (reports || []).map(r => {
      const item = r.target_type === "thread" ? tMap[r.target_id] : rMap[r.target_id];
      const text = item ? (item.title || item.body || "") : "(content removed)";
      const link = r.target_type === "thread" ? `#t/${r.target_id}` : `#t/${item ? item.thread_id : ""}`;
      return `
        <div class="card">
          <div class="row"><span class="tag">${esc(r.target_type)}</span><span>${when(r.created_at)}</span></div>
          <div class="excerpt">${esc(excerpt(text, 240))}</div>
          ${r.reason ? `<div class="note" style="margin-top:6px;">Reason: ${esc(r.reason)}</div>` : ""}
          <div class="acts toolbar" style="margin:12px 0 0;">
            <a class="btn ghost sm" href="${link}">Open</a>
            ${item ? `<button class="btn danger sm" data-act="hide-target" data-type="${r.target_type}" data-id="${r.target_id}" data-report="${r.id}">Hide content</button>` : ""}
            <button class="btn ghost sm" data-act="resolve" data-report="${r.id}">Resolve</button>
            <button class="btn ghost sm" data-act="dismiss" data-report="${r.id}">Dismiss</button>
          </div>
        </div>`;
    }).join("") : '<div class="state"><p>No open reports. Nice work.</p></div>'}

    <h2 style="font-family:var(--display);font-size:22px;font-weight:600;margin:34px 0 10px;">Activity log</h2>
    <div class="card">
      ${(logs || []).length ? (logs || []).map(l => `
        <div class="logline"><b style="color:var(--gold);">${esc(l.action)}</b> ${l.target_type ? esc(l.target_type) : ""} ${l.note ? "· " + esc(l.note) : ""} <span>· ${when(l.created_at)}</span></div>`).join("")
        : '<p class="note">Nothing logged yet.</p>'}
    </div>`;
}

function notFound(){
  view.innerHTML = `<a class="back" href="#">← All categories</a><div class="state"><h3>Not found</h3><p>That thread or category doesn't exist, or you don't have access to it.</p></div>`;
}

/* ---------- actions (event delegation) ---------- */
view.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act, type = el.dataset.type, id = el.dataset.id;
  const table = type === "reply" ? "hub_replies" : "hub_threads";
  const threadId = view.dataset.thread;

  if (act === "report"){
    const reason = prompt("Why are you reporting this? (optional)") ?? "";
    const { error } = await sb.from("hub_reports").insert({ target_type: type, target_id: id, reporter_id: me.id, reason });
    toast(error ? "You've already reported this." : "Thanks. The team will take a look.");
    return;
  }
  if (act === "lock" || act === "unlock"){
    await sb.from("hub_threads").update({ locked: act === "lock" }).eq("id", id); await log(act, "thread", id);
  }
  else if (act === "pin" || act === "unpin"){
    await sb.from("hub_threads").update({ pinned: act === "pin" }).eq("id", id); await log(act, "thread", id);
  }
  else if (act === "hide" || act === "unhide"){
    await sb.from(table).update({ hidden: act === "hide" }).eq("id", id); await log(act, type || "thread", id);
  }
  else if (act === "hide-target"){
    await sb.from(type === "reply" ? "hub_replies" : "hub_threads").update({ hidden: true }).eq("id", id);
    await sb.from("hub_reports").update({ status: "resolved" }).eq("id", el.dataset.report);
    await log("hide-from-report", type, id);
    toast("Content hidden and report resolved.");
    return loadModPanel();
  }
  else if (act === "resolve" || act === "dismiss"){
    await sb.from("hub_reports").update({ status: act === "resolve" ? "resolved" : "dismissed" }).eq("id", el.dataset.report);
    await log(act + " report", "report", el.dataset.report);
    return loadModPanel();
  }
  else if (act === "ban"){
    const reason = prompt("Reason for the ban (shown to staff only):") ?? "";
    if (reason === null) return;
    const { error } = await sb.from("hub_bans").insert({ user_id: el.dataset.user, reason, created_by: me.id });
    if (error){ toast("Couldn't ban that user."); return; }
    await log("ban", "user", el.dataset.user, reason);
    toast("User banned from posting.");
  }
  else if (act === "delete"){
    if (!confirm("Delete this permanently? This can't be undone.")) return;
    await sb.from(table).delete().eq("id", id);
    await log("delete", type || "thread", id);
    if (type !== "reply"){ location.hash = "#c/" + view.dataset.cat; return; }
  }
  route();
});

view.addEventListener("change", async e => {
  if (e.target.dataset.act !== "move") return;
  const id = e.target.dataset.id, cat = e.target.value;
  await sb.from("hub_threads").update({ category_id: cat }).eq("id", id);
  await log("move", "thread", id, "to " + cat);
  toast("Thread moved.");
  route();
});

view.addEventListener("submit", async e => {
  e.preventDefault();
  if (e.target.id === "threadForm"){
    const title = document.getElementById("tTitle").value.trim();
    const body = document.getElementById("tBody").value.trim();
    const msg = document.getElementById("tMsg");
    const cat = (location.hash.match(/^#c\/([^/]+)/) || [])[1];
    if (title.length < 3){ msg.className = "note err"; msg.textContent = "Titles need at least 3 characters."; return; }
    const { data, error } = await sb.from("hub_threads").insert({ category_id: cat, author_id: me.id, title, body }).select("id").single();
    if (error){ msg.className = "note err"; msg.textContent = "Couldn't post. You may not have permission here."; return; }
    location.hash = "#t/" + data.id;
  }
  if (e.target.id === "replyForm"){
    const body = document.getElementById("replyBody").value.trim();
    const msg = document.getElementById("rMsg");
    if (!body) return;
    const { error } = await sb.from("hub_replies").insert({ thread_id: view.dataset.thread, author_id: me.id, body });
    if (error){ msg.className = "note err"; msg.textContent = "Couldn't reply. The thread may be locked or you may be banned."; return; }
    route();
  }
});

/* ---------- routing ---------- */
async function route(){
  const h = location.hash;
  if (h.startsWith("#t/")) return renderThread(h.slice(3));
  if (h.startsWith("#c/")) return renderCategory(h.slice(3));
  return renderHome();
}

/* ---------- start ---------- */
document.getElementById("year").textContent = new Date().getFullYear();

async function start(){
  const { data: s } = await sb.auth.getSession();
  me = s && s.session ? s.session.user : null;
  if (me){
    const { data: r } = await sb.rpc("hub_my_role");
    role = r || null;
  }
  staff = ["owner", "founder", "moderator"].includes(role);
  owner = ["owner", "founder"].includes(role);

  const { data } = await sb.from("hub_categories").select("*").order("position", { ascending: true });
  cats = data || [];
  renderNav(null);

  window.addEventListener("hashchange", route);
  await route();
  // Pull in new threads and replies every minute, unless someone is typing.
  setInterval(() => {
    const typing = document.activeElement && ["TEXTAREA","INPUT","SELECT"].includes(document.activeElement.tagName);
    if (!typing) route();
  }, 60000);
}
start().catch(() => { view.innerHTML = '<div class="state"><h3>Something went wrong</h3><p>Refresh the page and try again.</p></div>'; });
</script>
</body>
</html>
