<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="The Relvia dev blog: announcements, central talks, updates, bug reports, news and finances.">
<title>Dev Blog — Relvia Entertainment</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#070504; --panel:#110d08; --panel-2:#17110b; --border:#2a2018; --border-soft:#1d1610;
  --line:rgba(224,177,88,.26); --gold:#e0b158; --gold-hi:#f6d487; --gold-lo:#b9832f;
  --text:#f5f1ea; --muted:#a89e8f; --soft:#7d7568; --danger:#e0574f; --ok:#8fbf7a;
  --display:"Playfair Display",Georgia,serif; --body:"Inter",system-ui,sans-serif;
}
*{ margin:0; padding:0; box-sizing:border-box; }
body{
  background:radial-gradient(ellipse 900px 520px at 10% -10%, rgba(224,177,88,.10), transparent 60%), var(--bg);
  background-attachment:fixed; color:var(--text); font-family:var(--body); line-height:1.55; min-height:100vh; -webkit-font-smoothing:antialiased;
}
a{ color:inherit; text-decoration:none; }
button, input, select, textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; }
button:disabled{ opacity:.5; cursor:not-allowed; }
:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; border-radius:6px; }

.bar{ position:sticky; top:0; z-index:30; display:flex; align-items:center; justify-content:space-between; gap:18px;
  padding:14px clamp(16px,3vw,36px); background:rgba(7,5,4,.85); backdrop-filter:blur(14px); border-bottom:1px solid var(--border-soft); }
.brand{ display:flex; align-items:center; gap:10px; font-family:var(--display); font-weight:700; font-size:18px; }
.crest{ width:34px; height:34px; border-radius:50%; border:1.5px solid var(--gold-lo); display:flex; align-items:center; justify-content:center;
  font-style:italic; color:var(--gold-hi); background:radial-gradient(circle at 32% 22%, rgba(246,210,122,.28), transparent 65%), #000; }
.bar-right{ display:flex; align-items:center; gap:18px; }
.bar nav{ display:flex; gap:20px; flex-wrap:wrap; font-size:11.5px; font-weight:800; letter-spacing:1.2px; }
.bar nav a{ color:var(--muted); }
.bar nav a:hover{ color:var(--gold); }

.bell{ position:relative; background:none; border:1px solid var(--border); border-radius:12px; width:40px; height:40px; font-size:16px; }
.bell:hover{ border-color:var(--line); }
.badge{ position:absolute; top:-5px; right:-5px; min-width:18px; height:18px; padding:0 5px; border-radius:999px; background:linear-gradient(135deg,var(--gold-hi),var(--gold-lo));
  color:#000; font-size:10.5px; font-weight:800; display:none; align-items:center; justify-content:center; }
.badge.show{ display:flex; }
.notif-panel{ position:absolute; right:clamp(16px,3vw,36px); top:64px; width:min(360px,calc(100vw - 32px)); max-height:420px; overflow-y:auto;
  border:1px solid var(--line); border-radius:18px; background:var(--panel-2); box-shadow:0 24px 50px rgba(0,0,0,.5); z-index:40; display:none; }
.notif-panel.open{ display:block; }
.notif-head{ display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-bottom:1px solid var(--border-soft); font-size:12px; font-weight:800; letter-spacing:1px; text-transform:uppercase; color:var(--gold); }
.notif-item{ display:block; width:100%; text-align:left; background:none; border:none; border-bottom:1px solid var(--border-soft); padding:12px 16px; font-size:13.5px; color:var(--text); }
.notif-item:hover{ background:rgba(224,177,88,.05); }
.notif-item.unread{ background:rgba(224,177,88,.06); }
.notif-item .when{ display:block; font-size:11px; color:var(--soft); margin-top:3px; }
.notif-empty{ padding:18px 16px; font-size:13px; color:var(--soft); }

.layout{ max-width:1180px; margin:0 auto; padding:36px clamp(16px,3vw,36px) 90px; display:grid; grid-template-columns:250px minmax(0,1fr); gap:28px; align-items:start; }
aside.side{ position:sticky; top:96px; border:1px solid var(--border); border-radius:20px; padding:16px; background:linear-gradient(180deg,var(--panel-2),#0d0905); }
.side h3{ font-size:10.5px; font-weight:800; letter-spacing:1.6px; text-transform:uppercase; color:var(--soft); padding:6px 10px 10px; }
.side form{ margin-bottom:12px; }
.side .field{ font-size:13px; padding:9px 12px; }
.side a{ display:flex; justify-content:space-between; align-items:center; gap:8px; padding:10px 12px; border-radius:12px; font-size:14px; color:var(--muted); transition:background .2s,color .2s; }
.side a:hover{ background:rgba(224,177,88,.06); color:var(--text); }
.side a.on{ background:linear-gradient(135deg,rgba(246,212,135,.16),rgba(185,131,47,.16)); color:var(--gold-hi); }
.side .lock{ font-size:10px; font-weight:800; color:var(--soft); letter-spacing:.6px; text-transform:uppercase; }

.eyebrow{ font-size:11px; font-weight:800; letter-spacing:2.2px; color:var(--gold); text-transform:uppercase; margin-bottom:10px; }
h1{ font-family:var(--display); font-weight:700; font-size:clamp(34px,4.6vw,52px); line-height:1.08; letter-spacing:-1px; margin-bottom:8px; }
h1 em{ font-style:italic; font-weight:600; color:var(--gold); }
.lede{ color:var(--muted); font-size:15px; margin-bottom:26px; }

.toolbar{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
.filters{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.filters label{ font-size:12.5px; color:var(--muted); display:flex; gap:6px; align-items:center; }
.filters select.field{ width:auto; padding:8px 12px; font-size:13px; }
.btn{ background:linear-gradient(135deg,var(--gold-hi),var(--gold-lo)); color:#000; font-weight:800; font-size:13px; border:none; padding:10px 18px; border-radius:12px; box-shadow:0 10px 24px rgba(185,131,47,.18); }
.btn.ghost{ background:none; color:var(--muted); border:1px solid var(--border); box-shadow:none; font-weight:700; padding:8px 14px; font-size:12.5px; }
.btn.ghost:hover{ color:var(--gold); border-color:var(--line); }
.btn.danger{ background:none; color:var(--danger); border:1px solid rgba(224,87,79,.4); box-shadow:none; font-weight:700; padding:8px 14px; font-size:12.5px; }
.btn.danger:hover{ background:rgba(224,87,79,.08); }
.btn.sm{ padding:7px 12px; font-size:12px; }

.field{ width:100%; background:#0a0705; border:1px solid var(--border); border-radius:12px; padding:11px 14px; font-size:14px; }
.field:focus{ outline:none; border-color:var(--gold); }
textarea.field{ resize:vertical; min-height:110px; }
.file-label{ font-size:12.5px; color:var(--muted); display:inline-flex; align-items:center; gap:8px; cursor:pointer; }
.file-label input{ font-size:12px; }

.card{ border:1px solid var(--border); border-radius:20px; padding:22px 24px; margin-bottom:16px; background:linear-gradient(180deg,var(--panel-2),#0d0905); position:relative; }
.card.pinned{ border-color:var(--line); }
.card.hidden{ opacity:.6; border-style:dashed; }
.card.picked{ border-color:var(--gold); box-shadow:0 0 0 2px rgba(224,177,88,.25) inset; }
a.thread{ display:block; transition:border-color .2s, transform .2s; }
a.thread:hover{ border-color:var(--line); transform:translateY(-2px); }
.row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:12px; color:var(--soft); margin-bottom:8px; }
.row b, .by-link{ color:var(--gold); font-weight:700; }
.by-link:hover{ color:var(--gold-hi); text-decoration:underline; }
.title{ font-family:var(--display); font-size:22px; font-weight:600; line-height:1.25; margin-bottom:6px; overflow-wrap:anywhere; }
.excerpt{ font-size:14px; color:#cfc6b7; overflow-wrap:anywhere; }
.body{ font-size:15px; color:#e4dccd; overflow-wrap:anywhere; }
.body code{ background:#0a0705; border:1px solid var(--border); border-radius:6px; padding:1px 6px; font-size:13px; }
.body a{ color:var(--gold); text-decoration:underline; }
.post-img{ display:block; max-width:100%; max-height:420px; border-radius:14px; border:1px solid var(--border); margin-top:14px; }
.count{ font-size:12px; color:var(--muted); }

.tag{ font-size:9.5px; font-weight:800; letter-spacing:1px; text-transform:uppercase; padding:3px 9px; border-radius:999px; border:1px solid var(--border); color:var(--muted); }
.tag.pin{ color:#000; background:linear-gradient(135deg,var(--gold-hi),var(--gold-lo)); border-color:transparent; }
.tag.lock{ color:var(--danger); border-color:rgba(224,87,79,.4); }
.tag.hide{ color:var(--soft); border-style:dashed; }
.tag.edit{ color:var(--gold); border-color:var(--line); }

.reacts{ display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
.react{ background:#0a0705; border:1px solid var(--border); border-radius:999px; padding:5px 12px; font-size:13px; transition:border-color .2s, background .2s; }
.react span{ font-size:12px; color:var(--muted); margin-left:4px; }
.react:hover{ border-color:var(--line); }
.react.on{ border-color:var(--gold); background:rgba(224,177,88,.12); }
.react.on span{ color:var(--gold-hi); }

.bulkbar{ position:sticky; top:86px; z-index:20; display:none; gap:8px; flex-wrap:wrap; align-items:center; padding:12px 14px; margin-bottom:14px;
  border:1px solid var(--line); border-radius:16px; background:rgba(17,13,8,.95); backdrop-filter:blur(8px); }
.bulkbar.show{ display:flex; }

.mod{ border:1px solid var(--line); border-radius:18px; padding:16px; margin:18px 0; background:rgba(224,177,88,.04); }
.mod h4{ font-size:10.5px; font-weight:800; letter-spacing:1.4px; text-transform:uppercase; color:var(--gold); margin-bottom:10px; }
.mod .acts{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.mod select.field{ width:auto; padding:7px 10px; font-size:12.5px; }

.reply{ padding:16px 0; border-top:1px solid var(--border-soft); }
.reply:first-child{ border-top:none; }
.reply .foot button{ background:none; border:none; font-size:12px; color:var(--soft); font-weight:700; padding:4px 0; }
.reply .foot button:hover{ color:var(--gold); }

.form{ display:grid; gap:10px; margin:16px 0; }
.editor{ display:grid; gap:10px; margin-top:12px; }
.note{ font-size:12.5px; color:var(--soft); }
.note.err{ color:var(--danger); }

.state{ text-align:center; color:var(--soft); padding:50px 20px; border:1px dashed var(--border); border-radius:20px; }
.state h3{ font-family:var(--display); font-size:22px; color:var(--text); font-weight:600; margin-bottom:6px; }
.back{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:800; letter-spacing:.6px; color:var(--gold); margin-bottom:18px; }
.logline{ font-size:12.5px; color:var(--soft); padding:7px 0; border-top:1px solid var(--border-soft); }
.logline:first-child{ border-top:none; }
.section-h{ font-family:var(--display); font-size:22px; font-weight:600; margin:30px 0 10px; }

.toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--panel-2); border:1px solid var(--gold); padding:11px 18px; border-radius:14px; font-size:13px; font-weight:600; opacity:0; pointer-events:none; transition:.25s; z-index:50; }
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

footer{ text-align:center; font-size:12px; color:var(--soft); padding:30px; border-top:1px solid var(--border-soft); }
footer a{ color:var(--gold); }

@media (max-width:860px){
  .layout{ grid-template-columns:1fr; }
  aside.side{ position:static; }
  .side nav{ display:flex; flex-wrap:wrap; gap:6px; }
  .side a{ padding:8px 12px; }
  .bar nav{ display:none; }
}
@media (prefers-reduced-motion:reduce){ *{ transition:none !important; } }
</style>
</head>
<body>

<header class="bar">
  <a class="brand" href="index.html"><span class="crest" aria-hidden="true">R</span>Relvia</a>
  <div class="bar-right">
    <nav>
      <a href="hub.html">HUB</a>
      <a href="creators/index.html">CREATORS</a>
      <a href="studios/index.html">STUDIOS</a>
      <a href="live.html">LIVE</a>
      <a href="contact.html">CONTACT</a>
    </nav>
    <button class="bell" id="bell" aria-label="Notifications" hidden>🔔<span class="badge" id="badge"></span></button>
  </div>
</header>

<div class="notif-panel" id="notifPanel" role="dialog" aria-label="Notifications">
  <div class="notif-head"><span>Notifications</span><button class="btn ghost sm" id="markAll">Mark all read</button></div>
  <div id="notifList"></div>
</div>

<div class="layout">
  <aside class="side">
    <h3>Search</h3>
    <form id="searchForm">
      <input class="field" id="searchInput" placeholder="Search threads…" maxlength="100" autocomplete="off">
    </form>
    <h3>Dev blog</h3>
    <nav id="catNav"></nav>
  </aside>
  <main id="view"><div class="state"><p>Loading…</p></div></main>
</div>

<footer>&copy; <span id="year"></span> Relvia Entertainment &middot; <a href="contact.html">Contact</a></footer>
<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = "https://nqcbhpqzzwjgkusfbexo.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5xY2JocHF6endqZ2t1c2ZiZXhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzNjY1NjEsImV4cCI6MjA5ODk0MjU2MX0.BphyIGT-X9ctYVvfYXw_ldo5XGguNv5j-zDiGBPrCVU";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const IMG_PREFIX = SUPABASE_URL + "/storage/v1/object/public/devblog-images/";
const MAX_IMG = 3 * 1024 * 1024;

const EMOJIS = ["👍", "🔥", "🐛"];
let me = null, role = null, staff = false, owner = false, cats = [];
let bulkMode = false;
const picked = new Set();
const view = document.getElementById("view");

const esc = s => String(s ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const when = iso => new Date(iso).toLocaleString("en-US", { month:"short", day:"numeric", hour:"numeric", minute:"2-digit" });
const excerpt = (s, n = 180) => (s || "").length > n ? s.slice(0, n) + "…" : (s || "");
const catById = id => cats.find(c => c.id === id);
const safeImg = url => url && url.startsWith(IMG_PREFIX);
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2400);
}
function canPost(cat){
  if (!me || !cat) return false;
  if (cat.post_policy === "anyone") return true;
  if (cat.post_policy === "staff") return staff;
  if (cat.post_policy === "owner") return owner;
  return false;
}
async function names(ids){
  const u = [...new Set(ids.filter(Boolean))];
  const map = {};
  if (!u.length) return map;
  const { data } = await sb.from("profiles").select("id, display_name, username").in("id", u);
  (data || []).forEach(p => { map[p.id] = p.display_name || p.username || "Relvia member"; });
  return map;
}
async function log(action, type, id, note = ""){
  await sb.from("hub_mod_log").insert({ actor_id: me.id, action, target_type: type, target_id: String(id), note });
}

/* ---------- rich text: **bold**, *italic*, `code`, [link](https://...) ---------- */
function rich(text){
  let s = esc(text);
  s = s.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  s = s.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  s = s.replace(/\[([^\]\n]{1,80})\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener nofollow">$1</a>');
  return s.replace(/\n/g, "<br>");
}

/* ---------- reactions ---------- */
async function fetchReactions(type, ids){
  const out = {};
  if (!ids.length) return out;
  const { data } = await sb.from("hub_reactions").select("target_id, emoji, user_id").eq("target_type", type).in("target_id", ids);
  (data || []).forEach(r => {
    const bucket = (out[r.target_id] = out[r.target_id] || {});
    const e = bucket[r.emoji] || { count: 0, mine: false };
    e.count++;
    if (me && r.user_id === me.id) e.mine = true;
    bucket[r.emoji] = e;
  });
  return out;
}
function reactionBar(type, id, counts){
  return `<div class="reacts">${EMOJIS.map(em => {
    const c = (counts && counts[em]) || { count: 0, mine: false };
    return `<button class="react ${c.mine ? "on" : ""}" data-act="react" data-type="${type}" data-id="${id}" data-emoji="${em}" ${me ? "" : "disabled"} title="${me ? "React" : "Sign in to react"}">${em}<span>${c.count}</span></button>`;
  }).join("")}</div>`;
}

/* ---------- notifications ---------- */
async function loadBadge(){
  if (!me) return;
  const { count } = await sb.from("hub_notifications").select("id", { count: "exact", head: true }).eq("read", false);
  const b = document.getElementById("badge");
  b.textContent = count > 99 ? "99+" : (count || "");
  b.classList.toggle("show", !!count);
}
async function loadNotifs(){
  const list = document.getElementById("notifList");
  const { data } = await sb.from("hub_notifications").select("id, kind, thread_id, message, read, created_at").order("created_at", { ascending: false }).limit(25);
  if (!data || !data.length){ list.innerHTML = '<div class="notif-empty">No notifications yet.</div>'; return; }
  list.innerHTML = data.map(n => `
    <button class="notif-item ${n.read ? "" : "unread"}" data-notif="${n.id}" data-thread="${n.thread_id || ""}">
      ${esc(n.message)}<span class="when">${when(n.created_at)}</span>
    </button>`).join("");
}
document.getElementById("bell").addEventListener("click", async () => {
  const panel = document.getElementById("notifPanel");
  panel.classList.toggle("open");
  if (panel.classList.contains("open")) await loadNotifs();
});
document.getElementById("notifList").addEventListener("click", async e => {
  const item = e.target.closest("[data-notif]");
  if (!item) return;
  await sb.from("hub_notifications").update({ read: true }).eq("id", item.dataset.notif);
  document.getElementById("notifPanel").classList.remove("open");
  loadBadge();
  if (item.dataset.thread) location.hash = "#t/" + item.dataset.thread;
});
document.getElementById("markAll").addEventListener("click", async () => {
  await sb.from("hub_notifications").update({ read: true }).eq("user_id", me.id).eq("read", false);
  loadNotifs(); loadBadge();
});
document.addEventListener("click", e => {
  if (!e.target.closest("#notifPanel") && !e.target.closest("#bell")) document.getElementById("notifPanel").classList.remove("open");
});

/* ---------- search ---------- */
document.getElementById("searchForm").addEventListener("submit", e => {
  e.preventDefault();
  const q = document.getElementById("searchInput").value.trim();
  if (q) location.hash = "#s/" + encodeURIComponent(q);
});

/* ---------- sidebar ---------- */
function renderNav(active){
  document.getElementById("catNav").innerHTML = cats.map(c => `
    <a href="#c/${esc(c.id)}" class="${active === c.id ? "on" : ""}">${esc(c.name)}
      ${c.visibility === "owner" ? '<span class="lock">Owner</span>' : ""}</a>`).join("");
}

/* ---------- thread list (shared by categories, search and author pages) ---------- */
function threadList(threads, who, showCat){
  return threads.map(t => `
    <a class="card thread ${t.pinned ? "pinned" : ""} ${t.hidden ? "hidden" : ""} ${picked.has(t.id) ? "picked" : ""}" href="#t/${t.id}" data-tid="${t.id}">
      <div class="row">
        <span class="by-link" data-user="${t.author_id || ""}">${esc(who[t.author_id] || "Relvia member")}</span> · <span>${when(t.created_at)}</span>
        ${showCat && catById(t.category_id) ? `<span class="tag">${esc(catById(t.category_id).name)}</span>` : ""}
        ${t.pinned ? '<span class="tag pin">Pinned</span>' : ""}
        ${t.locked ? '<span class="tag lock">Locked</span>' : ""}
        ${t.hidden ? '<span class="tag hide">Hidden</span>' : ""}
      </div>
      <div class="title">${esc(t.title)}</div>
      <div class="excerpt">${esc(excerpt(t.body))}</div>
      ${t.image_url && safeImg(t.image_url) ? `<img class="post-img" src="${esc(t.image_url)}" alt="" loading="lazy" style="max-height:200px;">` : ""}
      <div class="row" style="margin:12px 0 0;"><span class="count">${t.reply_count} repl${t.reply_count === 1 ? "y" : "ies"}</span>
        ${t.edited_at ? '<span class="tag edit">Edited</span>' : ""}</div>
    </a>`).join("");
}
async function queryThreads({ cat, sort, unanswered, q, author }){
  let qy = sb.from("hub_threads")
    .select("id, title, body, author_id, pinned, locked, hidden, reply_count, last_activity, created_at, edited_at, category_id, image_url");
  if (cat) qy = qy.eq("category_id", cat).order("pinned", { ascending: false });
  if (author) qy = qy.eq("author_id", author);
  if (q){
    const s = q.replace(/[,()%*]/g, " ").trim();
    qy = qy.or(`title.ilike.%${s}%,body.ilike.%${s}%`);
  }
  if (unanswered) qy = qy.eq("reply_count", 0);
  if (sort === "new") qy = qy.order("created_at", { ascending: false });
  else if (sort === "replies") qy = qy.order("reply_count", { ascending: false }).order("last_activity", { ascending: false });
  else qy = qy.order("last_activity", { ascending: false });
  const { data, error } = await qy.limit(60);
  return { data: data || [], error };
}

    </div>

      <button class="btn ghost sm" data-bulk="lock">Lock</button>
      <button class="btn ghost sm" data-bulk="unlock">Unlock</button>
      <button class="btn ghost sm" data-bulk="pin">Pin</button>
      <button class="btn ghost sm" data-bulk="unpin">Unpin</button>
      <button class="btn ghost sm" data-bulk="hide">Hide</button>

      <select class="field" id="bulkMove" style="width:auto;padding:7px 10px;font-size:12.5px;">
        <option value="">Move to…</option>
        ${cats.filter(c => c.id !== id).map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("")}

  };
  document.getElementById("sortSel").addEventListener("change", applyFilters);
  document.getElementById("unansw").addEventListener("change", applyFilters);

  const { data: threads, error } = await queryThreads({ cat: id, sort, unanswered });
  const box = document.getElementById("threads");
  if (error){ box.innerHTML = `<div class="state"><h3>Couldn't load threads</h3><p>${esc(error.message)}</p></div>`; return; }
  const who = await names(threads.map(t => t.author_id));
  document.getElementById("countLine").textContent = `${threads.length} thread${threads.length === 1 ? "" : "s"}`;
  box.innerHTML = threads.length
    ? threadList(threads, who, false)
    : `<div class="state"><h3>${unanswered ? "Nothing unanswered" : "No threads yet"}</h3><p>${unanswered ? "Every thread here has a reply." : "Be the first to start one."}</p></div>`;

  const btn = document.getElementById("newBtn");
  if (btn){
    btn.addEventListener("click", () => {
      const f = document.getElementById("newForm");
      f.hidden = !f.hidden;
      f.innerHTML = f.hidden ? "" : `
        <form class="card form" id="threadForm">
          <input class="field" id="tTitle" placeholder="Thread title" maxlength="160" required>
          <textarea class="field" id="tBody" placeholder="What's on your mind? Use **bold**, *italic*, \`code\` or [link](https://…)" maxlength="8000"></textarea>
          <label class="file-label">Add an image (optional, up to 3 MB) <input type="file" id="tImg" accept="image/*"></label>
          <div class="toolbar" style="margin:0;"><button class="btn sm" type="submit">Post thread</button><span class="note" id="tMsg"></span></div>
        </form>`;
    });
  }

  // Bulk selection (staff)
  const bulkbar = document.getElementById("bulkbar");
  const refreshBulk = () => {
    document.getElementById("bulkCount").textContent = `${picked.size} selected`;
    document.querySelectorAll("a.thread[data-tid]").forEach(a => a.classList.toggle("picked", picked.has(a.dataset.tid)));
  };
  const bulkBtn = document.getElementById("bulkToggle");
  if (bulkBtn){
    bulkBtn.addEventListener("click", () => {
      bulkMode = !bulkMode;
      bulkBtn.textContent = bulkMode ? "Done selecting" : "Select threads";
      bulkbar.classList.toggle("show", bulkMode);
      if (!bulkMode){ picked.clear(); refreshBulk(); }
    });
  }
  box.addEventListener("click", e => {
    const a = e.target.closest("a.thread[data-tid]");
    if (!a || !bulkMode) return;
    e.preventDefault();
    const tid = a.dataset.tid;
    picked.has(tid) ? picked.delete(tid) : picked.add(tid);
    refreshBulk();
  });
  bulkbar.addEventListener("click", async e => {
    const b = e.target.closest("[data-bulk]");
    if (!b) return;
    const act = b.dataset.bulk;
    if (act === "clear"){ picked.clear(); refreshBulk(); return; }
    const ids = [...picked];
    if (!ids.length){ toast("Select at least one thread."); return; }
    let patch = null;
    if (act === "lock" || act === "unlock") patch = { locked: act === "lock" };
    if (act === "pin" || act === "unpin") patch = { pinned: act === "pin" };
    if (act === "hide" || act === "unhide") patch = { hidden: act === "hide" };
    if (act === "move"){ return; }
    if (!patch) return;
    const { error: upErr } = await sb.from("hub_threads").update(patch).in("id", ids);
    if (upErr){ toast("Couldn't apply that. Check your permissions."); return; }
    await sb.from("hub_mod_log").insert(ids.map(id => ({ actor_id: me.id, action: `bulk-${act}`, target_type: "thread", target_id: id, note: `${ids.length} selected` })));
    picked.clear();
    toast(`${ids.length} thread${ids.length === 1 ? "" : "s"} updated.`);
    route();
  });
  document.getElementById("bulkMove").addEventListener("change", async e => {
    const target = e.target.value;
    const ids = [...picked];
    if (!target || !ids.length){ e.target.value = ""; if (!ids.length) toast("Select at least one thread."); return; }
    const { error: mvErr } = await sb.from("hub_threads").update({ category_id: target }).in("id", ids);
    if (mvErr){ toast("Couldn't move those threads."); return; }
    await sb.from("hub_mod_log").insert(ids.map(id => ({ actor_id: me.id, action: "bulk-move", target_type: "thread", target_id: id, note: "to " + target })));
    picked.clear();
    toast(`${ids.length} thread${ids.length === 1 ? "" : "s"} moved.`);
    route();
  });
}

/* ---------- uploads ---------- */
async function uploadImage(file){
  if (!file) return null;
  if (!file.type.startsWith("image/")) throw new Error("That file isn't an image.");
  if (file.size > MAX_IMG) throw new Error("Images have to be 3 MB or smaller.");
  const safe = file.name.replace(/[^a-zA-Z0-9._-]/g, "_").slice(-60);
  const path = `${me.id}/${Date.now()}-${safe}`;
  const { error } = await sb.storage.from("devblog-images").upload(path, file, { contentType: file.type, upsert: false });
  if (error) throw new Error("Couldn't upload the image.");
  return sb.storage.from("devblog-images").getPublicUrl(path).data.publicUrl;
}

/* ---------- actions (event delegation) ---------- */
view.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act, type = el.dataset.type, id = el.dataset.id;
  const table = type === "reply" ? "hub_replies" : "hub_threads";

  if (act === "react"){
    if (!me) return;
    const emoji = el.dataset.emoji;
    if (el.classList.contains("on")){
      await sb.from("hub_reactions").delete().match({ target_type: type, target_id: id, user_id: me.id, emoji });
    } else {
      const { error } = await sb.from("hub_reactions").insert({ target_type: type, target_id: id, user_id: me.id, emoji });
      if (error){ toast("Couldn't add that reaction."); return; }
    }
    return route();
  }

  if (act === "edit"){
    const box = el.closest(".editable");
    const isThread = box.dataset.type === "thread";
    box.innerHTML = `
      <div class="editor">
        ${isThread ? `<input class="field ed-title" maxlength="160" value="${esc(box.dataset.title)}">` : ""}
        <textarea class="field ed-body" maxlength="${isThread ? 8000 : 4000}">${esc(box.dataset.raw)}</textarea>
        <div class="toolbar" style="margin:0;">
          <button class="btn sm" data-act="save" data-type="${box.dataset.type}" data-id="${box.dataset.id}">Save changes</button>
          <button class="btn ghost sm" data-act="cancel">Cancel</button>
        </div>
      </div>`;
    return;
  }
  if (act === "cancel") return route();
  if (act === "save"){
    const box = el.closest(".editable");
    const body = box.querySelector(".ed-body").value.trim();
    const patch = { body };
    if (type === "thread"){
      const title = box.querySelector(".ed-title").value.trim();
      if (title.length < 3){ toast("Titles need at least 3 characters."); return; }
      patch.title = title;
    }
    if (!body && type === "reply"){ toast("A reply can't be empty."); return; }
    const { error } = await sb.from(type === "reply" ? "hub_replies" : "hub_threads").update(patch).eq("id", id);
    if (error){ toast("Couldn't save. Try again."); return; }
    toast("Saved.");
    return route();
  }

  if (act === "report"){
    const reason = prompt("Why are you reporting this? (optional)") ?? "";
    const { error } = await sb.from("hub_reports").insert({ target_type: type, target_id: id, reporter_id: me.id, reason });
    toast(error ? "You've already reported this." : "Thanks. The team will take a look.");
    return;
  }
  if (act === "lock" || act === "unlock"){
    await sb.from("hub_threads").update({ locked: act === "lock" }).eq("id", id); await log(act, "thread", id);
  }
  else if (act === "pin" || act === "unpin"){
    await sb.from("hub_threads").update({ pinned: act === "pin" }).eq("id", id); await log(act, "thread", id);
  }
  else if (act === "hide" || act === "unhide"){
    await sb.from(table).update({ hidden: act === "hide" }).eq("id", id); await log(act, type || "thread", id);
  }
  else if (act === "hide-target"){
    await sb.from(type === "reply" ? "hub_replies" : "hub_threads").update({ hidden: true }).eq("id", id);
    await sb.from("hub_reports").update({ status: "resolved" }).eq("id", el.dataset.report);
    await log("hide-from-report", type, id);
    toast("Content hidden and report resolved.");
    return loadModPanel();
  }
  else if (act === "resolve" || act === "dismiss"){
    await sb.from("hub_reports").update({ status: act === "resolve" ? "resolved" : "dismissed" }).eq("id", el.dataset.report);
    await log(act + " report", "report", el.dataset.report);
    return loadModPanel();
  }
  else if (act === "ban"){
    const reason = prompt("Reason for the ban (shown to staff only):");
    if (reason === null) return;
    const { error } = await sb.from("hub_bans").insert({ user_id: el.dataset.user, reason, created_by: me.id });
    if (error){ toast("Couldn't ban that user."); return; }
    await log("ban", "user", el.dataset.user, reason);
    toast("User banned from posting.");
  }
  else if (act === "delete"){
    if (!confirm("Delete this permanently? This can't be undone.")) return;
    const catId = view.dataset.cat;
    await sb.from(table).delete().eq("id", id);
    await log("delete", type || "thread", id);
    if (type !== "reply"){ location.hash = "#c/" + catId; return; }
  }
  route();
});

view.addEventListener("change", async e => {
  if (e.target.dataset.act !== "move") return;
  const id = e.target.dataset.id, cat = e.target.value;
  await sb.from("hub_threads").update({ category_id: cat }).eq("id", id);
  await log("move", "thread", id, "to " + cat);
  toast("Thread moved.");
  route();
});

view.addEventListener("submit", async e => {
  e.preventDefault();
  if (e.target.id === "threadForm"){
    const title = document.getElementById("tTitle").value.trim();
    const body = document.getElementById("tBody").value.trim();
    const msg = document.getElementById("tMsg");
    const cat = (location.hash.match(/^#c\/([^/?]+)/) || [])[1];
    if (title.length < 3){ msg.className = "note err"; msg.textContent = "Titles need at least 3 characters."; return; }
    try {
      msg.className = "note"; msg.textContent = "Posting…";
      const image_url = await uploadImage(document.getElementById("tImg").files[0]);
      const { data, error } = await sb.from("hub_threads").insert({ category_id: cat, author_id: me.id, title, body, image_url }).select("id").single();
      if (error) throw new Error("Couldn't post. You may not have permission here.");
      location.hash = "#t/" + data.id;
    } catch (err){ msg.className = "note err"; msg.textContent = err.message; }
  }
  if (e.target.id === "replyForm"){
    const body = document.getElementById("replyBody").value.trim();
    const msg = document.getElementById("rMsg");
    if (!body) return;
    try {
      msg.className = "note"; msg.textContent = "Posting…";
      const image_url = await uploadImage(document.getElementById("rImg").files[0]);
      const { error } = await sb.from("hub_replies").insert({ thread_id: view.dataset.thread, author_id: me.id, body, image_url });
      if (error) throw new Error("Couldn't reply. The thread may be locked or you may be banned.");
      route();
    } catch (err){ msg.className = "note err"; msg.textContent = err.message; }
  }
});

view.addEventListener("click", e => {
  const link = e.target.closest("[data-user]");
  if (link && !bulkMode && link.dataset.user) { /* normal anchor navigation via href */ }
});

/* ---------- routing ---------- */
async function route(){
  const [path, qs] = location.hash.split("?");
  const params = new URLSearchParams(qs || "");
  if (path.startsWith("#t/")) return renderThread(path.slice(3));
  if (path.startsWith("#c/")) return renderCategory(path.slice(3), params);
  if (path.startsWith("#s/")) return renderSearch(decodeURIComponent(path.slice(3)));
  if (path.startsWith("#u/")) return renderUser(path.slice(3));
  return renderHome();
}

/* ---------- start ---------- */
document.getElementById("year").textContent = new Date().getFullYear();

async function start(){
  const { data: s } = await sb.auth.getSession();
  me = s && s.session ? s.session.user : null;
  if (me){
    const { data: r } = await sb.rpc("hub_my_role");
    role = r || null;
    document.getElementById("bell").hidden = false;
    loadBadge();
  }
  staff = ["owner", "founder", "moderator"].includes(role);
  owner = ["owner", "founder"].includes(role);

  const { data } = await sb.from("hub_categories").select("*").order("position", { ascending: true });
  cats = data || [];
  renderNav(null);

  window.addEventListener("hashchange", () => { picked.clear(); bulkMode = false; route(); });
  await route();
  setInterval(() => {
    const typing = document.activeElement && ["TEXTAREA", "INPUT", "SELECT"].includes(document.activeElement.tagName);
    if (!typing && !bulkMode){ route(); if (me) loadBadge(); }
  }, 60000);
}
start().catch(() => { view.innerHTML = '<div class="state"><h3>Something went wrong</h3><p>Refresh the page and try again.</p></div>'; });
</script>
</body>
</html>
