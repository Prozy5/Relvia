<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Status — Relvia</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --background:#0a0806; --glass:rgba(18,14,10,.6); --surface-light:#1c150d; --surface:rgba(20,16,11,.78);
  --border:#2a2018; --border-soft:#1c1610; --gold-start:#f2c766; --gold-end:#b9832f; --gold:#e0b158;
  --text:#f5f1ea; --muted:#a89e8f; --muted-soft:#6b6255; --ok-green:#5fae7a; --live-red:#e0574f;
  --font-display:"Playfair Display",serif; --font-body:"Inter",sans-serif;
}
*{ margin:0; padding:0; box-sizing:border-box; font-family:var(--font-body); }
body{
  color:var(--text); min-height:100vh;
  background:
    radial-gradient(ellipse 900px 500px at 15% -5%, rgba(217,169,75,.10), transparent 60%),
    var(--background);
}
a{ text-decoration:none; color:inherit; }
button{ cursor:pointer; border:none; background:none; color:inherit; font-family:inherit; font-size:inherit; }

.topbar{
  position:sticky; top:0; height:72px; display:flex; align-items:center; justify-content:space-between;
  padding:0 30px; background:rgba(5,5,5,.85); backdrop-filter:blur(18px); border-bottom:1px solid var(--border-soft); z-index:50;
}
.brand{ display:flex; align-items:center; gap:12px; }
.brand-badge{
  width:34px; height:34px; border-radius:50%; background:#000;
  background-image:radial-gradient(circle at 32% 22%, rgba(242,199,102,.28), transparent 65%);
  border:1.5px solid var(--gold-end); display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-style:italic; font-weight:700; font-size:17px; color:var(--gold-start);
}
.brand-name{ font-family:var(--font-display); font-weight:700; font-size:17px; }
.back-link{ font-size:13px; font-weight:700; color:var(--muted); }
.back-link:hover{ color:var(--gold); }

.container{ max-width:760px; margin:auto; padding:34px 24px 90px; }

.status-hero{
  border-radius:22px; padding:34px 30px; text-align:center; margin-bottom:36px;
  background:var(--glass); border:1px solid var(--border);
}
.status-hero.operational{ border-color:var(--ok-green); }
.status-hero.degraded_performance{ border-color:var(--gold-end); }
.status-hero.partial_outage{ border-color:#e08a3d; }
.status-hero.major_outage{ border-color:var(--live-red); }
.status-hero.maintenance{ border-color:#6ea8d8; }
.status-dot{ width:12px; height:12px; border-radius:50%; margin:0 auto 16px; }
.status-hero.operational .status-dot{ background:var(--ok-green); box-shadow:0 0 0 6px rgba(95,174,122,.15); }
.status-hero.degraded_performance .status-dot{ background:var(--gold); box-shadow:0 0 0 6px rgba(217,169,75,.15); animation:pulse 1.6s infinite; }
.status-hero.partial_outage .status-dot{ background:#e08a3d; box-shadow:0 0 0 6px rgba(224,138,61,.15); animation:pulse 1.6s infinite; }
.status-hero.major_outage .status-dot{ background:var(--live-red); box-shadow:0 0 0 6px rgba(224,87,79,.15); animation:pulse 1.6s infinite; }
.status-hero.maintenance .status-dot{ background:#6ea8d8; box-shadow:0 0 0 6px rgba(110,168,216,.15); }
.override-tag{
  display:inline-block; font-size:10px; font-weight:800; letter-spacing:.5px; text-transform:uppercase;
  color:var(--muted); border:1px solid var(--border); padding:3px 10px; border-radius:999px; margin-top:10px;
}
@keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.4;} }
.status-hero h1{ font-family:var(--font-display); font-size:26px; font-weight:600; margin-bottom:6px; }
.status-hero p{ color:var(--muted); font-size:13px; }

.eyebrow{ font-size:11px; letter-spacing:2.5px; color:var(--gold); text-transform:uppercase; font-weight:700; margin:34px 0 14px; }
.eyebrow:first-of-type{ margin-top:0; }

.division-group{ margin-bottom:8px; }
.division-name{ font-size:13px; font-weight:700; color:var(--muted); margin:18px 0 8px; text-transform:uppercase; letter-spacing:.5px; }
.component-row{
  display:flex; align-items:center; justify-content:space-between; padding:14px 18px;
  background:var(--glass); border:1px solid var(--border); border-radius:14px; margin-bottom:8px;
}
.component-name{ font-size:14px; font-weight:600; }
.component-pill{ font-size:11px; font-weight:800; padding:4px 12px; border-radius:999px; }
.component-pill.open{ background:rgba(95,174,122,.15); color:var(--ok-green); }
.component-pill.closed{ background:rgba(224,87,79,.15); color:#f2a8a3; }

.timeline{ margin-top:6px; }
.timeline-item{ background:var(--glass); border:1px solid var(--border); border-radius:14px; padding:16px 18px; margin-bottom:10px; }
.timeline-head{ display:flex; align-items:center; gap:10px; margin-bottom:6px; }
.timeline-pill{ font-size:10px; font-weight:800; padding:3px 9px; border-radius:999px; text-transform:uppercase; }
.timeline-pill.operational{ background:rgba(95,174,122,.15); color:var(--ok-green); }
.timeline-pill.degraded, .timeline-pill.maintenance{ background:rgba(217,169,75,.15); color:var(--gold); }
.timeline-pill.outage{ background:rgba(224,87,79,.15); color:#f2a8a3; }
.timeline-time{ font-size:11.5px; color:var(--muted-soft); }
.timeline-msg{ font-size:13.5px; color:#ddd; line-height:1.5; }

.empty{ text-align:center; color:var(--muted); padding:30px 0; font-size:13.5px; }
</style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="/index.html">
    <div class="brand-badge">R</div>
    <span class="brand-name">Relvia Status</span>
  </a>
  <a class="back-link" href="/index.html">← Relvia Entertainment</a>
</header>

<div class="container">
  <div class="status-hero" id="statusHero">
    <div class="status-dot" id="statusDot"></div>
    <h1 id="statusHeroText">Checking status...</h1>
    <p id="statusHeroSub"></p>
  </div>

  <div class="eyebrow">Components</div>
  <div id="componentsByDivision"><div class="empty">Loading...</div></div>

  <div class="eyebrow">Recent Updates</div>
  <div class="timeline" id="timeline"><div class="empty">Loading...</div></div>
</div>

<script>

const SUPABASE_URL = "https://nqcbhpqzzwjgkusfbexo.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5xY2JocHF6endqZ2t1c2ZiZXhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzNjY1NjEsImV4cCI6MjA5ODk0MjU2MX0.BphyIGT-X9ctYVvfYXw_ldo5XGguNv5j-zDiGBPrCVU";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { storageKey: "relvia-live-auth" }
});

function escapeHtml(str){
  return (str || "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

const STATUS_LABELS = {
  operational: "All Systems Operational",
  degraded_performance: "Degraded Performance",
  partial_outage: "Partial Outage",
  major_outage: "Major Outage",
  maintenance: "Under Maintenance",
};

// ==========================================================
// STATUS HERO — manual override wins if set, otherwise this is
// auto-computed from what's actually closed right now via
// get_ecosystem_status(). No manual posting required for the
// baseline to be accurate.
// ==========================================================
async function loadAutoStatus(){
  const hero = document.getElementById("statusHero");

  const { data, error } = await supabaseClient.rpc("get_ecosystem_status");

  if (error || !data || data.length === 0){
    hero.className = "status-hero";
    document.getElementById("statusHeroText").textContent = "Status unavailable";
    document.getElementById("statusHeroSub").textContent = "Couldn't reach the status system.";
    return;
  }

  const { overall_status, closed_count, total_count, is_override, override_message } = data[0];
  hero.className = `status-hero ${overall_status}`;
  document.getElementById("statusHeroText").textContent = STATUS_LABELS[overall_status] || overall_status;

  if (is_override){
    document.getElementById("statusHeroSub").textContent = override_message || "Manually reported by Relvia staff.";
    document.getElementById("statusHeroSub").innerHTML += `<br><span class="override-tag">Manually reported</span>`;
  } else {
    document.getElementById("statusHeroSub").textContent =
      overall_status === "operational"
        ? `All ${total_count} monitored pages are up.`
        : `${closed_count} of ${total_count} monitored pages are currently closed.`;
  }
}

// ==========================================================
// COMPONENTS — grouped by division, auto-detected from page locks
// ==========================================================
async function loadComponents(){
  const container = document.getElementById("componentsByDivision");

  const { data, error } = await supabaseClient.rpc("get_page_locks_public");

  if (error || !data || data.length === 0){
    container.innerHTML = `<div class="empty">No component data available.</div>`;
    return;
  }

  const byDivision = {};
  data.forEach(page => {
    const division = page.division || "Relvia Live";
    if (!byDivision[division]) byDivision[division] = [];
    byDivision[division].push(page);
  });

  const order = ["Relvia Studios", "Relvia Music", "Relvia Live"];
  const divisions = [...order.filter(d => byDivision[d]), ...Object.keys(byDivision).filter(d => !order.includes(d))];

  container.innerHTML = "";
  divisions.forEach(division => {
    const group = document.createElement("div");
    group.className = "division-group";
    group.innerHTML = `<div class="division-name">${escapeHtml(division)}</div>`;

    byDivision[division].forEach(page => {
      const row = document.createElement("div");
      row.className = "component-row";
      row.innerHTML = `
        <span class="component-name">${escapeHtml(page.label)}</span>
        <span class="component-pill ${page.is_closed ? "closed" : "open"}">${page.is_closed ? "Unavailable" : "Operational"}</span>`;
      group.appendChild(row);
    });

    container.appendChild(group);
  });
}

// ==========================================================
// MANUAL UPDATES — narrative incident feed, secondary to the
// auto-computed hero above.
// ==========================================================
async function loadTimeline(){
  const timeline = document.getElementById("timeline");

  const { data, error } = await supabaseClient
    .from("live_status_updates")
    .select("*")
    .order("created_at", { ascending:false })
    .limit(15);

  if (error || !data || data.length === 0){
    timeline.innerHTML = `<div class="empty">No manual updates posted yet.</div>`;
    return;
  }

  timeline.innerHTML = "";
  data.forEach(update => {
    const item = document.createElement("div");
    item.className = "timeline-item";
    item.innerHTML = `
      <div class="timeline-head">
        <span class="timeline-pill ${update.status}">${escapeHtml(update.status)}</span>
        <span class="timeline-time">${new Date(update.created_at).toLocaleString()}</span>
      </div>
      <div class="timeline-msg">${escapeHtml(update.message || "")}</div>`;
    timeline.appendChild(item);
  });
}

function loadAll(){
  loadAutoStatus();
  loadComponents();
  loadTimeline();
}

loadAll();
setInterval(loadAll, 30000);
</script>
</body>
</html>
