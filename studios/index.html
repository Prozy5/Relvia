<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relvia Studios</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --background:#0a0806; --glass:rgba(18,14,10,.6); --surface-light:#1c150d; --surface:rgba(20,16,11,.78);
  --border:#2a2018; --border-soft:#1c1610; --gold-start:#f2c766; --gold-end:#b9832f; --gold:#e0b158;
  --text:#f5f1ea; --muted:#a89e8f; --muted-soft:#6b6255;
  --radius-lg:24px; --font-display:"Playfair Display",serif; --font-body:"Inter",sans-serif;
}
*{ margin:0; padding:0; box-sizing:border-box; font-family:var(--font-body); }
body{
  color:var(--text); min-height:100vh;
  background:
    radial-gradient(ellipse 900px 500px at 15% -5%, rgba(217,169,75,.10), transparent 60%),
    radial-gradient(ellipse 700px 500px at 100% 20%, rgba(185,131,47,.06), transparent 55%),
    var(--background);
  background-attachment:fixed;
}
a{ text-decoration:none; color:inherit; }
button, input, textarea, select{ font-family:inherit; }
button{ cursor:pointer; border:none; background:none; color:inherit; font-size:inherit; }
img{ max-width:100%; display:block; }

.topbar{
  position:sticky; top:0; height:76px; display:flex; align-items:center; justify-content:space-between;
  padding:0 32px; background:rgba(5,5,5,.82); backdrop-filter:blur(20px); border-bottom:1px solid var(--border-soft); z-index:50;
}
.brand{ display:flex; align-items:center; gap:12px; }
.brand-badge{
  width:38px; height:38px; border-radius:50%; background:#000;
  background-image:radial-gradient(circle at 32% 22%, rgba(242,199,102,.28), transparent 65%);
  border:1.5px solid var(--gold-end); display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-style:italic; font-weight:700; font-size:19px; color:var(--gold-start);
}
.brand-name{ font-family:var(--font-display); font-weight:700; font-size:19px; }
.new-project-btn{
  font-size:13.5px; font-weight:800; padding:10px 20px; border-radius:12px;
  background:linear-gradient(135deg,var(--gold-start),var(--gold-end)); color:#000;
}
.new-project-btn:hover{ opacity:.88; }

.container{ max-width:1200px; margin:auto; padding:34px 24px 80px; }
.page-title{ font-family:var(--font-display); font-size:36px; font-weight:600; margin-bottom:8px; }
.page-sub{ color:var(--muted); font-size:14px; margin-bottom:28px; }

.tabs{ display:flex; gap:6px; margin-bottom:30px; background:var(--surface-light); border:1px solid var(--border); border-radius:14px; padding:5px; max-width:340px; }
.tab{ flex:1; text-align:center; padding:10px; border-radius:10px; font-size:13px; font-weight:700; color:var(--muted); }
.tab.active{ background:linear-gradient(135deg,var(--gold-start),var(--gold-end)); color:#000; }
.tab:not(.active):hover{ color:white; }

.film-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:20px; }
.film-card{ cursor:pointer; }
.film-thumb{
  aspect-ratio:16/9; background:linear-gradient(135deg,#1c1a15,#0d0d0d 55%,#1a1508);
  border-radius:16px; overflow:hidden; position:relative; border:1px solid var(--border); margin-bottom:10px;
}
.film-thumb img{ width:100%; height:100%; object-fit:cover; }
.film-thumb .play-icon{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:26px;
  color:var(--gold); background:rgba(0,0,0,0); transition:.2s;
}
.film-card:hover .play-icon{ background:rgba(0,0,0,.35); }
.film-title{ font-size:14.5px; font-weight:700; margin-bottom:3px; }
.film-meta{ font-size:12px; color:var(--muted); }

.project-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:18px; }
.project-card{
  background:var(--glass); border:1px solid var(--border); border-radius:18px; padding:20px; cursor:pointer; transition:border-color .2s;
}
.project-card:hover{ border-color:var(--gold-end); }
.project-status{ display:inline-block; font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.5px; padding:4px 10px; border-radius:999px; margin-bottom:12px; }
.project-status.development{ background:rgba(217,169,75,.15); color:var(--gold); }
.project-status.production{ background:rgba(224,87,79,.15); color:#f2a8a3; }
.project-status.post{ background:rgba(110,168,216,.15); color:#8fbde0; }
.project-status.released{ background:rgba(95,174,122,.15); color:#8fd1a8; }
.project-title{ font-family:var(--font-display); font-size:19px; font-weight:600; margin-bottom:6px; }
.project-logline{ font-size:13px; color:var(--muted); line-height:1.5; margin-bottom:14px; min-height:38px; }
.project-footer{ display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--muted-soft); }

.empty-state{ text-align:center; color:var(--muted); padding:60px 20px; grid-column:1/-1; }
.empty-state h4{ color:#ddd; font-size:17px; margin-bottom:8px; font-family:var(--font-display); font-size:20px; }

/* MODAL */
.modal-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.7); backdrop-filter:blur(4px); display:none; align-items:center; justify-content:center; z-index:2000; padding:24px; }
.modal-backdrop.open{ display:flex; }
.modal{ background:var(--surface); border:1px solid var(--border); border-radius:22px; width:480px; max-width:100%; padding:28px; }
.modal h3{ font-family:var(--font-display); font-size:22px; margin-bottom:18px; }
.field{ margin-bottom:14px; }
.field label{ font-size:12px; color:var(--muted); display:block; margin-bottom:6px; font-weight:600; }
.field input, .field textarea, .field select{
  width:100%; background:var(--surface-light); border:1px solid var(--border); border-radius:12px;
  padding:11px 14px; color:white; font-size:14px;
}
.field textarea{ resize:none; min-height:70px; }
.field input:focus, .field textarea:focus, .field select:focus{ outline:none; border-color:var(--gold); }
.modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }
.btn{ font-size:13px; font-weight:700; padding:10px 20px; border-radius:12px; border:1px solid var(--border); background:var(--surface-light); }
.btn:hover{ border-color:var(--gold); color:var(--gold); }
.btn.gold{ background:linear-gradient(135deg,var(--gold-start),var(--gold-end)); color:#000; border:none; font-weight:800; }
.btn.gold:hover{ opacity:.88; color:#000; }

.loading-state{ text-align:center; color:var(--muted); padding:60px 0; grid-column:1/-1; }
</style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="welcome.html">
    <div class="brand-badge">R</div>
    <span class="brand-name">Relvia Studios</span>
  </a>
  <button class="new-project-btn" id="newProjectBtn">+ New Project</button>
</header>

<div class="container">
  <div class="page-title">Relvia Studios</div>
  <div class="page-sub">Where filmmakers collaborate on short films, from first idea to premiere.</div>

  <div class="tabs">
    <div class="tab active" data-tab="watch">Watch</div>
    <div class="tab" data-tab="collaborate">Collaborate</div>
  </div>

  <div id="viewContainer"><div class="loading-state">Loading...</div></div>
</div>

<!-- NEW PROJECT MODAL -->
<div class="modal-backdrop" id="newProjectModal">
  <div class="modal">
    <h3>Start a new project</h3>
    <div class="field"><label>Title</label><input type="text" id="projectTitle"></div>
    <div class="field"><label>Logline</label><textarea id="projectLogline" placeholder="One or two sentences about the film..."></textarea></div>
    <div class="field"><label>Genre</label><input type="text" id="projectGenre" placeholder="Drama, Comedy, Thriller..."></div>
    <div class="modal-actions">
      <button class="btn" id="cancelProjectBtn">Cancel</button>
      <button class="btn gold" id="createProjectBtn">Create project</button>
    </div>
  </div>
</div>

<script>

const SUPABASE_URL = "https://nqcbhpqzzwjgkusfbexo.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5xY2JocHF6endqZ2t1c2ZiZXhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzNjY1NjEsImV4cCI6MjA5ODk0MjU2MX0.BphyIGT-X9ctYVvfYXw_ldo5XGguNv5j-zDiGBPrCVU";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let activeTab = "watch";

function escapeHtml(str){
  return (str || "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

async function initialize(){
  const { data: sessionData } = await supabaseClient.auth.getSession();
  if (!sessionData || !sessionData.session){ window.location.href = "/login.html"; return; }
  const { data: userData } = await supabaseClient.auth.getUser();
  if (!userData.user){ window.location.href = "/login.html"; return; }
  currentUser = userData.user;

  document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      activeTab = tab.dataset.tab;
      renderView();
    });
  });

  document.getElementById("newProjectBtn").addEventListener("click", () => document.getElementById("newProjectModal").classList.add("open"));
  document.getElementById("cancelProjectBtn").addEventListener("click", () => document.getElementById("newProjectModal").classList.remove("open"));
  document.getElementById("createProjectBtn").addEventListener("click", createProject);

  await renderView();
}

async function renderView(){
  if (activeTab === "watch") return renderWatch();
  return renderCollaborate();
}

async function renderWatch(){
  const container = document.getElementById("viewContainer");
  container.innerHTML = `<div class="loading-state">Loading films...</div>`;

  const { data: films, error } = await supabaseClient
    .from("studios_films")
    .select("*, studios_projects(title, genre)")
    .order("released_at", { ascending:false });

  if (error || !films || films.length === 0){
    container.innerHTML = `
      <div class="film-grid">
        <div class="empty-state">
          <h4>Nothing released yet</h4>
          <p>Start or join a project in the Collaborate tab to make the first one.</p>
        </div>
      </div>`;
    return;
  }

  const grid = document.createElement("div");
  grid.className = "film-grid";
  films.forEach(film => {
    const card = document.createElement("div");
    card.className = "film-card";
    card.innerHTML = `
      <div class="film-thumb">
        ${film.cover_url ? `<img src="${film.cover_url}">` : ""}
        <div class="play-icon">&#9654;</div>
      </div>
      <div class="film-title">${escapeHtml(film.title)}</div>
      <div class="film-meta">${escapeHtml(film.studios_projects?.genre || "Short Film")} &middot; ${film.view_count} views</div>`;
    card.addEventListener("click", () => { window.location.href = `studios-project.html?id=${film.project_id}`; });
    grid.appendChild(card);
  });

  container.innerHTML = "";
  container.appendChild(grid);
}

async function renderCollaborate(){
  const container = document.getElementById("viewContainer");
  container.innerHTML = `<div class="loading-state">Loading projects...</div>`;

  const { data: projects, error } = await supabaseClient
    .from("studios_projects")
    .select("*, studios_roles(id, filled)")
    .neq("status", "released")
    .order("created_at", { ascending:false });

  if (error || !projects || projects.length === 0){
    container.innerHTML = `
      <div class="project-grid">
        <div class="empty-state">
          <h4>No open projects right now</h4>
          <p>Be the first to start one.</p>
        </div>
      </div>`;
    return;
  }

  const grid = document.createElement("div");
  grid.className = "project-grid";
  projects.forEach(project => {
    const openRoles = (project.studios_roles || []).filter(r => !r.filled).length;
    const card = document.createElement("div");
    card.className = "project-card";
    card.innerHTML = `
      <span class="project-status ${project.status}">${escapeHtml(project.status)}</span>
      <div class="project-title">${escapeHtml(project.title)}</div>
      <div class="project-logline">${escapeHtml(project.logline || "No logline yet.")}</div>
      <div class="project-footer">
        <span>${escapeHtml(project.genre || "Unspecified genre")}</span>
        <span>${openRoles} open role${openRoles === 1 ? "" : "s"}</span>
      </div>`;
    card.addEventListener("click", () => { window.location.href = `studios-project.html?id=${project.id}`; });
    grid.appendChild(card);
  });

  container.innerHTML = "";
  container.appendChild(grid);
}

async function createProject(){
  const title = document.getElementById("projectTitle").value.trim();
  const logline = document.getElementById("projectLogline").value.trim();
  const genre = document.getElementById("projectGenre").value.trim();

  if (!title){ alert("Enter a title."); return; }

  const { data, error } = await supabaseClient
    .from("studios_projects")
    .insert({ creator_id: currentUser.id, title, logline, genre })
    .select().single();

  if (error){ console.error(error); alert("Couldn't create project."); return; }

  window.location.href = `studios-project.html?id=${data.id}`;
}

initialize();
</script>
</body>
</html>
