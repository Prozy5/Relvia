<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Filmmaker Profile — Relvia Studios</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --background:#0a0806; --glass:rgba(18,14,10,.6); --surface-light:#1c150d; --surface:rgba(20,16,11,.78);
  --border:#2a2018; --border-soft:#1c1610; --gold-start:#f2c766; --gold-end:#b9832f; --gold:#e0b158;
  --text:#f5f1ea; --muted:#a89e8f; --muted-soft:#6b6255;
  --font-display:"Playfair Display",serif; --font-body:"Inter",sans-serif;
}
*{ margin:0; padding:0; box-sizing:border-box; font-family:var(--font-body); }
body{
  color:var(--text); min-height:100vh;
  background:
    radial-gradient(ellipse 900px 500px at 15% -5%, rgba(217,169,75,.10), transparent 60%),
    var(--background);
  background-attachment:fixed;
}
a{ text-decoration:none; color:inherit; }
button{ cursor:pointer; border:none; background:none; color:inherit; font-family:inherit; font-size:inherit; }
img{ max-width:100%; display:block; }

.topbar{
  position:sticky; top:0; height:72px; display:flex; align-items:center; justify-content:space-between;
  padding:0 30px; background:rgba(5,5,5,.85); backdrop-filter:blur(18px); border-bottom:1px solid var(--border-soft); z-index:50;
}
.brand{ display:flex; align-items:center; gap:12px; }
.brand-badge{
  width:34px; height:34px; border-radius:50%; background:#000;
  background-image:radial-gradient(circle at 32% 22%, rgba(242,199,102,.28), transparent 65%);
  border:1.5px solid var(--gold-end); display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-style:italic; font-weight:700; font-size:17px; color:var(--gold-start);
}
.brand-name{ font-family:var(--font-display); font-weight:700; font-size:17px; }
.back-link{ font-size:13px; font-weight:700; color:var(--muted); }
.back-link:hover{ color:var(--gold); }

.container{ max-width:900px; margin:auto; padding:40px 24px 80px; }

.profile-header{ display:flex; align-items:center; gap:20px; margin-bottom:36px; }
.profile-avatar{
  width:88px; height:88px; border-radius:50%; overflow:hidden; background:#1a1a1a;
  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:30px; flex-shrink:0;
}
.profile-name{ font-family:var(--font-display); font-size:28px; font-weight:600; }
.profile-handle{ color:var(--muted); font-size:14px; margin-top:3px; }
.profile-stats{ display:flex; gap:24px; margin-top:12px; }
.profile-stat b{ font-size:16px; font-weight:800; }
.profile-stat span{ font-size:11.5px; color:var(--muted); margin-left:5px; }

.section-title{ font-family:var(--font-display); font-size:19px; font-weight:600; margin:30px 0 16px; }
.film-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:18px; }
.film-card{ cursor:pointer; }
.film-thumb{
  aspect-ratio:16/9; background:linear-gradient(135deg,#1c1a15,#0d0d0d 55%,#1a1508);
  border-radius:14px; overflow:hidden; position:relative; border:1px solid var(--border); margin-bottom:8px;
}
.film-thumb img{ width:100%; height:100%; object-fit:cover; }
.film-role-tag{ position:absolute; top:8px; left:8px; background:rgba(0,0,0,.7); color:var(--gold); font-size:10px; font-weight:800; padding:3px 9px; border-radius:6px; }
.film-title{ font-size:13.5px; font-weight:700; margin-bottom:2px; }
.film-meta{ font-size:11.5px; color:var(--muted); }

.empty-state{ text-align:center; color:var(--muted); padding:30px 0; grid-column:1/-1; font-size:13px; }
.loading-state{ text-align:center; color:var(--muted); padding:60px 0; }
</style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="index.html">
    <div class="brand-badge">R</div>
    <span class="brand-name">Relvia Studios</span>
  </a>
  <a class="back-link" href="index.html">← Back to Studios</a>
</header>

<div class="container" id="container">
  <div class="loading-state">Loading profile...</div>
</div>

<script>

const SUPABASE_URL = "https://nqcbhpqzzwjgkusfbexo.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5xY2JocHF6endqZ2t1c2ZiZXhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzNjY1NjEsImV4cCI6MjA5ODk0MjU2MX0.BphyIGT-X9ctYVvfYXw_ldo5XGguNv5j-zDiGBPrCVU";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const params = new URLSearchParams(window.location.search);
const targetUserId = params.get("user");

function escapeHtml(str){
  return (str || "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function avatarInnerHTML(url, name){
  return url ? `<img src="${url}" style="width:100%;height:100%;object-fit:cover;">` : (name || "R").charAt(0).toUpperCase();
}

async function initialize(){
  if (!targetUserId){
    document.getElementById("container").innerHTML = `<div class="empty-state">No filmmaker specified.</div>`;
    return;
  }

  const { data: profile, error } = await supabaseClient.from("profiles").select("*").eq("id", targetUserId).maybeSingle();
  if (error || !profile){
    document.getElementById("container").innerHTML = `<div class="empty-state">This filmmaker doesn't exist.</div>`;
    return;
  }

  // Films they created (as the project owner).
  const { data: createdProjects } = await supabaseClient
    .from("studios_projects").select("*, studios_films(*)").eq("creator_id", targetUserId).eq("status", "published");

  // Projects they collaborated on but didn't create.
  const { data: collabRows } = await supabaseClient
    .from("studios_project_members").select("project_id, role_name").eq("user_id", targetUserId);

  let collaboratedFilms = [];
  if (collabRows && collabRows.length > 0){
    const projectIds = collabRows.map(r => r.project_id);
    const { data: collabProjects } = await supabaseClient
      .from("studios_projects").select("*, studios_films(*)").in("id", projectIds).eq("status", "published");

    collaboratedFilms = (collabProjects || []).map(p => ({
      ...p,
      role_name: collabRows.find(r => r.project_id === p.id)?.role_name || "Collaborator",
    }));
  }

  const totalFilms = (createdProjects || []).length + collaboratedFilms.length;
  const totalViews = [...(createdProjects || []), ...collaboratedFilms]
    .reduce((sum, p) => sum + (p.studios_films?.[0]?.view_count || p.studios_films?.view_count || 0), 0);

  document.getElementById("container").innerHTML = `
    <div class="profile-header">
      <div class="profile-avatar">${avatarInnerHTML(profile.avatar_url, profile.display_name)}</div>
      <div>
        <div class="profile-name">${escapeHtml(profile.display_name || "Unknown")}</div>
        <div class="profile-handle">@${escapeHtml(profile.username || "unknown")}</div>
        <div class="profile-stats">
          <div class="profile-stat"><b>${totalFilms}</b><span>FILMS</span></div>
          <div class="profile-stat"><b>${totalViews}</b><span>TOTAL VIEWS</span></div>
        </div>
      </div>
    </div>

    <div class="section-title">Directed / Created</div>
    <div class="film-grid" id="createdGrid"></div>

    <div class="section-title">Collaborated On</div>
    <div class="film-grid" id="collabGrid"></div>
  `;

  renderFilmGrid("createdGrid", createdProjects || [], null);
  renderFilmGrid("collabGrid", collaboratedFilms, "role_name");
}

function renderFilmGrid(containerId, projects, roleField){
  const grid = document.getElementById(containerId);

  if (!projects || projects.length === 0){
    grid.innerHTML = `<div class="empty-state">Nothing here yet.</div>`;
    return;
  }

  grid.innerHTML = "";
  projects.forEach(project => {
    const film = Array.isArray(project.studios_films) ? project.studios_films[0] : project.studios_films;
    if (!film) return;

    const card = document.createElement("div");
    card.className = "film-card";
    card.innerHTML = `
      <div class="film-thumb">
        ${film.cover_url ? `<img src="${film.cover_url}">` : ""}
        ${roleField ? `<div class="film-role-tag">${escapeHtml(project[roleField])}</div>` : ""}
      </div>
      <div class="film-title">${escapeHtml(project.title)}</div>
      <div class="film-meta">${escapeHtml(project.genre || "Short Film")} · ${film.view_count || 0} views</div>`;
    card.addEventListener("click", () => { window.location.href = `../watch/?id=${project.id}`; });
    grid.appendChild(card);
  });
}

initialize();
</script>
</body>
</html>
